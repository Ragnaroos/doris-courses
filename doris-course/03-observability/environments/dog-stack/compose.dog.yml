# Course settings for the upstream DOG stack (docker/docker-compose.yaml in
# ai-observe-stack, at the commit pinned in doris_course/environment.py).
# ObservabilityLab.prepare_environment() runs, from that docker/ directory:
#
#   docker compose -p doris-obs -f docker-compose.yaml -f <this file> up -d
#
# with DORIS_OBS_COURSE_ROOT set to the course directory. Host ports bind to
# 127.0.0.1 only; each one can be changed with the variable named in it, and
# doris_course/environment.py uses the same names and defaults.
services:
  doris:
    image: apache/doris:all-in-one-4.1.3
    container_name: doris-obs
    ports: !override
      - "127.0.0.1:${DORIS_OBS_HTTP_PORT:-28030}:8030"
      - "127.0.0.1:${DORIS_OBS_QUERY_PORT:-29030}:9030"
      - "127.0.0.1:${DORIS_OBS_BE_HTTP_PORT:-28040}:8040"
    # Keep only the metadata and data in volumes, not the whole installation,
    # so a new image takes effect. Module 2 reads the FE log from the host.
    volumes: !override
      - fe_meta:/opt/apache-doris/fe/doris-meta
      - be_storage:/opt/apache-doris/be/storage
      - ${DORIS_OBS_COURSE_ROOT:?set DORIS_OBS_COURSE_ROOT}/.runtime/doris-logs/fe:/opt/apache-doris/fe/log
      - ${DORIS_OBS_COURSE_ROOT:?set DORIS_OBS_COURSE_ROOT}/.runtime/doris-logs/be:/opt/apache-doris/be/log

  otel-collector:
    container_name: doris-obs-otel-collector
    ports: !override
      - "127.0.0.1:${DORIS_OBS_OTLP_GRPC_PORT:-24317}:4317"
      - "127.0.0.1:${DORIS_OBS_OTLP_HTTP_PORT:-24318}:4318"

  grafana:
    container_name: doris-obs-grafana
    environment:
      - GF_SERVER_ROOT_URL=http://127.0.0.1:${DORIS_OBS_GRAFANA_PORT:-23000}/
    ports: !override
      - "127.0.0.1:${DORIS_OBS_GRAFANA_PORT:-23000}:3000"

volumes:
  fe_meta:
  be_storage:

networks:
  aiobs-net:
    name: doris-obs
