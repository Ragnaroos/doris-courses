title: "Module 8 Quiz: Alerting with Grafana"
description: Six questions check whether you can define the evaluated metric, reason about time-based
  alert conditions, separate routing from evaluation, and interpret alert evidence at the correct scope.
questions:
- id: choose_alert_expression
  objective: Align the alert query with the monitored signal
  prompt: The team must notify operators when Doris node CPU utilization exceeds a threshold. CPU data
    is stored in otel_metrics_gauge with metric_name = 'system.cpu.utilization' and the utilization value
    in value. Which alert expression is appropriate?
  options:
  - id: count_rows
    text: Count all rows in the gauge table and alert when the row count is high
  - id: inspect_logs
    text: Search for the word CPU in log bodies and treat every match as a node utilization value
  - id: dashboard_title
    text: Count executions of the dashboard query and alert when that count is high
  - id: gauge_value
    text: Filter the gauge table to the CPU metric and evaluate each node's value against the threshold
  answer: gauge_value
  explanation: The alert must evaluate the numeric CPU-utilization samples. Counting unrelated rows or
    matching text does not measure the resource condition.
- id: predict_duration_condition
  objective: Predict a sustained-threshold alert state
  prompt: An alert condition is true when CPU utilization is above 90% continuously for 10 minutes. Samples
    for one node are 96%, 96%, and 94%, but the interval between them contains a drop below 90%. What
    should happen?
  options:
  - id: not_firing
    text: The sustained condition is broken, so the alert should not become firing only because three
      sampled values were above 90%
  - id: firing
    text: The alert fires because three above-threshold samples are always equivalent to ten continuous
      minutes
  - id: permanent
    text: The alert fires permanently after the first above-threshold sample
  - id: no_data
    text: The alert stays normal for the rest of the day after the first below-threshold sample
  answer: not_firing
  explanation: A duration condition depends on continuity, not only on selected samples. A drop below
    the threshold within the evaluation window breaks the sustained condition.
- id: distinguish_contact_point_and_policy
  objective: Separate notification destination from routing
  prompt: A Grafana team needs email delivery for alerts, and some alert groups must route to different
    recipients by service. Which responsibility split is correct?
  options:
  - id: dashboard
    text: Alert rules embed their recipients directly; contact points are optional display labels
  - id: metric
    text: The metric table chooses the recipient from the value column
  - id: split
    text: The contact point defines how to send the notification; the notification policy controls which
      alerts are routed to that contact point
  - id: reverse
    text: The contact point selects recipients for every rule; notification policies only format the message
  answer: split
  explanation: A contact point is the delivery integration, such as email. Notification policies match
    and route alert instances to contact points, which allows different groups to reach different recipients.
- id: preserve_node_dimension
  objective: Keep alert grouping useful for diagnosis
  prompt: CPU alerts must tell operators which Doris node is affected. The metric has a node-identifying
    dimension. Which alert configuration preserves that requirement?
  options:
  - id: body_only
    text: Replace the node dimension with the generic message CPU high
  - id: random_node
    text: Select one node label when the rule is created and reuse it for every firing instance
  - id: keep_dimension
    text: Evaluate per-node series and preserve the node dimension in the alert labels and message
  - id: drop_dimension
    text: Aggregate all nodes into one unlabeled value before evaluation
  answer: keep_dimension
  explanation: The alert must preserve the dimension that operators need for action. Collapsing or discarding
    the node identifier makes a firing alert less actionable even when the threshold is correct.
- id: interpret_one_delivery
  objective: Interpret a successful notification as scoped evidence
  prompt: One test alert produces one email. The alert rule is enabled, but no multi-hour traffic test
    has been run. Which conclusion is best supported?
  options:
  - id: path_works
    text: The notification path can deliver at least one alert; it does not prove grouping, recovery,
      or repeated delivery behavior
  - id: all_future
    text: Every future high-CPU condition will produce exactly one correctly routed email
  - id: metric_accuracy
    text: The email proves the CPU metric values are accurate
  - id: all_folder_rules
    text: The email proves every alert rule in the folder is routed to that contact point
  answer: path_works
  explanation: One delivery tests the configured destination once. Grouping, silencing, recovery notifications,
    and repeated evaluation are separate behaviors that require their own validation.
- id: distinguish_missing_data_from_low_value
  objective: Distinguish no data from a normal metric value
  prompt: A CPU-utilization series stops reporting for several minutes while other nodes continue. The
    alert threshold is value > 90%. Which handling is most defensible?
  options:
  - id: delete_series
    text: Use the last observed value indefinitely and continue evaluating it as current
  - id: no_data_state
    text: Treat no data as its own state and define whether it alerts; do not interpret absence as 0%
      or as proof that CPU is healthy
  - id: low_cpu
    text: Convert missing samples to 0% and report healthy CPU
  - id: always_fire
    text: Treat every missing sample as 100% and fire every alert
  answer: no_data_state
  explanation: Missing telemetry is not a measured low value. The alert rule should define an explicit
    no-data behavior so an instrumentation or network failure is not silently reported as a healthy node.
