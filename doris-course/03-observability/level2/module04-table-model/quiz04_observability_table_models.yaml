title: 'Module 4 Quiz: Table Models for Observability Data'
description: Six questions check whether you can choose a table model from what happens to rows that share
  a key, keep raw telemetry, choose the grain of a summary, predict its merges, build a stable alert identity,
  and read a UNIQUE table.
questions:
- id: choose_model_for_recount
  objective: Choose DUPLICATE, AGGREGATE, or UNIQUE from what must happen to rows that share a key.
  prompt: Every 10 minutes, a job counts the calls between each pair of services for each of the last
    10 minutes. Each run therefore writes the minute in which the previous run started a second time,
    now with its complete count. Which model keeps one correct count per minute and pair of services?
  options:
  - id: unique_latest
    text: UNIQUE on the minute and the two services, so that the later, complete count replaces the partial
      one
  - id: aggregate_sum
    text: AGGREGATE with a SUM count, so that the two counts of that minute are added up into one row
  - id: duplicate_both
    text: DUPLICATE, so that both counts are kept and every query takes the larger of the two
  - id: aggregate_min
    text: AGGREGATE with a MIN count, so that the first run's count is kept and later runs change nothing
  answer: unique_latest
  explanation: 'This is why the exporter''s otel_traces_graph is a UNIQUE table: rows with the same key
    replace each other, and the run that saw the whole minute writes last. A SUM would add the partial
    count to the complete one and overcount the minute. DUPLICATE would keep two rows, and every query
    would have to choose between them. MIN would keep the partial count, which is too low.'
- id: keep_spans_with_one_key
  objective: Explain why raw logs, spans, and metric points belong in DUPLICATE tables.
  prompt: 'In otel_traces, whose key is service_name and timestamp, twelve frontend spans share one key:
    they started in the same millisecond and have twelve different span IDs. What would a UNIQUE table
    with the same key do with them?'
  options:
  - id: keep_one
    text: Keep one of the twelve and lose the other eleven, which are separate events
  - id: keep_all_unique
    text: Keep all twelve, because UNIQUE compares every column of a row, not only its key
  - id: reject_load
    text: Reject the whole load, because a UNIQUE table refuses rows whose key it already has
  - id: merge_spans
    text: Combine the twelve into one row that lists all twelve span IDs in its value column
  answer: keep_one
  explanation: 'A UNIQUE table keeps one row per key, the one loaded last, so eleven spans would be lost,
    although each is a separate event with its own span ID. Raw telemetry therefore uses DUPLICATE, which
    keeps every row and uses the key only to order the rows. UNIQUE compares the key columns, not the
    whole row; it replaces rows instead of rejecting the load; and no model lists the values of combined
    rows: AGGREGATE combines them by the functions of its value columns.'
- id: choose_summary_grain
  objective: Choose the key of an AGGREGATE table at the grain of the questions that it answers.
  prompt: A dashboard shows each service's requests and failed requests per minute. Which key gives an
    AGGREGATE table with SUM columns one row per service and minute?
  options:
  - id: minute_and_service
    text: The minute in which each request ended, and service_name
  - id: span_timestamp
    text: Each span's timestamp, to the microsecond, and service_name
  - id: trace_and_service
    text: trace_id and service_name, so that each request keeps its own row
  - id: service_only
    text: service_name alone, with each request's minute in a SUM column
  answer: minute_and_service
  explanation: 'The key is the grain: rows with the same minute and service combine into one, whose SUM
    columns hold the counts, and counting each request in the minute in which it ended counts it after
    it reached Doris. With the timestamp in the key, only spans of the same microsecond combine, and the
    table is almost as large as otel_traces. A trace ID in the key keeps a row per request, which is no
    summary. With service_name alone, every minute of a service combines into one row, and a sum of minutes
    means nothing.'
- id: predict_repeated_load
  objective: Predict the rows of an AGGREGATE table after overlapping or repeated loads.
  prompt: requests_per_minute has the key (request_minute, service_name) and requests BIGINT SUM. One
    INSERT loads 4 requests of cart at 10:05, and a second INSERT loads 7 more. By mistake, the second
    INSERT runs again. What does the table hold for cart at 10:05?
  options:
  - id: eighteen
    text: One row with requests = 18, that is, 4 + 7 + 7
  - id: eleven
    text: One row with requests = 11, because Doris skips the repeated INSERT
  - id: three_rows
    text: Three rows, one for each INSERT, with 4, 7, and 7 requests
  - id: seven
    text: One row with requests = 7, the value of the last INSERT
  answer: eighteen
  explanation: 'SUM adds the values of every row with the same key, and an AGGREGATE table cannot tell
    a repeated row from a new one: the repeated INSERT adds 7 again, without any error. Doris does not
    detect that an INSERT repeats an earlier one, so a load job must load each source row exactly once.
    Rows with the same key combine into one, so there are not three rows, and keeping the last value is
    what UNIQUE or a REPLACE column does, not SUM.'
- id: stable_alert_identity
  objective: Build an alert identity that stays the same for every occurrence of an error.
  prompt: recommendation's flag stream fails with DEADLINE_EXCEEDED every 10 minutes, and each status
    message contains the time of the failure. Which alert identity gives all of these failures one row
    per day in error_alerts?
  options:
  - id: normalized_hash
    text: MD5 of the service, the span name, and the message with every number replaced by 0
  - id: message_hash
    text: MD5 of the service, the span name, and the message exactly as the span recorded it, digits included
  - id: span_id
    text: The span ID of each error span, which identifies each failure without any doubt
  - id: trace_hash
    text: MD5 of the trace ID and the message, so that each request's errors share a row
  answer: normalized_hash
  explanation: An identity must ignore what changes from one occurrence to the next. The time in the message
    changes every time, so a hash of the message as recorded gives every failure a new identity, and a
    new alert. Replacing the numbers keeps the words that name the problem. A span ID and a trace ID are
    different for every failure by design, so either would raise an alert for each one.
- id: read_one_alert_row
  objective: Predict which row a UNIQUE table keeps, and what one row says about occurrences.
  prompt: error_alerts has the key (alert_date, alert_hash) and no sequence column. The payment failure's
    alert has one row, open. A job writes it again as resolved; a minute later, another job loads all
    of today's error spans as open. What does the table show?
  options:
  - id: open_one_row
    text: One row, open again because that load came last; it does not say how often the error occurred
  - id: resolved_kept
    text: One row, still resolved, because a resolved alert cannot be opened again by a later load of
      older errors
  - id: two_rows
    text: Two rows, one open and one resolved, which together count the error's occurrences
  - id: row_per_span
    text: One open row for each error span of the day, because each span is loaded as a new row
  answer: open_one_row
  explanation: 'Without a sequence column, UNIQUE keeps the row loaded last, so the late load of open
    rows replaces the resolved one. A sequence column, such as the time of the last error, would keep
    the resolved row until a newer error arrives. Rows with the same key never stand side by side in a
    UNIQUE table, so there are neither two rows nor one per span, and the single row is a current state:
    the payment alert has one row while otel_traces has an error span for every failed order.'
