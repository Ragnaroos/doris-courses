title: "Module 6 Quiz: Table Properties, Materialized Views, and Indexes"
description: Six questions check whether you can distinguish storage compression, Materialized View (MV)
  acceleration, and inverted-index filtering, and judge what plan or profile evidence proves.
questions:
- id: choose_compression_for_cold_logs
  objective: Choose compression from workload priorities
  prompt: A log table is growing quickly. The team expects high redundancy across message text, prioritizes
    storage reduction on older data, and can accept more CPU work during compression. Which table property
    is the most appropriate?
  options:
  - id: zstd
    text: compression = zstd
  - id: lz4
    text: compression = lz4, because it always stores fewer bytes than ZSTD
  - id: partition
    text: A daily partition, because partitioning is a compression algorithm
  - id: index
    text: An inverted index, because indexes replace data-file compression
  answer: zstd
  explanation: ZSTD generally provides a better compression ratio than the default LZ4 and is suited to
    logs and cold data, with a speed tradeoff. Partitioning and indexing solve different problems.
- id: choose_mv_for_repeated_aggregate
  objective: Choose an MV for a repeated single-table aggregate
  prompt: Dashboards repeatedly run the same MAX(value) query grouped by metric_name on a large metrics
    table. The team wants Doris to accelerate the aggregate while continuing to query the base table.
    Which option fits?
  options:
  - id: dashboard_cache
    text: Store the maximum only in Grafana, because Doris cannot materialize aggregates
  - id: sync_mv
    text: Create a single-table aggregate MV and rely on transparent query rewriting
  - id: inverted_text
    text: Add an inverted index to metric_name, because it materializes the maximum value
  - id: duplicate_copy
    text: Create a DUPLICATE copy of every raw metric row
  answer: sync_mv
  explanation: A single-table aggregate MV stores the precomputed result. The optimizer can rewrite a
    matching aggregate over the base table to use the MV, so applications do not need to query the MV
    name explicitly.
- id: interpret_explain_mv_evidence
  objective: Interpret plan evidence for one MV rewrite
  prompt: A simplified EXPLAIN plan for a base-table query contains a scan of mv_metrics_max instead of
    the base metrics table. The aggregate and grouping match the MV. What does this evidence support?
  options:
  - id: all_queries
    text: That all queries against the base table will use the MV
  - id: aggregate_columns_removed
    text: That the base table no longer stores any columns used by the aggregate
  - id: alert
    text: That an alert rule has been created on the MV
  - id: this_query
    text: That this query plan was rewritten to use the MV; it does not prove every future query shape
      will match
  answer: this_query
  explanation: EXPLAIN evidence applies to the submitted query and plan. MV rewriting depends on matching
    structure, grouping, and aggregate expressions, so the result cannot be generalized to unrelated query
    shapes.
- id: explain_mv_structural_mismatch
  objective: Explain why an MV expression does not match
  prompt: An MV groups by date_trunc(event_time, 'day'). A query groups by date_format(event_time, '%Y-%m-%d').
    EXPLAIN scans the base table. What is the most likely reason?
  options:
  - id: structural_match
    text: Doris uses structural matching; the two different time expressions do not match, so storing
      the raw event_time in the MV is more reusable
  - id: date_type
    text: MV rewriting never supports time columns
  - id: explain_limit
    text: EXPLAIN can show only base tables, even when the MV is used
  - id: compression
    text: ZSTD compression disables MV rewrites for date columns
  answer: structural_match
  explanation: MV rewrite matching is structural. Different expressions are not interchangeable merely
    because they represent the same calendar day. Keeping a raw time column in the MV allows the optimizer
    to derive more query expressions from it.
- id: interpret_inverted_index_profile
  objective: Interpret index-filter evidence without overclaiming
  prompt: 'A scan profile for WHERE service_name = ''checkout'' contains RowsInvertedIndexFiltered: 8.4K.
    Which conclusion is best supported?'
  options:
  - id: no_scan
    text: The counter proves Doris read no data from any file
  - id: table_created
    text: The counter alone proves the table is partitioned by service_name
  - id: filtered_rows
    text: The inverted index filtered candidate rows in this scan; it does not prove every part of query
      latency or every future query is optimized
  - id: all_latency
    text: The counter proves all 8.4K rows caused the entire query latency
  answer: filtered_rows
  explanation: The counter is evidence that the inverted index removed candidate rows during this scan.
    By itself, it does not attribute total elapsed time or establish behavior for unrelated predicates.
- id: map_property_to_requirement
  objective: Distinguish compression, partitioning, and indexing
  prompt: 'A team has three goals: reduce data-file size for cold logs, retain data by day, and accelerate
    keyword filtering on a text body. Which mapping addresses the goals without conflating their responsibilities?'
  options:
  - id: partition_all
    text: A daily partition, because it compresses text and evaluates keyword expressions
  - id: mv_text
    text: An unpartitioned MV containing the original text, because its rows control retention and compression
  - id: mapped
    text: ZSTD compression, range partitions by time, and an inverted index on the text body
  - id: inverted_all
    text: One inverted index on every column, because it also performs retention and compression
  answer: mapped
  explanation: Compression reduces stored bytes, range partitioning enables time-based pruning and lifecycle
    management, and an inverted index accelerates matching predicates on text or other non-key columns.
