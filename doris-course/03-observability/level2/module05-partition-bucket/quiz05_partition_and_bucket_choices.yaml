title: "Module 5 Quiz: Partitioning and Bucketing for Observability Data"
description: Six questions check whether daily, monthly, hourly, dynamic, and automatic partitioning answer
  different retention and analysis needs, and whether HASH, RANDOM, and automatic bucket choices match
  the access pattern.
questions:
- id: choose_daily_partition_granularity
  objective: Choose partition granularity from retention and query grain
  prompt: A logs table keeps 180 days of data. Queries and retention operations are performed independently
    for each calendar day; hourly detail is not required at the partition level. Which range-partition
    grain is the most appropriate?
  options:
  - id: monthly
    text: One monthly partition for each month
  - id: single
    text: One partition containing all 180 days
  - id: daily
    text: Daily partitions
  - id: hourly
    text: Hourly partitions for every day
  answer: daily
  explanation: Daily partitions align with day-level query pruning and retention. Hourly partitions create
    unnecessary metadata, while monthly or single partitions cannot independently manage one day's data.
- id: predict_dynamic_partition_retention
  objective: Predict dynamic-partition retention
  prompt: A dynamic-partition table uses time_unit = DAY, start = -14, and end = 2. History creation is
    enabled and requests 20 historical partitions. How many historical partitions should remain after
    creation?
  options:
  - id: fourteen
    text: '14'
  - id: twenty
    text: '20'
  - id: two
    text: '2'
  - id: twenty_two
    text: '22'
  answer: fourteen
  explanation: The start value defines the retention boundary. Requesting 20 historical partitions cannot
    retain partitions outside that boundary, so only the most recent 14 historical days are kept.
- id: choose_auto_partition_for_sparse_data
  objective: Choose automatic partitioning for irregular arrival
  prompt: Event files arrive on some days but not others. The team wants Doris to create only the partitions
    needed by arriving data and does not need automatic age-based deletion. Which partition strategy fits
    best?
  options:
  - id: one_bucket
    text: No partition, but one bucket for all historical data
  - id: auto
    text: AUTO PARTITION on the day-truncated event time
  - id: dynamic_dense
    text: Dynamic partitioning that pre-creates every calendar day
  - id: static_monthly
    text: A single manually created monthly partition
  answer: auto
  explanation: AUTO PARTITION creates partitions when matching data arrives, which avoids empty pre-created
    partitions for sparse dates. Dynamic partitioning is more useful when predictable creation and TTL
    deletion are required.
- id: choose_random_bucket_for_skew
  objective: Choose bucketing for a skewed append-only workload
  prompt: A DUPLICATE logs table is usually queried over bounded time ranges and rarely filtered by service_name.
    Ninety-eight percent of rows have one service_name, and HASH bucketing on that column creates one
    dominant tablet. Which bucket strategy best fits these conditions?
  options:
  - id: hash_service
    text: HASH bucketing on service_name, because the skew will disappear after compaction
  - id: one_bucket
    text: One bucket, because fewer tablets always improve scan performance
  - id: partition_key
    text: Put service_name in the partition key and remove time partitioning
  - id: random
    text: RANDOM bucketing, accepting less bucket pruning in exchange for even distribution
  answer: random
  explanation: RANDOM bucketing spreads append-only DUPLICATE rows evenly and avoids a hot tablet. The
    tradeoff is that a filter on a bucket column cannot prune buckets, which is acceptable when bounded-range
    or full scans dominate.
- id: predict_bucket_pruning_scope
  objective: Predict which pruning levels can apply
  prompt: A table is partitioned by day and bucketed with HASH(service_name). A query constrains the timestamp
    to one day but has no filter on service_name. Which pruning can normally apply?
  options:
  - id: partition_only
    text: Partition pruning can remove other days; bucket pruning on service_name cannot apply
  - id: bucket_only
    text: Bucket pruning can remove buckets, but the query must scan every partition
  - id: both
    text: Both partition and bucket pruning can target the same reduced set
  - id: neither
    text: Neither pruning can apply unless service_name is selected in the output
  answer: partition_only
  explanation: The timestamp predicate supports range-partition pruning. HASH bucket pruning needs a usable
    predicate on the bucket column, so a query without service_name must scan the selected day's relevant
    buckets.
- id: choose_auto_bucket_count
  objective: Choose automatic bucket sizing for variable volume
  prompt: Daily compressed volume for one partition ranges from 5 GB to 80 GB as traffic changes. The
    team wants to avoid manually recalculating a bucket count as volume grows. Which distribution choice
    is most appropriate?
  options:
  - id: fixed_huge
    text: A very large fixed bucket count that never needs review
  - id: dynamic_bucket_property
    text: Put the bucket count only in a dynamic-partition property and omit the distribution clause
  - id: auto_buckets
    text: BUCKETS AUTO, letting Doris calculate an appropriate bucket count
  - id: fixed_one
    text: BUCKETS 1, because bucket count is unrelated to scan parallelism
  answer: auto_buckets
  explanation: Automatic bucket sizing adapts the physical distribution as partition volume changes. A
    fixed count can become too small for large partitions or create unnecessary metadata for small ones.
