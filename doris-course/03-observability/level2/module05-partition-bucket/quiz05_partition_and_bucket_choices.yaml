title: 'Module 5 Quiz: Partitioning and Bucketing for Observability Data'
description: Six questions check whether you can explain partitions, buckets, and tablets, predict partition
  pruning and dynamic partitions, choose a partition grain and method, choose a bucketing, and explain
  the number of buckets.
questions:
- id: count_tablets
  objective: Explain how Doris divides a table into partitions, buckets, and tablets.
  prompt: otel_traces has 5 daily partitions of 10 buckets each, with one replica. How many tablets does
    it have, and which of them does a scan of one partition read?
  options:
  - id: fifty_in_partition
    text: 50 tablets; the scan reads the 10 tablets of that partition, in parallel
  - id: ten_shared
    text: 10 tablets that all partitions share; the scan reads all 10 of them
  - id: five_one
    text: 5 tablets, one per partition; the scan reads the partition's one tablet
  - id: fifty_all
    text: 50 tablets; any scan reads all 50, since buckets reach across partitions
  answer: fifty_in_partition
  explanation: 'Doris stores each bucket of each partition as a tablet: 5 partitions of 10 buckets make
    50 tablets. A scan opens only the tablets of the partitions that it reads, here 10, and reads them
    in parallel. Buckets divide each partition; they are not shared between partitions, and a partition
    is not a single tablet unless it has one bucket.'
- id: predict_partition_pruning
  objective: Predict which partitions a query reads from its filter on the partition column.
  prompt: In a fresh environment, EXPLAIN shows partitions=1/5 for a query of otel_traces with timestamp
    >= a time an hour ago, and also partitions=1/5 for the same query without any filter on time. What
    explains the second plan?
  options:
  - id: empty_skipped
    text: Only today's partition holds rows, and Doris also skips partitions that are empty
  - id: filter_ignored
    text: Doris ignored the time filter in the first plan too, so both read the same partition
  - id: service_pruning
    text: Doris pruned the partitions by service_name, which every query of otel_traces implies
  - id: plan_cache
    text: Doris reused the plan of the first query from its SQL cache for the second one
  answer: empty_skipped
  explanation: Pruning keeps the partitions whose range can hold matching rows, and Doris also leaves
    out partitions without any rows. In a fresh environment only today's partition has data, so both plans
    read it; on a week of telemetry, the query without a time filter would read every partition, while
    the first would still read one. The first plan did apply its filter; the partitions are by time, not
    by service; and the SQL cache keeps results of repeated identical queries, not plans for others.
- id: predict_dynamic_partitions
  objective: Predict which partitions dynamic partitioning creates and drops.
  prompt: A table is created with dynamic partitioning by DAY, start = -7, end = 1, and history_partition_num
    = 10. Which partitions does it have right after it is created?
  options:
  - id: seven_today_tomorrow
    text: The 7 days before today, today, and tomorrow
  - id: ten_today_tomorrow
    text: The 10 days before today, today, and tomorrow
  - id: today_only
    text: Only today's; past days get partitions when their data arrives
  - id: no_tomorrow
    text: The 7 days before today and today; tomorrow's comes at midnight
  answer: seven_today_tomorrow
  explanation: 'Dynamic partitioning creates the partitions up to end, here tomorrow, and history_partition_num
    creates past ones with the table, but never beyond start: of 10 requested past days, 7 are created.
    Afterwards, the scheduler creates and drops partitions every 10 minutes. Partitions that arriving
    data creates are AUTO PARTITION''s behavior, and end = 1 creates tomorrow''s partition before midnight.'
- id: choose_partitioning
  objective: Choose a partition grain and a partitioning method for a retention period and a query pattern.
  prompt: A service writes about 2 GB of logs a day. Queries cover the last minutes to hours, and the
    logs are kept for 30 days. Which partitioning fits best?
  options:
  - id: daily_retention
    text: Daily partitions on the log time, whose dynamic partitioning drops the days older than 30
  - id: hourly_forever
    text: Hourly partitions on the log time, created ahead of time and without a start, so that no log
      line is ever lost
  - id: monthly
    text: Monthly partitions, since a query can still filter one day inside a month's partition
  - id: unpartitioned_delete
    text: No partitions, and a DELETE every night of the rows that are older than 30 days
  answer: daily_retention
  explanation: Daily partitions prune these queries to a day or two, and retention drops a day at a time
    without rewriting data. Hourly partitions multiply the tablets by 24 for 2 GB a day, and without a
    start they are never dropped, so the table grows until the disk is full. A monthly partition can be
    filtered by day, but each query reads the whole month to find the day, and retention drops a month
    at a time. A DELETE rewrites data and costs far more than dropping a partition.
- id: choose_bucketing
  objective: Choose HASH or RANDOM bucketing from a table's filters and the distribution of its data.
  prompt: Bucketed by HASH(service_name) into 10 buckets, a copy of the spans reads one tablet for service_name
    = 'payment', but one tablet holds 38% of the rows and another none. Its users mostly look up whole
    traces by trace_id. Which distribution fits them best?
  options:
  - id: hash_trace
    text: 'HASH(trace_id): its values spread the rows evenly, and a lookup reads one tablet per partition'
  - id: more_service_buckets
    text: HASH(service_name) with 100 buckets, which spreads each busy service over more tablets
  - id: random_lookup
    text: RANDOM, which keeps the tablets even and still reads only one tablet when a query looks up a
      trace_id
  - id: one_bucket
    text: One bucket per partition, so that every lookup reads exactly one tablet of a partition
  answer: hash_trace
  explanation: 'Bucket by the column that most queries filter on with =, when it spreads the rows evenly.
    Trace IDs are random, and no trace holds more than a few dozen spans, so the tablets stay even, and
    a lookup of one trace reads one tablet of each partition that it scans. More buckets do not split
    a service: all rows with one value hash to one bucket. RANDOM keeps tablets even but cannot prune
    any bucket. One bucket per partition does read one tablet, but that tablet is the whole partition.'
- id: explain_auto_buckets
  objective: Explain how Doris sets the number of buckets of each partition.
  prompt: The exporter's otel_traces says DISTRIBUTED BY RANDOM BUCKETS AUTO, and the course's partitions
    hold a few megabytes each, yet every partition has 10 buckets. Why?
  options:
  - id: default_then_floor
    text: Partitions made with the table got dynamic_partition.buckets, 10; later estimates below half
      of it are ignored
  - id: hash_only
    text: BUCKETS AUTO works only for HASH tables, so a RANDOM table gets the default of 10 buckets for
      each of its partitions
  - id: per_megabyte
    text: Doris estimates one bucket for each megabyte of a partition's data, and each partition holds
      about 10 MB
  - id: per_disk
    text: Doris creates one bucket for each disk of the cluster, and the course's Docker host has 10 disks
  answer: default_then_floor
  explanation: The partitions that Doris creates together with the table get dynamic_partition.buckets,
    10. For later partitions, BUCKETS AUTO estimates from the sizes of the earlier ones, here 1 bucket,
    and when an estimate is below half of the previous partition's number, Doris keeps the previous number.
    BUCKETS AUTO works for RANDOM tables too; the estimate is about one bucket up to 100 MB and one per
    5 GB beyond, not one per megabyte; and the cluster's disks only cap the number.
