title: 'Module 3 Quiz: Visualizing Observability Data'
description: Six questions check whether you can search logs in Discover, explain a quiet error search,
  set a time range that matches Doris, find where a trace's error starts, measure a host's CPU, and use
  Grafana's time macros.
questions:
- id: search_failed_checkouts
  objective: Search logs in the Discover page of the Doris App with Lucene and with SQL conditions.
  prompt: The load generator sends POST /api/checkout, and the storefront page sends POST /api/checkout?currencyCode=USD.
    Which Discover search finds the checkouts of both that ended with HTTP status 500, and only those?
  options:
  - id: two_phrases
    text: body:"POST /api/checkout" AND body:"HTTP/1.1 500"
  - id: one_phrase
    text: body:"POST /api/checkout HTTP/1.1 500"
  - id: either_phrase
    text: body:"POST /api/checkout" OR body:"HTTP/1.1 500"
  - id: severity
    text: severity_number:>=17 AND body:checkout
  answer: two_phrases
  explanation: 'A quoted phrase matches its words next to each other, in order. Two phrases joined with
    AND match both kinds of line: the page''s query string stands between checkout and HTTP, but each
    phrase still matches. The single long phrase misses the page''s requests, because the words currencycode
    and usd break it. OR finds every checkout and every response with status 500. The access log has no
    severity, so a severity condition finds none of these lines.'
- id: explain_quiet_error_search
  objective: Explain why a search by severity misses failures that a service does not log as errors.
  prompt: During the incident, severity_number:>=17 over the last hour finds only a few errors of the
    Doris FE, none about payments. Which explanation is best supported?
  options:
  - id: not_logged_as_errors
    text: The failing services send no logs, and the access log lines of the failures have no severity
  - id: no_failures
    text: No orders failed during that hour, because every failure leaves a log record of severity ERROR
  - id: hidden_from_visitors
    text: Discover hides the error logs of the demo's services unless you sign in to Grafana
  - id: other_scale
    text: The demo's services use their own scale, on which severity_number 17 means INFO
  answer: not_logged_as_errors
  explanation: A severity search finds only what the sources log as errors. Payment and checkout send
    no logs to a Collector, and the proxy's access log, which records every failed checkout with status
    500, has severity_number 0. A quiet error search is therefore no evidence that nothing failed. Discover
    shows the same rows to every visitor, and severity_number puts all sources on one OpenTelemetry scale,
    on which 17 to 20 is ERROR.
- id: fix_empty_time_range
  objective: Set a time range that matches how Doris stores time.
  prompt: On a computer in UTC+8, Discover shows no hits for Last 15 minutes, while a SQL query finds
    rows stamped one minute ago. What explains it, and what fixes it?
  options:
  - id: absolute_utc_range
    text: The app compares local times with UTC times in Doris; set an absolute range in UTC
  - id: rows_delayed
    text: Doris makes new rows visible to text searches only after 15 minutes; wait, then search again
  - id: cached_result
    text: Grafana caches empty results for a range; restart the Grafana container
  - id: rows_deleted
    text: The rows were deleted after the SQL query ran; load the telemetry again
  answer: absolute_utc_range
  explanation: Doris stores UTC, while the Doris App turns its range into your computer's local time and
    compares that with the UTC times in Doris; in UTC+8, Last 15 minutes asks for rows 8 hours in the
    future. An absolute range typed in UTC finds the rows. Rows are searchable seconds after they load,
    Grafana does not cache this result, and the SQL query has just found the rows, so they were not deleted.
- id: find_error_origin
  objective: Follow a trace from a log line to the span where an error starts.
  prompt: In a failed checkout's waterfall, error icons mark load-generator POST, frontend-proxy ingress,
    frontend POST, checkout PlaceOrder, checkout's call to payment, and payment's Charge server span.
    Payment's child span, charge, has no error. Where does the failure start?
  options:
  - id: payment_charge
    text: In payment's Charge server span, the deepest span with an error
  - id: root_span
    text: In load-generator POST, because the root span is where every error begins
  - id: place_order
    text: In checkout's PlaceOrder span, because it has the most child spans
  - id: charge_child
    text: In the charge span, because it is the last span that payment recorded
  answer: payment_charge
  explanation: 'Errors pass upward, from callee to caller, so most red rows only report an error from
    below. The failure starts at the deepest span with an error, the one whose children have none: payment''s
    Charge server span, whose attributes hold the error message. The root span is where the request started,
    not where it failed; the number of children says nothing about errors; and the charge span has no
    error status.'
- id: measure_host_cpu
  objective: Measure a host's CPU from per-core, per-state samples.
  prompt: Each row of system.cpu.utilization holds the share of time, from 0 to 1, that one CPU core spent
    in one state. Which calculation gives the share of time that the host was busy in the last minute?
  options:
  - id: one_minus_idle
    text: 100 times 1 minus the average of the idle rows of all cores
  - id: average_all_rows
    text: 100 times the average of all rows, whatever their state
  - id: largest_value
    text: 100 times the largest value of any row in the last minute
  - id: share_above_0_9
    text: The number of rows above 0.9, as a percentage of all rows
  answer: one_minus_idle
  explanation: The states of a core add up to 1, so its busy share is 1 minus its idle share; averaged
    over all cores and samples, this measures the host. The average of all rows mixes every state and
    always gives the same fraction. The largest value is usually an idle core's idle share. Rows above
    0.9 are mostly the idle rows of idle cores, which is why a filter such as value > 0.9 finds idle cores
    rather than busy ones.
- id: use_time_macros
  objective: Build dashboard panels from SQL with Grafana's time macros.
  prompt: A panel's SQL uses $__timeFilter(timestamp) and $__timeGroupAlias(timestamp, 1m), and its Format
    is Time series. What do the two macros do?
  options:
  - id: follow_time_range
    text: They keep the rows of the dashboard's time range and group them by minute
  - id: convert_to_local
    text: They turn the stored timestamps into your computer's local time before the query
  - id: last_minute_only
    text: They limit the result to the last minute and drop the older rows of the range
  - id: lucene_search
    text: They let the panel run a Lucene search, as Discover does, on the timestamp column
  answer: follow_time_range
  explanation: Grafana replaces $__timeFilter(timestamp) with a condition for the dashboard's time range,
    passed as exact moments, and $__timeGroupAlias(timestamp, 1m) with the start of each row's minute,
    named time. The stored timestamps stay in UTC; Grafana converts only the times that it displays. The
    query returns every minute of the range, and the macros belong to SQL, not to Lucene.
