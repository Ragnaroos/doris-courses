title: 'Module 1 Quiz: Observability Foundations in the DOG Stack'
description: Six questions check whether you can choose a telemetry signal, read the fields that join
  spans, divide the work of the DOG stack, follow the demo's telemetry into Doris, judge the evidence
  that it arrived, and confirm the payment failure.
questions:
- id: choose_signal_for_failing_step
  objective: Choose logs, metrics, or traces for an operational question.
  prompt: Customers report that some orders fail. For one failed order, the engineer on call needs to
    see which services the request passed through and which step returned the error. Which signal answers
    this directly?
  options:
  - id: traces
    text: Traces, because the order's spans in each service share one trace ID and mark the failed step
  - id: metrics
    text: Metrics, because a counter of failed charges per minute shows the path of each failed order
  - id: logs
    text: Logs, because every service writes a line for each request that names the service that failed
  - id: dashboard
    text: A dashboard, because its panels join the services of one request into a single view
  answer: traces
  explanation: 'Traces follow one request across services: every span of the order carries its trace ID,
    and the span where the step failed has an error status. A counter of failed charges says how often
    orders fail, not which path one order took. Logs hold only what each service chooses to write, and
    in the demo the payment and checkout services send none. A dashboard shows what its queries return;
    it does not join the spans of a request by itself.'
- id: join_spans_by_their_ids
  objective: Explain how the trace ID and the parent span ID join the spans of one request.
  prompt: In otel_traces, span A has the span ID 7f3a and no parent span ID. Span B has the same trace
    ID as A and the parent span ID 7f3a. Span C has a different trace ID. What do these fields say?
  options:
  - id: b_child_of_a
    text: B is a child of A in the same request, and C belongs to another request
  - id: c_parent_of_a
    text: C is the parent of A, because A has no parent span ID of its own
  - id: same_service
    text: A and B were written by the same service, because they share a trace ID
  - id: b_reports_error
    text: B failed, because a span with a parent span ID reports an error to its parent
  answer: b_child_of_a
  explanation: 'Every span of a request has the request''s trace ID, and a span''s parent span ID is the
    span ID of the span that started it. B has A''s trace ID and A''s span ID as its parent, so it is
    A''s child in the same request, and A, without a parent, is the root span. C has another trace ID,
    so it belongs to another request and cannot be A''s parent. A shared trace ID does not mean a shared
    service: context propagation carries the trace ID from service to service. The parent span ID says
    nothing about errors; the status code does.'
- id: assign_dog_responsibilities
  objective: Assign collection, storage, and visualization to the parts of the DOG stack.
  prompt: A team adopts the DOG stack for the logs, metrics, and traces of many services. Which division
    of work matches the stack?
  options:
  - id: collector_doris_grafana
    text: The Collector receives and exports telemetry, Doris stores and queries it, and Grafana shows
      it
  - id: grafana_stores
    text: Grafana stores the telemetry in its dashboards, Doris collects it, and the Collector draws charts
  - id: doris_collects
    text: Doris pulls telemetry from each service, Grafana keeps the raw records, and the Collector signs
      users in
  - id: services_store
    text: Each service keeps its own telemetry, and Doris and Grafana only cache the latest requests
  answer: collector_doris_grafana
  explanation: 'The OpenTelemetry Collector receives telemetry, processes it, and exports it; Doris stores
    it in tables and answers SQL over it; Grafana shows it in searches, traces, dashboards, and alerts.
    Grafana stores no telemetry, only its dashboards and settings. Doris does not collect from the services:
    the Collector''s exporter loads the data into it. The services do not keep their telemetry: they send
    it to a Collector.'
- id: follow_demo_telemetry_path
  objective: Trace the path that the demo's telemetry takes from a service to a table in Doris.
  prompt: The demo's own Collector stops, while the DOG Collector and Doris keep running. What happens
    to the telemetry in Doris?
  options:
  - id: demo_rows_stop
    text: Rows from the demo's services stop, while the DOG Collector's own host metrics keep arriving
  - id: services_switch
    text: The services send directly to the DOG Collector instead, so nothing changes in Doris
  - id: doris_pulls_later
    text: Doris pulls the missing telemetry from the services once the demo's Collector is back
  - id: all_tables_stop
    text: Every table in Doris stops receiving rows, because all of the telemetry passes through the demo's
      Collector
  answer: demo_rows_stop
  explanation: 'The demo''s services send their telemetry over OTLP to the demo''s Collector, which forwards
    it to the DOG Collector, so nothing from the demo reaches Doris while it is stopped. The DOG Collector''s
    own host metrics do not pass through the demo''s Collector and keep arriving. The services send to
    the Collector that they are configured for and do not switch to another. Doris does not pull telemetry
    from the services: the exporter pushes it, and data that never reached a Collector is lost.'
- id: prove_demo_telemetry_reached_doris
  objective: Judge what evidence shows that telemetry reached Doris.
  prompt: After you start the demo, which observation best shows that its traces reached Doris?
  options:
  - id: recent_rows
    text: otel_traces has rows from the last few minutes, sent by the demo's services
  - id: containers_running
    text: All 23 demo containers and the four containers of the DOG stack are running
  - id: storefront_answers
    text: The storefront page loads, and you can add a product to the cart without an error
  - id: collector_ready
    text: The DOG Collector's log says that it is ready and has started its trace pipeline
  answer: recent_rows
  explanation: 'Recent rows in otel_traces from the demo''s services are the end of the path: the spans
    were sent, forwarded, exported, and loaded. Running containers show only that the processes started.
    A working storefront shows that the services answer requests, not that their telemetry left them.
    A ready Collector can receive data, but its log does not show that any spans passed through it or
    that Doris loaded them.'
- id: confirm_payment_failure
  objective: Start a failure with a feature flag and confirm it in the telemetry.
  prompt: You set the demo's flag paymentFailure to 50% and saved it. Which observation confirms that
    the failure is happening?
  options:
  - id: error_spans
    text: New spans of oteldemo.CheckoutService/PlaceOrder have the status STATUS_CODE_ERROR
  - id: flag_page
    text: The flag page shows 50% in the paymentFailure card after you reload it
  - id: error_logs
    text: New log rows of severity ERROR from the payment service appear in otel_logs, one per failed
      charge
  - id: host_cpu
    text: The host's CPU rises, because the payment service retries every failed charge
  answer: error_spans
  explanation: 'The checkout service records each order as a PlaceOrder span, whose status is STATUS_CODE_ERROR
    when the payment fails, so new error spans confirm that orders now fail. The flag page shows only
    the setting that you saved, not its effect. The payment service writes its errors only to its container''s
    output, so no error rows arrive in otel_logs. The failure adds no CPU load: the payment service rejects
    the charge at once and retries nothing.'
