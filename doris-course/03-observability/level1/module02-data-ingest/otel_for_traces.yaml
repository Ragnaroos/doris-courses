receivers:
  otlp:
    protocols:
      # OTLP over HTTP. The Lab publishes this port on the host as
      # 127.0.0.1:24328, where the Python code sends its span.
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Adds a resource attribute to every span that passes through this collector.
  # The lab finds it on the span in Doris; spans sent to another collector lack it.
  resource:
    attributes:
      - key: deployment.environment.name
        value: course-lab
        action: upsert
  batch:
    send_batch_size: 10000
    timeout: 10s

exporters:
  doris:
    endpoint: http://doris-obs:8040
    database: otel
    username: root
    password:
    table:
      traces: otel_traces
    # The DOG Collector created otel_traces when Module 1 started it. This
    # collector only loads rows, so it does not create tables.
    create_schema: false
    timezone: UTC
    timeout: 60s
    log_response: true
    sending_queue:
      enabled: true
      num_consumers: 20
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
    headers:
      load_to_single_tablet: "true"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [doris]
