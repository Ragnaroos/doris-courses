receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 10000
    timeout: 10s

exporters:
  doris:
    endpoint: http://doris:8040
    database: otel
    username: root
    password:
    table:
      traces: otel_traces
    create_schema: true
    mysql_endpoint: doris:9030
    history_days: 10
    create_history_days: 10
    timezone: Asia/Shanghai
    timeout: 60s
    log_response: true
    sending_queue:
      enabled: true
      num_consumers: 20
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
    headers:
      load_to_single_tablet: "true"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [doris]
