extensions:
  # Keeps the filelog receiver's read position in a directory that the Lab
  # mounts from .runtime/, so a restarted collector continues where it stopped
  # instead of loading fe.log again.
  file_storage:
    directory: /var/lib/otelcol/file_storage

receivers:
  filelog:
    # The Lab mounts the FE log directory, not the file itself: when the FE
    # rotates fe.log, the receiver sees the new fe.log in the directory.
    include: [ /var/log/doris-fe/fe.log ]
    start_at: beginning
    storage: file_storage
    multiline:
      line_start_pattern: '^(?:RuntimeLogger\s)?\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}'
    operators:
      - type: regex_parser
        regex: '^(?:RuntimeLogger\s)?(?P<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) (?P<severity>INFO|WARN|ERROR) (?P<message>.*)'
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%d %H:%M:%S,%L'
        severity:
          parse_from: attributes.severity
          trace: TRACE
          debug: DEBUG
          info: INFO
          warn: WARN
          error: ERROR
          fatal: FATAL

processors:
  # A log file does not say which service wrote it. Name the source, so the FE
  # log rows have service_name = doris-fe in Doris instead of an empty value.
  resource:
    attributes:
      - key: service.name
        value: doris-fe
        action: upsert
  batch:
    send_batch_size: 10000
    timeout: 2s

exporters:
  doris:
    endpoint: http://doris-obs:8040
    database: otel
    username: root
    password:
    table:
      logs: otel_logs
    # The DOG Collector created otel_logs when Module 1 started it. This
    # collector only loads rows, so it does not create tables.
    create_schema: false
    timezone: UTC
    timeout: 60s
    log_response: true
    sending_queue:
      enabled: true
      num_consumers: 20
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
    headers:
      load_to_single_tablet: "true"

service:
  extensions: [file_storage]
  pipelines:
    logs:
      receivers: [filelog]
      processors: [resource, batch]
      exporters: [doris]
