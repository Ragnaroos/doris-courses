receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: 'doris_cluster'
          scrape_interval: 15s
          metrics_path: '/metrics'
          static_configs:
            - targets: ['doris:8030']
              labels:
                group: 'doris_fe'
            - targets: ['doris:8040']
              labels:
                group: 'doris_be'

processors:
  batch:
    send_batch_size: 10000
    timeout: 10s
  transform:
    metric_statements:
      - context: metric
        statements:
          - set(description, "Metric from Doris cluster") where description == ""
          - set(unit, "By") where description == "" or description == "Metric from Doris cluster"
          - set(description, "Total number of HTTP requests") where name == "http_requests_total"
          - set(unit, "1") where name == "http_requests_total"

          - set(description, "Current memory usage in bytes") where name == "process_resident_memory_bytes"
          - set(unit, "By") where name == "process_resident_memory_bytes"

          - set(description, "Number of threads") where name == "process_threads"
          - set(unit, "1") where name == "process_threads"


exporters:
  doris:
    endpoint: http://doris:8040
    database: otel
    username: root
    password:
    table:
      metrics: otel_metrics
    create_schema: true
    mysql_endpoint: doris:9030
    history_days: 14
    create_history_days: 10
    replication_num: 1
    timezone: Asia/Shanghai
    timeout: 60s
    log_response: true
    label_prefix: otel
    headers:
      load_to_single_tablet: "true"
      max_filter_ratio: "1"
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8889
  pipelines:
    metrics:
      receivers: [otlp, prometheus]
      processors: [transform, batch]
      exporters: [doris]
