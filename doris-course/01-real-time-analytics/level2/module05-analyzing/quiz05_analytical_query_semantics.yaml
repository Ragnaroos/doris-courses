title: "Module 5 Quiz: Analyzing Data in Apache Doris"
description: Apply Module 5 concepts to small, independent business scenarios. Read the explanation
  and revise any answer before continuing.
questions:
- id: m5_q1
  objective: Choose by result shape
  prompt: One operation converts each email to lowercase; another exposes a source as rows and columns
    in FROM. Which function categories match these two contracts, in order?
  options:
  - id: aggregate_then_window
    text: Aggregate function; window function.
  - id: scalar_then_tvf
    text: Scalar function; table-valued function (TVF).
  - id: window_then_scalar
    text: Window function; scalar function.
  - id: tvf_then_aggregate
    text: Table-valued function (TVF); aggregate function.
  answer: scalar_then_tvf
  explanation: A scalar function transforms a value for each input row. A TVF supplies a relation
    that a query can read. Aggregates combine input rows, while window functions add calculations
    over related rows without supplying a new FROM relation.
- id: m5_q2
  objective: Filter rows before groups
  prompt: 'Rows are (store, status, amount): (A, paid, 60), (A, pending, 70), (B, paid, 110). A query
    uses WHERE status = ''paid'', GROUP BY store, and HAVING SUM(amount) > 100. Which result remains?'
  options:
  - id: both_with_pending
    text: A with 130 and B with 110.
  - id: both_paid_only
    text: A with 60 and B with 110.
  - id: store_a_only
    text: A with 130 only.
  - id: store_b_only
    text: B with 110 only.
  answer: store_b_only
  explanation: WHERE removes the pending row before aggregation. A therefore totals 60 and fails
    HAVING; B totals 110 and passes. HAVING filters grouped totals, not individual purchases, and
    the pending amount cannot enter the paid population.
- id: m5_q3
  objective: Preserve rows with a window
  prompt: 'A filtered relation contains six payments: four for store A and two for store B. Query
    G groups by store and selects SUM(amount). Query W selects each payment plus SUM(amount) OVER
    (PARTITION BY store), with no DISTINCT or further filter. How many rows do G and W return?'
  options:
  - id: two_and_six
    text: G returns 2; W returns 6.
  - id: two_and_two
    text: G returns 2; W returns 2.
  - id: six_and_six
    text: G returns 6; W returns 6.
  - id: six_and_two
    text: G returns 6; W returns 2.
  answer: two_and_six
  explanation: GROUP BY folds the six payments into two store groups. The window calculation annotates
    all six payment rows with their store total. PARTITION BY defines a window grouping, but does
    not collapse the output into one row per store.
- id: m5_q4
  objective: Give representative values a meaning
  prompt: A report groups sales by store across several days. It selects ANY_VALUE(sale_date) and
    labels that column latest_sale_date. Each store may have several distinct non-NULL dates. Is
    that label justified?
  options:
  - id: last_inserted
    text: Yes, because Doris takes the last date inserted into each group.
  - id: total_decides
    text: Yes, because the group total determines its latest date.
  - id: use_max
    text: No. Use MAX(sale_date) for the latest date; ANY_VALUE does not promise that choice.
  - id: group_by_every_date
    text: No. Every date must be added to GROUP BY even when the required grain is one store.
  answer: use_max
  explanation: ANY_VALUE can choose an arbitrary non-NULL value; it does not mean latest. MAX matches
    the requested representative date while retaining one row per store. Adding date to GROUP BY
    changes the report grain. ANY_VALUE is meaningful when any representative really is acceptable
    or all eligible values are equivalent.
- id: m5_q5
  objective: Reason about analytical stages
  prompt: A Common Table Expression (CTE) named daily groups observed sales by date. It produces
    July 1 and July 3, with no row for July 2. The outer query adds LAG(revenue) OVER (ORDER BY day).
    What does July 3 compare with?
  options:
  - id: generated_zero_row
    text: An automatically generated zero-revenue row for July 2.
  - id: previous_available_row
    text: July 1, the previous available row; calendar-day comparison requires an explicit calendar
      stage.
  - id: null_without_july_2
    text: NULL, because LAG only matches exactly one calendar day earlier.
  - id: cte_fills_dates
    text: July 2, because naming the CTE daily fills missing dates.
  answer: previous_available_row
  explanation: The CTE names a query stage; it does not generate absent dates. LAG moves by rows
    in the specified ordering, so the previous available row is July 1. A calendar relation and an
    explicit missing-value policy are needed before a previous-calendar-day comparison.
- id: m5_q6
  objective: Choose the scope of reusable logic
  prompt: A team wants to double each element of an array in one query, and separately reuse a named
    expression composed entirely of existing SQL functions. A third requirement needs an external
    Java algorithm. Which distinction is sound?
  options:
  - id: all_java_udf
    text: All three require deploying a Java user-defined function (UDF).
  - id: lambda_registers_function
    text: An array Lambda automatically registers a reusable database function for all queries.
  - id: cte_is_permanent
    text: A CTE registers the SQL expression permanently, and a Lambda deploys the Java algorithm.
  - id: lambda_alias_and_java_udf
    text: Use an array higher-order function with a Lambda; consider an SQL Alias Function for the
      named expression; deploy a Java UDF for the external algorithm.
  answer: lambda_alias_and_java_udf
  explanation: A Lambda supplies local element logic to a higher-order function. An Alias Function
    can give an existing SQL expression a reusable signature. A Java UDF needs an external implementation
    and deployment. A CTE exists within its statement, and neither a CTE nor a Lambda deploys external
    code.
