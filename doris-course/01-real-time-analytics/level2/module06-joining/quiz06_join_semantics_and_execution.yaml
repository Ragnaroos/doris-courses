title: "Module 6 Quiz: Joining Data in Apache Doris"
description: >-
  Six independent business scenarios check the Join decisions of Module 6, one
  question for each learning objective. Read the explanation and revise any
  answer before continuing.
questions:
  - id: predict_multiplication
    objective: "Predict a Join's result grain and multiplicity from the grain and key cardinality of both inputs."
    prompt: >-
      Two sales are (sale_id, product_id, amount) = (1, 7, 30) and (2, 8, 50).
      The product dimension has two rows for product 7 and one row for product
      8. An INNER JOIN on product_id is followed by SUM(amount). What is the
      sum?
    options:
      - id: sum_80
        text: "80, because each sale_id appears only once in the fact table"
      - id: sum_110
        text: "110, because the 30-unit sale matches two dimension rows"
      - id: sum_160
        text: "160, because any duplicated key doubles the entire fact table"
      - id: sum_50
        text: "50, because Doris drops the sales whose match is ambiguous"
    answer: sum_110
    explanation: >-
      The Join returns one row per matching pair: sale 1 pairs with both rows
      of product 7, so the joined amounts are 30, 30, and 50. A unique sale_id
      does not prevent two matches on product_id, and Doris does not drop
      ambiguous matches. Establish one dimension row per key, or choose the
      intended version, before summing enriched facts.

  - id: return_missing_relationships
    objective: "Choose Inner, Outer, Semi, Anti, Cross, or ASOF Join from the rows that the answer must retain."
    prompt: >-
      Every shipment has a customer_id. Support needs the shipments whose
      customer_id has no match in customers, with shipment columns only. The
      customer table can repeat an identifier. Which Join fits directly?
    options:
      - id: left_semi
        text: "shipments LEFT SEMI JOIN customers ON the customer_id"
      - id: inner
        text: "shipments INNER JOIN customers ON the customer_id"
      - id: left_anti
        text: "shipments LEFT ANTI JOIN customers ON the customer_id key"
      - id: left_outer_unfiltered
        text: "shipments LEFT OUTER JOIN customers ON the customer_id"
    answer: left_anti
    explanation: >-
      LEFT ANTI JOIN returns the left rows without a match and does not repeat
      them for duplicated right rows. SEMI returns the rows that do have a
      match, INNER returns matching pairs, and an unfiltered LEFT OUTER JOIN
      also keeps the matched shipments.

  - id: on_or_where
    objective: "Decide how `NULL` keys match and whether a right-side condition belongs in `ON` or `WHERE`."
    prompt: >-
      A report must keep every event and attach only active products. Query 1
      uses LEFT JOIN dim_products d ON e.product_id = d.product_id AND
      d.is_active = 1. Query 2 uses the same LEFT JOIN on product_id only and
      adds WHERE d.is_active = 1. How do their results differ?
    options:
      - id: on_keeps_events
        text: "Query 1 keeps every event; Query 2 drops events without an active product"
      - id: same_result
        text: "Not at all: the optimizer moves the condition, so both return the same rows"
      - id: where_keeps_more
        text: "Query 2 keeps every event, and Query 1 drops the events without a product"
      - id: both_inner
        text: "Both behave like Inner Joins, because each has a condition on the right side"
    answer: on_keeps_events
    explanation: >-
      In ON, the condition decides which product rows may match; events
      without an active product stay, with NULL product columns. In WHERE, it
      runs after the Join, and d.is_active = 1 is not true for those
      NULL-extended rows, so Query 2 behaves like an Inner Join. The two
      placements answer different questions.

  - id: hash_or_nested_loop
    objective: "Explain when Doris uses a Hash Join or a Nested Loop Join, and what the build and probe sides do."
    prompt: >-
      Join 1 uses a.account_id = b.account_id AND a.event_time > b.start_time.
      Join 2 uses only a.event_time > b.start_time. Which interpretation fits
      Doris's execution?
    options:
      - id: hash_plus_residual
        text: "Join 1 can hash on account_id and check the time after; Join 2 needs a Nested Loop"
      - id: both_nested_loop
        text: "Both of them need a Nested Loop Join, because each one contains a > comparison of times"
      - id: both_hash
        text: "Both can use a Hash Join, because a timestamp can be hashed like any other key"
      - id: time_ignored
        text: "Join 1 uses a Hash Join and ignores the time condition, which it cannot evaluate"
    answer: hash_plus_residual
    explanation: >-
      The equality gives Join 1 a key: Doris builds a hash table from one
      input, probes it with the other, and evaluates the time condition on the
      candidate pairs. Join 2 has no equality to organize candidates, so it
      can need a Nested Loop Join. A range comparison alone does not rule out a
      Hash Join.

  - id: choose_distribution
    objective: "Compare Broadcast, Partition Shuffle, Bucket Shuffle, and Colocate Join by the data each moves and the layout each needs."
    prompt: >-
      A large orders table is distributed by HASH(customer_id) into 16
      Buckets. A large customers table uses RANDOM distribution. The two are
      joined on customer_id. Which strategy moves the least data, and what
      does it move?
    options:
      - id: bucket_shuffle
        text: "Bucket Shuffle: orders stays in place, and only the customers rows are routed"
      - id: broadcast_orders
        text: "Broadcast: every instance receives a full copy of the large orders table"
      - id: partition_both
        text: "Partition Shuffle: it reuses the orders Buckets and moves neither of the tables"
      - id: colocate_auto
        text: "Colocate: two tables that share a Join key are placed together automatically"
    answer: bucket_shuffle
    explanation: >-
      The orders layout already matches the Join key, so Bucket Shuffle keeps
      it and routes each customers row to the Bucket of its key. Broadcast
      would copy a whole large table to every participant, Partition Shuffle
      moves both inputs, and Colocate requires both tables to be created in
      the same stable Colocation Group with matching Buckets.

  - id: runtime_filter_plan
    objective: "Read the Join strategy and Runtime Filters in `EXPLAIN` separately from what the Query Profile records."
    prompt: >-
      EXPLAIN shows RF000 built at an Inner Hash Join and applied at the fact
      table's scan. There is no Query Profile yet. What can you conclude?
    options:
      - id: planned_only
        text: "The plan sends a filter from the build side to the scan; a Profile shows its effect"
      - id: no_pages_read
        text: "The scan reads no storage pages at all for the event rows that cannot match a product"
      - id: faster_than_shuffle
        text: "This plan is faster than a Shuffle plan for the same query and the same data"
      - id: replaces_join
        text: "The Runtime Filter replaces the Join's equality check for every row that it passes"
    answer: planned_only
    explanation: >-
      The producer and consumer in the plan show where Doris intends to send a
      filter built from the build side's keys. Whether it arrived in time and
      how many rows it removed is runtime evidence in the Query Profile. A
      Runtime Filter removes candidates, the Join still checks equality, and a
      plan alone says nothing about speed.
