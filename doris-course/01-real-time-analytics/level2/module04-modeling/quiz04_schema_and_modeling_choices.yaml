title: "Module 4 Quiz: Modeling Data in Apache Doris"
description: >-
  Six independent business scenarios check the modeling decisions of Module 4,
  one question for each learning objective. Read the explanation and revise
  any answer before continuing.
questions:
  - id: separate_grains
    objective: "Define a table's grain from its source contract, and keep detail and summary grains in separate tables."
    prompt: >-
      One sales table mixes three rows in its amount column. Two rows are
      individual purchase events worth 12.00 and 18.00. The third row is a
      daily summary of those same two purchases, worth 30.00; it is not another
      purchase. A dashboard runs SUM(amount) over all three rows. What should
      change?
    options:
      - id: decimal_type
        text: "Change amount to DECIMAL so that the three rows add up to 30.00"
      - id: separate_grains
        text: "Store the purchases and the daily summary in two tables with explicit grains"
      - id: unique_per_customer
        text: "Make the table Unique Key per customer so that it keeps the events and the total"
      - id: row_type_sort_key
        text: "Add a row-type column to the sort key so that SUM skips the summary row"
    answer: separate_grains
    explanation: >-
      The dashboard adds 12.00 + 18.00 + 30.00 = 60.00, because the summary
      already contains the two purchases. Individual purchases and daily
      summaries are two grains and belong in two tables, each queried for the
      questions its grain answers. DECIMAL keeps precision but does not remove
      a row, a sort key does not filter, and one row per customer would lose
      the event history.

  - id: duplicate_key_columns
    objective: "Choose the Duplicate Key, Unique Key, or Aggregate Key model from the behavior that a repeated key requires."
    prompt: >-
      A sensor-history table uses DUPLICATE KEY(observed_at, sensor_id). Two
      accepted readings have the same timestamp and sensor but the values 21
      and 22, and both must remain available. What does this definition do?
    options:
      - id: retains_both
        text: "It keeps both readings; these key columns set the sort order, not uniqueness"
      - id: keeps_latest
        text: "It keeps only 22, because the later write replaces the earlier reading"
      - id: adds_values
        text: "It adds the two values and stores one reading of 43 for that timestamp"
      - id: rejects_repeat
        text: "It rejects the second reading, because all of its key columns repeat an existing row"
    answer: retains_both
    explanation: >-
      The Duplicate Key model keeps every accepted row, even when all the key
      columns repeat; in this model the key columns define the sort key. The
      Unique Key model would replace the earlier state, and the Aggregate Key
      model would combine the values with its declared function. No model
      rejects a repeated key.

  - id: additive_summary
    objective: "Derive a summary's dimensions and additive measures from a reporting requirement, and reconcile it with the detail."
    prompt: >-
      A daily summary must keep one row per (day, store). Two separate batches
      contribute revenue of 40.00 and 25.00 for the same day and store. Which
      definition produces a total of 65.00 for that row without replacing
      either contribution?
    options:
      - id: unique_key
        text: "UNIQUE KEY(day, store), with revenue as an ordinary value column"
      - id: aggregate_by_day_only
        text: "AGGREGATE KEY(day), with store as a REPLACE column and revenue as SUM"
      - id: aggregate_sum
        text: "AGGREGATE KEY(day, store), with revenue declared as a SUM value column"
      - id: revenue_in_key
        text: "AGGREGATE KEY(day, store, revenue), with no revenue value column"
    answer: aggregate_sum
    explanation: >-
      The reporting dimensions are the Aggregate Key, and revenue is an
      additive measure declared SUM, so the two contributions combine into
      65.00. A Unique Key replaces the first contribution, leaving store out of
      the key merges the stores, and revenue in the key splits the row by
      amount. Reconcile such a summary with the detail through SUM of its
      measures, not through COUNT(*).

  - id: decimal_and_varchar
    objective: "Choose types for identifiers, time, money, categories, and nested values from their meaning and the operations they need."
    prompt: >-
      A supplier sends amounts with exactly two decimal places, all below one
      million, and product codes such as 00127 and 127 that identify different
      products. Reports currently CAST text amounts before summing them. Which
      typed contract fits?
    options:
      - id: double_and_bigint
        text: "DOUBLE for the amounts and BIGINT for the product codes"
      - id: varchar_for_both
        text: "VARCHAR for both fields, with a CAST in every report that sums them"
      - id: decimal_and_varchar
        text: "DECIMAL(12,2) for the amounts and VARCHAR for the product codes"
      - id: bigint_and_int
        text: "BIGINT for the amounts in cents and INT for the product codes"
    answer: decimal_and_varchar
    explanation: >-
      DECIMAL(12,2) covers the stated range and keeps exact decimal amounts,
      and VARCHAR keeps the leading zeros that make 00127 and 127 different
      products. DOUBLE is approximate, integer codes merge the two products,
      and a CAST in every report postpones validation instead of making it part
      of the table.

  - id: omission_and_null
    objective: "Distinguish `NULL`, `NOT NULL`, and `DEFAULT` for values that are missing, omitted, or invalid."
    prompt: >-
      An optional delivery note uses VARCHAR(100) NULL DEFAULT 'not provided'.
      The INSERT for parcel A omits this column; the INSERT for parcel B
      supplies NULL explicitly. Both inserts succeed. What is stored?
    options:
      - id: both_null
        text: "Both parcels store NULL, because the column allows NULL values"
      - id: both_default
        text: "Both store not provided, because the default replaces any missing value"
      - id: omitted_null_explicit_default
        text: "Parcel A stores NULL, and parcel B stores not provided"
      - id: omitted_default_explicit_null
        text: "Parcel A stores not provided, and parcel B stores NULL"
    answer: omitted_default_explicit_null
    explanation: >-
      An omitted column receives its declared default, while an explicit NULL
      stays NULL in a nullable column. NULL allows an unknown or absent value,
      DEFAULT says what to store when the column is left out, and NOT NULL
      would reject parcel B's insert instead of inventing a note.

  - id: layout_from_workload
    objective: "Design a table's Partitions, Buckets, and sort key from its time filters, lifecycle, distribution, and volume."
    prompt: >-
      A table appends temperature readings from devices. Data is kept and
      removed in complete calendar months, and most queries read recent time
      ranges across devices. Device IDs are numerous and evenly spread; the
      region column has only three values with heavy skew. Which starting
      layout fits?
    options:
      - id: month_partitions_device_buckets
        text: "Monthly Partitions, HASH(device_id) Buckets, and a sort key that starts with the time"
      - id: region_partitions
        text: "Region Partitions, HASH(region) Buckets, and a sort key that starts with device_id"
      - id: device_partitions
        text: "One Partition per device, HASH(region) Buckets, and a sort key that starts with region"
      - id: region_buckets
        text: "Monthly Partitions, HASH(region) Buckets, and a sort key that starts with the region"
    answer: month_partitions_device_buckets
    explanation: >-
      Monthly Partitions match the whole-month lifecycle, hashing the many,
      evenly spread device IDs uses every Bucket, and a sort key that starts
      with the time matches the common range filter. Three skewed regions
      would concentrate the rows in a few Buckets. The Bucket count still
      depends on data volume and resources.
