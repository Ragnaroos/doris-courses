title: "Module 7 Quiz: Updating and Deleting Data in Apache Doris"
description: >-
  Six independent business scenarios check the update and deletion decisions
  of Module 7, one question for each learning objective. Read the explanation
  and revise any answer before continuing.
questions:
  - id: merge_staged_changes
    objective: "Choose full-row upsert, partial column update, SQL `UPDATE`, or `MERGE INTO` from the form and ownership of incoming changes."
    prompt: >-
      A staging table holds one row per order_id with a change_type of UPSERT
      or DELETE. Some of the orders exist in the Unique Key target and some do
      not. One statement must update the matched UPSERT orders, delete the
      matched DELETE orders, and insert the unmatched UPSERT orders. Which
      operation fits?
    options:
      - id: merge_into
        text: "MERGE INTO with WHEN MATCHED and WHEN NOT MATCHED clauses for each change type"
      - id: sql_update
        text: "SQL UPDATE with a WHERE condition that selects all of the staged order IDs"
      - id: insert_rows
        text: "An INSERT of the staged rows, which also deletes the orders marked DELETE"
      - id: partial_update
        text: "A partial column update that writes only the change_type of each order"
    answer: merge_into
    explanation: >-
      MERGE INTO joins the staged changes to the target and applies a
      different action to matched and unmatched rows in one statement. SQL
      UPDATE only changes existing rows, an ordinary INSERT upserts but does
      not delete, and writing change_type only stores the column. Check first
      that the staging table has one row per order_id: several source rows
      for one target row give undefined results.

  - id: sequence_order
    objective: "Use a Sequence column so that source order, not arrival order, decides which state wins."
    prompt: >-
      A Unique Key table package_status keeps one row per package_id and
      declares source_version as its Sequence column. For package 41, three
      complete records arrive in this order: in_transit at version 8,
      delivered at version 10, then in_transit at version 9, an older update
      that arrived late. What does a query show for package 41?
    options:
      - id: last_arrival_wins
        text: "One row, in_transit at version 9, because that record arrived last"
      - id: three_rows
        text: "Three rows, one for each of the three status records that the table received"
      - id: first_record_wins
        text: "One row, in_transit at version 8, because the first record is kept"
      - id: highest_sequence_wins
        text: "One row, delivered at version 10, because the highest Sequence wins"
    answer: highest_sequence_wins
    explanation: >-
      The Sequence column orders the states of one key by the source's
      version, so the late version 9 cannot replace version 10. A Unique Key
      table exposes one current row, not every accepted write, and a column
      named like a version orders nothing until the table declares it with
      function_column.sequence_col.

  - id: omitted_columns
    objective: "Predict what full-row and partial writes do to omitted columns, and how omission differs from `NULL`."
    prompt: >-
      Two copies of an existing Unique Key row hold balance 75.00 and note
      'verified'. balance has DEFAULT '0.00', and note is nullable with no
      default. A full-row upsert goes to one copy and a partial column update
      to the other; both supply only the key and status. What happens?
    options:
      - id: both_retain
        text: "Both copies keep 75.00 and verified, because neither write supplied them"
      - id: both_use_defaults
        text: "Both copies change to 0.00 and NULL, because both of the writes omitted those columns"
      - id: full_row_defaults_partial_retains
        text: "The full-row copy gets 0.00 and NULL; the partial copy keeps 75.00 and verified"
      - id: full_row_retains_partial_defaults
        text: "The full-row copy keeps 75.00 and verified; the partial copy gets 0.00 and NULL"
    answer: full_row_defaults_partial_retains
    explanation: >-
      A full-row upsert replaces the row, so the omitted columns take their
      default or NULL. A partial column update patches the existing row and
      keeps the columns it does not supply. Sending NULL explicitly is not an
      omission, and a partial write for a new key needs its own policy because
      no old row exists.

  - id: identify_deleted_rows
    objective: "Choose predicate `DELETE` or the Delete Sign from how the deleted rows are identified."
    prompt: >-
      A CDC batch carries the keys of deleted customers for a Unique Key table.
      Separately, a maintenance job must remove the rows whose category is
      test. Which pairing matches the two sources?
    options:
      - id: delete_sign_and_predicate
        text: "Delete Sign rows for the CDC keys, and a predicate DELETE for category = test"
      - id: truncate_both
        text: "TRUNCATE PARTITION for both, because each of the two removes rows of the table"
      - id: partial_update_null
        text: "A partial update that sets the CDC keys to NULL, and UPDATE for the test rows"
      - id: upsert_and_overwrite
        text: "An ordinary upsert of the CDC keys, and an INSERT OVERWRITE of the test rows"
    answer: delete_sign_and_predicate
    explanation: >-
      Keys that arrive as data are deleted with the hidden Delete Sign
      (__DORIS_DELETE_SIGN__ = 1) through a load, and rows that a condition
      selects are removed with a predicate DELETE. Setting columns to NULL or
      upserting writes a state instead of deleting it, overwriting with the
      test rows keeps the wrong rows, and truncating removes whole Partitions.

  - id: replace_partition
    objective: "Choose `TRUNCATE` or `INSERT OVERWRITE` to remove or replace a complete Partition."
    prompt: >-
      One daily Partition must be rebuilt from a complete corrected dataset.
      Readers must keep seeing the old contents until the replacement is
      visible, with no empty interval between the two. Which operation fits?
    options:
      - id: truncate_then_insert
        text: "TRUNCATE the Partition, then INSERT INTO it the corrected rows in a second statement"
      - id: insert_into
        text: "INSERT INTO the existing Partition, which replaces the rows that have the same values"
      - id: delete_then_load
        text: "DELETE every old row of the day, then load the corrected rows in another statement"
      - id: insert_overwrite
        text: "INSERT OVERWRITE of only that Partition with its complete corrected data"
    answer: insert_overwrite
    explanation: >-
      INSERT OVERWRITE builds the new contents and switches the Partition to
      them atomically. Truncating or deleting first leaves an interval in
      which the day is empty, and an ordinary INSERT INTO a Duplicate Key
      table appends instead of replacing. The Lab shows the contents before
      and after; the atomic switch is documented behavior.

  - id: visibility_and_cleanup
    objective: "Separate the visibility of a published change from the later physical cleanup by Compaction."
    prompt: >-
      A delete on a Unique Key Merge-on-Write table has been published. A new
      SELECT no longer returns the key, but the table's disk usage has not
      fallen. Which interpretation is justified?
    options:
      - id: deletion_failed
        text: "The deletion failed, because a deleted row stays visible until its bytes are freed"
      - id: visible_now_cleanup_later
        text: "The deletion is visible; Compaction can reclaim the old data later"
      - id: query_compacted
        text: "The SELECT ran a Compaction to hide the row, and the space is released next"
      - id: same_object
        text: "The Delete Sign column and the delete bitmap are the same object, so space stays"
    answer: visible_now_cleanup_later
    explanation: >-
      Visibility and physical cleanup are separate stages: after publication,
      new queries exclude the deleted key at once, while the old data can stay
      on disk until background Compaction rewrites the Rowsets. A query does
      not run Compaction, and the input Delete Sign is not the internal delete
      bitmap of Merge-on-Write.
