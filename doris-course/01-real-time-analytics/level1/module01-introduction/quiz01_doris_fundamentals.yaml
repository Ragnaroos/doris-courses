title: "Module 1 Quiz: Introduction to Apache Doris"
description: >-
  Six questions check the workload, architecture, and first-workflow decisions
  of Module 1, one question for each learning objective.
questions:
  - id: define_doris
    objective: "Define Apache Doris as an open-source, real-time analytics and search database built on an MPP architecture."
    prompt: "Which statement best describes Apache Doris?"
    options:
      - id: bi_application
        text: "A BI application that stores the charts and dashboards of analysts"
      - id: object_store
        text: "An object storage service that keeps Parquet files for query engines"
      - id: realtime_analytics
        text: "An open-source real-time analytics and search database with MPP execution"
      - id: oltp_plugin
        text: "A row-oriented transactional database with an analytical plug-in for reports"
    answer: realtime_analytics
    explanation: >-
      Doris is an open-source, real-time analytics and search database built on
      an MPP architecture: it stores data in columns and runs analytical
      queries in parallel. A BI tool and an object store can work with Doris,
      but neither one is Doris, and Doris is not a transactional database with
      an analytical add-on.

  - id: identify_olap
    objective: "Distinguish OLAP from OLTP by the work that a request does, not by the product that runs it."
    prompt: "Which request is the clearest example of an OLAP workload?"
    options:
      - id: update_address
        text: "Update the delivery address of one order and commit the change"
      - id: revenue_by_region
        text: "Scan 100 million events and total the revenue by region and hour"
      - id: payment_token
        text: "Look up the current payment token of one checkout session by its key"
      - id: reserve_inventory
        text: "Reserve one unit of a product for a cart and commit the transaction"
    answer: revenue_by_region
    explanation: >-
      The revenue request scans and aggregates many records, which is the work
      of an analytical workload. Updating one address, looking up one token by
      its key, and reserving one unit each touch a single business entity in a
      small transaction, which is the work of OLTP, whichever product runs it.

  - id: choose_cdc_reporting
    objective: "Recognize workloads that suit Doris, such as real-time dashboards, customer-facing analytics, observability, lakehouse analytics, and CDC-driven reporting."
    prompt: >-
      An ecommerce company must keep its OLTP database as the system of record,
      but its dashboards need committed order changes within seconds, without
      running large scans on that database. Which design fits best?
    options:
      - id: dashboard_on_oltp
        text: "Run every dashboard aggregation directly against the OLTP database"
      - id: nightly_export
        text: "Export a full snapshot of the OLTP database to Doris once each night"
      - id: object_storage_only
        text: "Copy the changed rows into object storage files without a query engine"
      - id: cdc_to_doris
        text: "Deliver committed changes to Doris continuously through CDC"
    answer: cdc_to_doris
    explanation: >-
      Change data capture keeps the operational database responsible for
      transactions and delivers each committed change to Doris, where the
      dashboards run their analytical queries. Scanning the OLTP database adds
      analytical load to it, a nightly snapshot is a day old, and files without
      a query engine do not answer the dashboards.

  - id: fe_be_responsibilities
    objective: "Summarize what the Frontend (FE) and the Backend (BE) each do with a query."
    prompt: "Which description follows a query through Doris correctly?"
    options:
      - id: be_plans_fe_executes
        text: "The BE creates the distributed plan, and the FE executes each plan fragment"
      - id: client_plans
        text: "The MySQL client plans the query, and the FE and BE only store replicas"
      - id: fe_plans_be_executes
        text: "The FE plans the query and assigns its fragments; the BE nodes execute them"
      - id: fe_renders_charts
        text: "The FE renders charts in a browser, and the BE turns the charts into SQL"
    answer: fe_plans_be_executes
    explanation: >-
      The FE accepts and analyzes the SQL, creates and optimizes the
      distributed query plan, and assigns its plan fragments; the BE nodes
      execute the fragments and, in the integrated architecture, also store the
      table data. The roles are not reversed, the client only sends SQL, and
      "Frontend" does not mean a graphical interface.

  - id: choose_architecture
    objective: "Distinguish the integrated storage and compute architecture from the decoupled storage and compute architecture."
    prompt: >-
      A team wants its persistent data in shared object storage, and separate
      compute groups that scale independently and isolate workloads. Which
      architecture matches these requirements?
    options:
      - id: decoupled
        text: "The decoupled storage and compute architecture"
      - id: integrated
        text: "The integrated storage and compute architecture"
      - id: oltp_replica
        text: "A read replica of the transactional database"
      - id: files_without_doris
        text: "Parquet files in object storage, queried without Doris"
    answer: decoupled
    explanation: >-
      In the decoupled storage and compute architecture, persistent data lives
      in shared storage, and compute groups scale and isolate workloads
      independently. In the integrated architecture, stateful BE nodes store
      the data on local disks, so storage and compute grow together. A
      transactional read replica and bare files offer neither.

  - id: check_the_load
    objective: "Connect to Doris through its MySQL-compatible protocol, create a table, load data, and check the result with an aggregation query."
    prompt: >-
      In Lab 1, INSERT INTO events SELECT ... FROM S3(...) reports 10,158,080
      affected rows. Which check shows what the internal table events now
      holds?
    options:
      - id: count_and_range
        text: "Query COUNT(*), MIN(event_time), and MAX(event_time) from events"
      - id: rerun_s3_select
        text: "Run the S3 TVF query with LIMIT 10 again and compare its ten rows"
      - id: show_backends
        text: "Run SHOW BACKENDS and check that the BE reports Alive = true"
      - id: container_health
        text: "Check that docker ps shows the doris-rta container as healthy"
    answer: count_and_range
    explanation: >-
      The insert reports what one statement wrote; a query of the table shows
      what it now holds: 10,158,080 rows from 2019-12-01 00:00:12 to 2020-03-11
      04:53:08, the values that Lab 1 checks. The S3 TVF reads the files in S3,
      not the table, and SHOW BACKENDS and the container's health show that
      Doris runs, not what the table contains.
