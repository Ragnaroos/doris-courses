title: "Module 3 Quiz: Loading Data into Apache Doris"
description: >-
  Six questions check the load-method selection, quality, persistence,
  continuous-consumption, and retry decisions of Module 3, one question for
  each learning objective.
questions:
  - id: choose_load_method
    objective: "Select a Doris load method from the source, volume, latency, transformation, and retry requirements of a workload."
    prompt: >-
      Every hour, a job must copy a fixed set of Parquet objects that already
      exist in S3 into an internal table, and it must filter and rename columns
      on the way. Which load method is the starting point?
    options:
      - id: s3_insert_select
        text: "INSERT INTO SELECT from the S3 TVF, so that Doris reads the objects with SQL"
      - id: stream_load_each
        text: "Stream Load, after the job downloads each object and pushes it over HTTP"
      - id: routine_load_s3
        text: "A Routine Load job that consumes the objects of the bucket as a continuous stream"
      - id: group_commit_s3
        text: "Group Commit, which collects the objects of each hour into one load transaction"
    answer: s3_insert_select
    explanation: >-
      The objects already exist in object storage and need SQL
      transformations, so Doris reads them through the S3 TVF and one INSERT
      INTO SELECT persists the result. Stream Load suits a client that pushes
      a bounded batch, a Routine Load job consumes Kafka rather than S3, and
      Group Commit groups many small writes but does not read S3.

  - id: choose_group_commit_mode
    objective: "Explain the roles of Stream Load, `INSERT INTO SELECT` with the S3 TVF, Routine Load, and Group Commit."
    prompt: >-
      An application has 30 workers that send frequent tiny Stream Load
      requests to one table. Transaction overhead and version pressure grow,
      and each request must return only after its rows are visible. What is the
      starting point?
    options:
      - id: sync_group_commit
        text: "Keep Stream Load and turn on Group Commit in sync_mode for these tiny writes"
      - id: async_group_commit
        text: "Turn on Group Commit in async_mode and treat each reply as visible rows"
      - id: s3_tvf
        text: "Write each tiny batch to object storage first and load it with the S3 TVF"
      - id: routine_load
        text: "Create a Routine Load job without Kafka that combines the HTTP requests"
    answer: sync_group_commit
    explanation: >-
      Group Commit is a server-side optimization for compatible small Stream
      Load and INSERT writes: it groups them into fewer load transactions,
      which reduces FE transaction work and version pressure. sync_mode
      returns after the grouped transaction commits and the rows are visible;
      async_mode returns once the rows are in the write-ahead log, before they
      are visible. The S3 TVF and Routine Load serve other sources.

  - id: interpret_quality_rejection
    objective: "Load a local CSV file with Stream Load and read its synchronous JSON response."
    prompt: >-
      A ten-row Stream Load request sets strict_mode:true and
      max_filter_ratio:0 and has no where header. One revenue value is
      not-a-number. What does the JSON response report?
    options:
      - id: reject_transaction
        text: "Status Fail with one filtered row, and none of the ten rows is committed"
      - id: partial_commit
        text: "Status Success with nine loaded rows, because most of the batch is valid"
      - id: cast_to_zero
        text: "Status Success with ten loaded rows, and the bad value converted to 0.00"
      - id: where_rejection
        text: "Status Fail with ten unselected rows, because max_filter_ratio acts as a where"
    answer: reject_transaction
    explanation: >-
      Under strict mode the text cannot become a DECIMAL, so the row is
      filtered; with max_filter_ratio:0 one filtered row rejects the whole
      transaction, and the nine valid rows are not committed either. The
      response's ErrorURL shows the rejected row while it is available.
      Unselected rows are valid rows that a where header excludes.

  - id: distinguish_s3_tvf_insert
    objective: "Query Parquet objects with the S3 TVF and persist them with `INSERT INTO SELECT`."
    prompt: "Which statement about the S3 TVF and INSERT INTO SELECT is correct?"
    options:
      - id: correct_s3_boundary
        text: "SELECT from S3(...) only reads the files; INSERT INTO SELECT stores the result"
      - id: tvf_persists
        text: "SELECT from S3(...) copies each file into BE storage, so INSERT only renames it"
      - id: tvf_tracks_offsets
        text: "The S3 TVF tracks object offsets the way a Routine Load job tracks Kafka offsets"
      - id: insert_reuses_label
        text: "INSERT INTO SELECT reuses a Stream Load label, so rerunning it is duplicate-safe"
    answer: correct_s3_boundary
    explanation: >-
      The S3 TVF reads and parses the remote objects for the current query
      without storing them; INSERT INTO SELECT creates the load transaction
      that writes the result into an internal table. Without a label (WITH
      LABEL), a blind rerun loads the rows again, so a production workflow
      labels the statement, or records its object set and uses an idempotent
      target design.

  - id: reason_about_routine_load
    objective: "Explain when a Routine Load job fits continuous Kafka consumption, and how it tracks its progress."
    prompt: >-
      A Kafka topic keeps receiving nested JSON messages. Which design and
      recovery statement is correct?
    options:
      - id: routine_mapping_offsets
        text: "A Routine Load job maps the JSON with jsonpaths and commits rows with their offsets"
      - id: s3_jsonpaths
        text: "An S3 TVF query with jsonpaths, which stores its byte position in Kafka when paused"
      - id: stream_label_offsets
        text: "One permanent Stream Load label that every new Kafka message reuses and appends to"
      - id: group_commit_consumer
        text: "Group Commit as the consumer, which deletes each committed message from the topic"
    answer: routine_mapping_offsets
    explanation: >-
      A Routine Load job is a Doris-managed, long-running Kafka consumer:
      jsonpaths extracts the nested values, COLUMNS maps them to the table,
      and each micro-batch commits its rows together with the Kafka offsets it
      reached, so pause and resume continue from the committed offsets. The S3
      TVF, a Stream Load label, and Group Commit do not consume Kafka.

  - id: retry_stream_load
    objective: "Validate loaded and filtered row counts, recognize a rejected load, and retry a batch safely."
    prompt: >-
      A client sends 1,024 rows with a Stream Load label but loses the HTTP
      response, so it cannot tell whether Doris committed them. What should it
      do?
    options:
      - id: same_label
        text: "Send the same bytes with the same label, and check the status and row count"
      - id: new_label
        text: "Send the same bytes with a new label so that Doris treats them as the same batch"
      - id: insert_select
        text: "Load the rows with INSERT INTO SELECT, which reuses the Stream Load transaction"
      - id: publish_kafka
        text: "Publish the rows to Kafka, because Routine Load removes identical business rows"
    answer: same_label
    explanation: >-
      The same batch keeps its label: if the first request committed, Doris
      answers Label Already Exists with ExistingJobStatus FINISHED and does not
      load the rows again, and the unchanged row count confirms it. A new
      label starts a new transaction that appends the rows again to a
      Duplicate Key table, and neither INSERT INTO SELECT nor Kafka recognizes
      the earlier batch.
