global
    log stdout format raw local0

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 5m
    timeout server 5m

frontend doris_mysql
    bind *:6030
    default_backend doris_fes

backend doris_fes
    balance roundrobin
    option tcp-check
    default-server inter 2s fall 2 rise 2
    server fe-1 172.31.91.40:9030 check
    server fe-2 172.31.91.41:9030 check
    server fe-3 172.31.91.42:9030 check

listen statistics
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 2s
