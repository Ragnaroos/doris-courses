title: "Module 9 Quiz: Sharding, Replication, and Distributed Execution in Apache Doris"
description: >-
  Six independent scenarios check whether you can reason about replicas,
  Frontend entry paths, distributed scans, failure recovery, and Join data
  movement without overclaiming the multi-container evidence, one question for
  each learning objective.
questions:
  - id: tablets_and_replicas
    objective: "Explain how Partitions, Buckets, Tablets, and replicas relate, and count them for a table."
    prompt: >-
      A table has two Partitions, four Buckets per Partition, replication_num
      = 3, and three available BEs. How many logical Tablets and physical
      replicas does its base index have, and how does SQL count the business
      rows?
    options:
      - id: tablets_8_replicas_24
        text: "8 logical Tablets and 24 replicas, and SQL returns each business row once"
      - id: tablets_24_replicas_8
        text: "24 logical Tablets and 8 replicas, and SQL returns every row three times"
      - id: tablets_8_replicas_8
        text: "8 logical Tablets and 8 replicas, because the three BEs share each replica"
      - id: tablets_6_replicas_18
        text: "6 logical Tablets and 18 replicas, because Partitions and BEs are added up"
    answer: tablets_8_replicas_24
    explanation: >-
      The base index has 2 × 4 = 8 logical Tablets, and three copies of each
      make 24 replicas. A scan reads one copy of each Tablet it needs, so
      replication changes availability, not the business answer. Other
      indexes of the table would have Tablets of their own.

  - id: expansion_moves_replicas
    objective: "Explain why adding a BE moves existing replicas without changing the table's Partitions or Buckets."
    prompt: >-
      A two-Partition table with six Buckets per Partition and two replicas
      was created while two BEs were available. A third BE is added, and the
      Tablet scheduler later places some existing replicas on it. What
      changed?
    options:
      - id: placement_changed_only
        text: "Only replica placement; the 12 Tablets and two copies of each stay as they were"
      - id: partitions_split
        text: "Every Partition was split again, so the table now has 18 logical Tablets"
      - id: key_replaced
        text: "The distribution key was replaced by the column that balances the BEs best"
      - id: rows_copied
        text: "The third BE added another readable version, so SQL returns more rows"
    answer: placement_changed_only
    explanation: >-
      A new BE is another placement target: the scheduler copies some replicas
      to it and removes them elsewhere, keeping two replicas of each of the 12
      Tablets. It does not change Partition boundaries, the Bucket count, or
      the distribution key, and a BE that reports Alive = true does not mean
      that balancing has already finished.

  - id: fe_failure_and_reconnect
    objective: "Separate FE metadata election from the client connection that must be reopened after its FE fails."
    prompt: >-
      Three Follower FEs form the voting group. A client has a direct TCP
      session to the current Master, which stops. The two surviving FEs keep a
      majority, and one HAProxy instance can reach both. What should the
      application expect?
    options:
      - id: session_migrates
        text: "Its session moves to the newly elected Master, so no reconnection is needed"
      - id: session_fails_then_reconnect
        text: "Its session fails; a new session through HAProxy reaches a healthy FE"
      - id: haproxy_elects_master
        text: "HAProxy elects the new Master and repairs the FE metadata before it accepts SQL"
      - id: proxy_proves_availability
        text: "A reachable proxy shows that the FE majority and every Doris query are available"
    answer: session_fails_then_reconnect
    explanation: >-
      The surviving majority can elect a Master and keep the metadata service
      available, but an established TCP session does not move to another FE.
      A new session through a proxy or a multi-address driver reaches a
      healthy FE. HAProxy routes and checks TCP health; it does not elect
      Doris Masters, and a single proxy instance is itself one point of
      failure.

  - id: replicas_and_scan_tasks
    objective: "Trace a query from Tablet selection to the BE scan tasks that a Query Profile records."
    prompt: >-
      Metadata shows logical Tablet T7 stored on BE-A and BE-B. One Query
      Profile shows an OLAP scan of T7 only under a Fragment Instance on BE-B,
      with two PipelineTasks there. Which reading is correct?
    options:
      - id: one_replica_scanned
        text: "This execution read the BE-B copy; the PipelineTasks are execution work, not copies"
      - id: tasks_are_replicas
        text: "The two PipelineTasks show that T7 has two more replicas stored on BE-B"
      - id: every_replica_scans
        text: "BE-A scanned T7 too, because each stored replica takes part in every query"
      - id: partial_rows
        text: "Reading one copy changes the grain, so only part of T7's rows reached the result"
    answer: one_replica_scanned
    explanation: >-
      Replica metadata shows where Doris could read a Tablet; the host-scoped
      Profile shows where this execution read it. The FE selected one healthy
      copy of T7, which avoids duplicate rows, and Fragment Instances and
      PipelineTasks are units of execution, not Tablets or replicas. Another
      run can choose another copy.

  - id: majority_and_recovery
    objective: "Apply the default majority-write rule, and tell a live BE from a current replica after an outage."
    prompt: >-
      Under the default majority rule, one BE is stopped. Table A has two
      replicas; Table B has three. No load threshold is overridden. When the BE
      restarts, SHOW BACKENDS reports Alive = true at once. Which statement is
      sound?
    options:
      - id: table_a_blocked_table_b_commits
        text: "B commits with two of three copies, A cannot; then check replica versions"
      - id: both_commit
        text: "Both commit, because a single surviving copy is a majority of any table"
      - id: only_table_a_commits
        text: "Only A commits, because fewer replicas need fewer acknowledgments to commit"
      - id: alive_proves_latest
        text: "Alive = true shows that the returning copies already hold the latest version"
    answer: table_a_blocked_table_b_commits
    explanation: >-
      The default rule needs more than half of the replicas: two of two for
      Table A, which one stopped BE prevents, and two of three for Table B. A
      returning BE resumes its heartbeat before its replicas catch up, so
      check that every replica reaches the current version. A configured
      min_load_replica_num would change the rule.

  - id: bucket_shuffle_or_colocate
    objective: "Explain how Bucket Shuffle and Colocate Join reduce the data that a distributed Join moves."
    prompt: >-
      Events are HASH distributed by user_id into eight Buckets. A first user
      table uses RANDOM distribution. A second user table is HASH distributed
      by user_id into eight Buckets with the same replica count, but it is in
      no Colocation Group with the events. Which conclusion follows for an
      equi-Join on user_id?
    options:
      - id: bucket_shuffle_not_colocate
        text: "Bucket Shuffle can route the users to the event Buckets; neither is Colocate"
      - id: random_auto_colocated
        text: "The RANDOM table is Colocated automatically, because user_id is the Join key"
      - id: matching_ddl_colocates
        text: "The HASH table is Colocated, because its Bucket column and count match the events"
      - id: different_join_types
        text: "Bucket Shuffle and Colocate change the INNER JOIN into other logical Join types"
    answer: bucket_shuffle_not_colocate
    explanation: >-
      Bucket Shuffle keeps the events' Bucket layout and routes each user row
      to the Bucket of its user_id. Colocate also needs both tables in the
      same stable Colocation Group with compatible distribution and replicas;
      matching DDL alone does not place the Buckets together. These strategies
      change where rows meet, not the logical Join type.
