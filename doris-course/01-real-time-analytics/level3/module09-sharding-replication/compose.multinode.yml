# Adapted for Module 9 from Apache Doris's official 4.1 multi-node Compose:
# docker/runtime/all-in-one/4.1/compose/multi-node.yml
# Changes are limited to a course-specific project name, private subnet, and
# localhost-only host ports that do not conflict with the Level 1-8 sandbox.

name: doris-course-m09

x-node: &node
  image: ${DORIS_IMAGE:-apache/doris:all-in-one-4.1.3}
  stop_grace_period: 60s

x-fe-follower: &fe-follower
  <<: *node
  depends_on:
    fe-1:
      condition: service_healthy

x-be: &be
  <<: *node
  depends_on:
    fe-1:
      condition: service_healthy

services:
  fe-1:
    <<: *node
    environment:
      DORIS_ROLE: fe
      FE_HEAP: ${FE_HEAP:-512m}
    ports:
      - "127.0.0.1:${FE_PORT:-9130}:9030"
      - "127.0.0.1:${FE_HTTP_PORT:-8130}:8030"
    networks:
      doris:
        ipv4_address: ${SUBNET:-172.31.91}.40

  fe-2:
    <<: *fe-follower
    environment:
      DORIS_ROLE: fe
      FE_MASTER: fe-1,fe-2,fe-3
      FE_ROLE: follower
      FE_HEAP: ${FE_HEAP:-512m}
    ports:
      - "127.0.0.1:${FE2_PORT:-9131}:9030"
      - "127.0.0.1:${FE2_HTTP_PORT:-8131}:8030"
    networks:
      doris:
        ipv4_address: ${SUBNET:-172.31.91}.41

  fe-3:
    <<: *fe-follower
    environment:
      DORIS_ROLE: fe
      FE_MASTER: fe-1,fe-2,fe-3
      FE_ROLE: ${FE3_ROLE:-follower}
      FE_HEAP: ${FE_HEAP:-512m}
    ports:
      - "127.0.0.1:${FE3_PORT:-9132}:9030"
      - "127.0.0.1:${FE3_HTTP_PORT:-8132}:8030"
    networks:
      doris:
        ipv4_address: ${SUBNET:-172.31.91}.42

  be-1:
    <<: *be
    environment:
      DORIS_ROLE: be
      FE_MASTER: fe-1,fe-2,fe-3
      BE_CONFIG_EXTRA: "mem_limit = ${BE_MEM_LIMIT:-25%}"
    ports:
      - "127.0.0.1:${BE_HTTP_PORT:-8140}:8040"
    networks:
      doris:
        ipv4_address: ${SUBNET:-172.31.91}.50

  be-2:
    <<: *be
    environment:
      DORIS_ROLE: be
      FE_MASTER: fe-1,fe-2,fe-3
      BE_CONFIG_EXTRA: "mem_limit = ${BE_MEM_LIMIT:-25%}"
    networks:
      doris:
        ipv4_address: ${SUBNET:-172.31.91}.51

  be-3:
    <<: *be
    environment:
      DORIS_ROLE: be
      FE_MASTER: fe-1,fe-2,fe-3
      BE_CONFIG_EXTRA: "mem_limit = ${BE_MEM_LIMIT:-25%}"
    networks:
      doris:
        ipv4_address: ${SUBNET:-172.31.91}.52

  haproxy:
    image: ${HAPROXY_IMAGE:-haproxy:3.0-alpine}
    depends_on:
      fe-1:
        condition: service_healthy
      fe-2:
        condition: service_healthy
      fe-3:
        condition: service_healthy
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:${FE_PROXY_PORT:-9230}:6030"
      - "127.0.0.1:${FE_PROXY_STATS_PORT:-8230}:8404"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8404/stats"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      doris:
        ipv4_address: ${SUBNET:-172.31.91}.60

  client:
    <<: *node
    environment:
      DORIS_ROLE: client
      FE_MASTER: fe-1,fe-2,fe-3
      EXPECT_FE: 3
      EXPECT_BE: 3
    depends_on:
      fe-2:
        condition: service_healthy
      fe-3:
        condition: service_healthy
      be-1:
        condition: service_healthy
      be-2:
        condition: service_healthy
      be-3:
        condition: service_healthy
    networks:
      doris:

networks:
  doris:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET:-172.31.91}.0/24
