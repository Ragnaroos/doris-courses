title: "Module 10 Quiz: Controlling Storage Cost and Data Lifecycle in Apache Doris"
description: >-
  Six independent scenarios check whether you can choose compression and
  Partition lifecycle policies, interpret time windows and their evidence, and
  apply the correct recovery boundary, one question for each learning
  objective.
questions:
  - id: compression_goal
    objective: "Explain the separate roles of column encoding and Page compression, and choose a compression algorithm from the constrained resource."
    prompt: >-
      A hot event table is scanned continuously. Query CPUs are saturated, but
      storage capacity and read bandwidth have plenty of headroom, and the
      team accepts a larger table if decompression costs less CPU. What should
      the next experiment test?
    options:
      - id: measure_fast_decompression
        text: "A fast-decompression algorithm, measuring query CPU, latency, and the extra bytes"
      - id: highest_ratio_unmeasured
        text: "The algorithm with the highest ratio in a small storage report, without CPU data"
      - id: disable_encoding
        text: "Turning off column encoding, because encoding and Page compression are one layer"
      - id: single_fastest_run
        text: "Whichever algorithm had the shortest single elapsed time in a shared sandbox"
    answer: measure_fast_decompression
    explanation: >-
      CPU is the constrained resource, so test an algorithm with cheap
      decompression, such as LZ4, and measure query CPU and latency along with
      the extra storage and I/O. A higher ratio can cost more CPU, one noisy
      run cannot rank algorithms, and column encoding is a separate layer that
      comes before Page compression.

  - id: fair_comparison
    objective: "Design a fair compression comparison that keeps the input, layout, loads, and replicas equal."
    prompt: >-
      Two Duplicate Key tables hold the same rows. events_lz4f has one
      Partition, four Buckets, and replication_num = 1. events_zstd has two
      Partitions, eight Buckets each, and replication_num = 3. SHOW DATA
      reports events_zstd as larger. What does this show?
    options:
      - id: layouts_not_comparable
        text: "Nothing about the algorithms: the layouts and the replica counts differ"
      - id: lz4f_better
        text: "LZ4F compresses this data better, because its table is reported smaller"
      - id: zstd_tripled_rows
        text: "ZSTD stored the rows three times, so SQL returns three copies of each row"
      - id: divide_by_three
        text: "Dividing the ZSTD size by three gives a fair comparison with the LZ4F table"
    answer: layouts_not_comparable
    explanation: >-
      Each Bucket of each Partition is a Tablet with its own files, and SHOW
      DATA includes every replica, so 16 Tablets with three copies cannot be
      compared with 4 Tablets with one. Dividing by three still leaves the
      Tablet, Segment, and index overhead, and replicas never repeat rows in a
      query. Load both tables with the same layout, replicas, input, and
      batches.

  - id: partition_modes
    objective: "Choose Manual, Auto, or Dynamic Partitioning from what creates and what removes Partitions."
    prompt: >-
      Match three requirements to a Partition mode: (1) an administrator
      creates approved accounting ranges; (2) previously unseen tenant values
      create Partitions when their data arrives; (3) the system keeps a
      clock-driven seven-day window and prepares tomorrow's range.
    options:
      - id: manual_auto_dynamic
        text: "(1) Manual Partitioning; (2) Auto Partitioning; (3) Dynamic Partitioning"
      - id: dynamic_manual_auto
        text: "(1) Dynamic Partitioning; (2) Manual Partitioning; (3) Auto Partitioning"
      - id: auto_dynamic_manual
        text: "(1) Auto Partitioning; (2) Dynamic Partitioning; (3) Manual Partitioning"
      - id: dynamic_for_all
        text: "Dynamic Partitioning for all three, because it creates any value that is missing"
    answer: manual_auto_dynamic
    explanation: >-
      Manual Partitioning keeps the boundaries under explicit control, Auto
      Partitioning creates a range when a value first arrives, and Dynamic
      Partitioning follows the clock to create future ranges and remove old
      ones. Auto Partitioning can also cap how many historical ranges it
      keeps with partition.retention_count, but it keeps no window relative to
      today, and Dynamic Partitioning does not create a range for a late value.

  - id: hourly_window
    objective: "Read a Dynamic Partition window from its time unit, offsets, and time zone, and predict what happens to late data."
    prompt: >-
      At 10:30 in Asia/Shanghai, a table uses time_unit = HOUR, start = -2,
      end = 1, create_history_partition = true, and the same time zone. An
      event at 08:00 and an event at 07:59 arrive. What happens?
    options:
      - id: four_hourly_ranges
        text: "The 08:00 event lands in the oldest of four hourly ranges; the 07:59 one fails"
      - id: latest_two_hours
        text: "Both load, and each row expires exactly two hours after its own timestamp"
      - id: right_closed_ranges
        text: "The 08:00 event lands in the range that ends at 08:00, since ranges are right-closed"
      - id: minute_partition
        text: "The 07:59 event creates a one-minute Partition, because HOUR is only a label"
    answer: four_hourly_ranges
    explanation: >-
      Offsets -2 to +1 give four half-open hourly ranges: [08:00, 09:00)
      through [11:00, 12:00). The 08:00 event belongs to the range that starts
      at 08:00, and the 07:59 event has no range, so a normal insert fails. At
      11:00 the whole oldest hour becomes eligible for removal at the next
      scheduler check; rows do not expire one by one.

  - id: expiry_evidence
    objective: "Separate an accepted configuration, scheduler action, SQL visibility, and storage reclamation when a Partition expires."
    prompt: >-
      An operator narrows dynamic_partition.start from -3 to -2 on an hourly
      table. SHOW CREATE TABLE shows the new value at once, but five minutes
      later SHOW PARTITIONS still lists the oldest hour and its rows are still
      returned. The FE check interval is the default 600 seconds. What is the
      most likely explanation?
    options:
      - id: scheduler_not_yet
        text: "The rule is accepted, but the scheduler has not run its next check yet"
      - id: rule_ignored
        text: "Doris ignored the new start, because a window cannot shrink once it exists"
      - id: rows_expire_individually
        text: "Each row expires by itself three hours after its own event time, not as a range"
      - id: needs_manual_drop
        text: "A Dynamic Partition table removes old ranges only after a manual DROP PARTITION"
    answer: scheduler_not_yet
    explanation: >-
      ALTER TABLE ... SET changes the rule at once, but it does not run the
      scheduler. The Dynamic Partition scheduler applies the rule at its next
      check, every dynamic_partition_check_interval_seconds, and SHOW DYNAMIC
      PARTITION TABLES shows when it last ran. Lab 10 shortens the interval so
      that the removal follows within seconds. Even after the range disappears,
      its bytes can stay on disk for a while.

  - id: recovery_boundary
    objective: "Decide when the recycle bin is enough and when an independent backup or a replay from the source is needed."
    prompt: >-
      A daily Dynamic Partition policy keeps 30 days. After the window
      advances, SHOW PARTITIONS no longer lists the oldest day. Separately, an
      operator dropped a manual Partition without FORCE an hour ago, and it
      appears in the recycle bin. Which conclusion is justified?
    options:
      - id: recover_drop_backup_for_rest
        text: "RECOVER can restore the recent drop; for expired days, rely on a backup or a replay"
      - id: compaction_erased
        text: "Both ranges are gone for good, because Compaction erased their Segments at once"
      - id: replicas_restore
        text: "Any replica can restore either range, because replicas keep a history of versions"
      - id: recycle_bin_forever
        text: "The recycle bin keeps both ranges until an operator empties it, even after FORCE"
    answer: recover_drop_backup_for_rest
    explanation: >-
      A drop without FORCE stays in the recycle bin for a limited time, by
      default a day, so RECOVER can bring that Partition back. An expired day
      may sit in the recycle bin for a while too, but a retention policy should
      not depend on that: data that must outlive the window, a drop with
      FORCE, or a lost cluster needs an independent backup or a replay from the
      source. Replicas copy deletions too, and the recycle bin belongs to the
      same cluster.
