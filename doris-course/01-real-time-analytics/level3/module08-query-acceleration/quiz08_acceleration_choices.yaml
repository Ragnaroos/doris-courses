title: "Module 8 Quiz: Accelerating Queries in Apache Doris"
description: >-
  Six independent scenarios check whether you can choose and validate Doris
  query-acceleration structures without confusing definitions, plans, runtime
  evidence, and business results, one question for each learning objective.
questions:
  - id: reuse_a_definition
    objective: "Distinguish a regular view, a manually populated summary table, a synchronous materialized view, and an asynchronous materialized view."
    prompt: >-
      Several dashboards must share one reviewed SQL definition of purchase
      revenue. The definition may change centrally, and the team wants no
      second stored copy of the data and no refresh process. Which object fits
      directly?
    options:
      - id: regular_view
        text: "A regular view that stores the shared SQL definition"
      - id: manual_summary_table
        text: "A summary table that a scheduled job fills with precomputed rows"
      - id: synchronous_mv
        text: "A synchronous materialized view that each base-table write maintains"
      - id: asynchronous_mv
        text: "An asynchronous materialized view that a scheduled task refreshes"
    answer: regular_view
    explanation: >-
      A regular view stores only the definition: each query expands it into
      the underlying tables, so there is no stored copy to maintain. The other
      three store rows and bring loading, write maintenance, or refresh with
      them. Whether the expanded query is fast enough is a separate question
      for the plan and the Profile.

  - id: choose_materialization
    objective: "Choose synchronous or asynchronous materialization from the SQL scope, the freshness requirement, and the write or refresh cost."
    prompt: >-
      A category dashboard joins event facts to a product dimension and then
      aggregates revenue. Five minutes of lag is acceptable, and the team does
      not want to add maintenance work to every write of the fact table. Which
      starting choice fits?
    options:
      - id: synchronous_mv
        text: "A synchronous materialized view, which keeps the Join result current with each write"
      - id: asynchronous_mv_with_policy
        text: "An asynchronous materialized view whose refresh policy stays within five minutes"
      - id: regular_view
        text: "A regular view, because naming the Join once stores its joined result for reuse"
      - id: manual_summary
        text: "A summary table with no refresh contract, whose rows stay current by themselves"
    answer: asynchronous_mv_with_policy
    explanation: >-
      An asynchronous materialized view can store a multi-table result and
      refreshes separately from the writes, which makes the accepted lag
      explicit. A synchronous materialized view supports a single-table
      definition and adds work to every load, a regular view stores no result,
      and a manual summary needs a process that keeps it current. The choice
      holds only while the refresh really meets five minutes.

  - id: stored_grain
    objective: "Determine whether a materialized result preserves the dimensions and measure state needed to answer another query."
    prompt: >-
      A stored summary has one row per (event_hour, region) with event_count
      and revenue_sum. A new report needs daily revenue_sum and
      COUNT(DISTINCT buyer_id) by region. What can the stored summary answer?
    options:
      - id: both_measures
        text: "Both, because an hourly summary can be rolled up to any daily measure"
      - id: daily_revenue_only
        text: "Daily revenue only; the summary has no buyer identities to count distinctly"
      - id: distinct_buyers_only
        text: "Distinct buyers only, because event_count can stand in for the number of buyers"
      - id: neither_measure
        text: "Neither, because a materialized result answers only its own GROUP BY exactly"
    answer: daily_revenue_only
    explanation: >-
      Hourly revenue sums are additive, so they roll up to daily sums by
      region. A distinct buyer count cannot be rebuilt from event counts or
      from hourly distinct counts, because one buyer can appear in several
      hours; the summary would need the identifiers or a mergeable state. A
      finer stored grain helps only when it keeps what the new query needs.

  - id: choose_an_index
    objective: "Choose an inverted index, a BloomFilter index, or an NGram BloomFilter index from the predicate it must serve."
    prompt: >-
      An event table is sorted by event_time. Investigators often need the
      detail rows of one exact numeric product_id, which is not a useful
      leading key column, and very few rows match. Which additional structure
      is the most direct starting point?
    options:
      - id: inverted_index
        text: "A non-tokenized inverted index on product_id, then a controlled comparison"
      - id: ngram_bloomfilter
        text: "An NGram BloomFilter index, because an exact numeric lookup is a substring match"
      - id: stored_runtime_filter
        text: "A Join Runtime Filter that Doris stores with the table for the next lookups"
      - id: longer_prefix_index
        text: "A longer Prefix Index on event_time, which also narrows the product lookups"
    answer: inverted_index
    explanation: >-
      A non-tokenized inverted index maps each product_id to the matching Row
      IDs within every Segment, which fits a selective equality lookup; a
      controlled comparison with an unindexed copy then shows what it saved.
      An NGram BloomFilter serves substring matching, a Runtime Filter exists
      only during one Join, and the Prefix Index covers the leading sort-key
      columns, not product_id.

  - id: estimates_and_actuals
    objective: "Separate build state, plan selection, statistics, and runtime evidence when you check an acceleration structure."
    prompt: >-
      After ANALYZE collects fresh statistics, a Join's EXPLAIN shows
      cardinality=37,400, while its Query Profile shows that 17,798 rows left
      the Join. What explains the difference?
    options:
      - id: estimate_vs_actual
        text: "EXPLAIN shows an estimate built from statistics; the Profile counts the actual rows"
      - id: stale_statistics
        text: "ANALYZE did not finish, because fresh statistics would give the actual row count"
      - id: profile_wrong
        text: "The Profile is wrong, because the plan's cardinality is what the query really read"
      - id: rewrite_used
        text: "A materialized view answered the query, so the two numbers describe different tables"
    answer: estimate_vs_actual
    explanation: >-
      Statistics such as row counts and distinct values give the optimizer
      estimates: with two distinct event types and no frequencies, it assumed
      that half of the rows are purchases. EXPLAIN's cardinality is that
      estimate, and the Profile counts what one execution did. Fresh
      statistics improve estimates without making them exact, and the
      selected scan in the plan shows whether a materialized view was used.

  - id: worth_the_cost
    objective: "Decide whether the read savings of a structure justify its storage, write, and refresh cost."
    prompt: >-
      A report runs four times a day and already met its latency objective
      before an asynchronous materialized view was built for it. Its base
      table receives continuous writes, the view adds significant storage and
      refresh load, and the business requires near-current data. What does
      the evidence support?
    options:
      - id: drop_the_mv
        text: "Drop the view: its rare read benefit does not pay for the refresh and the storage"
      - id: keep_after_one_run
        text: "Keep the view, because one run that finished faster shows a lasting improvement"
      - id: refresh_less
        text: "Refresh it less often, since the refresh cost is the only variable that matters here"
      - id: replace_base_table
        text: "Replace the base table with the view, so that its write and storage costs disappear"
    answer: drop_the_mv
    explanation: >-
      The report met its objective without the view and runs rarely, while
      the view adds recurring refresh work, storage, and a freshness risk on
      a write-heavy table. One faster run does not outweigh that. Record the
      decision with its assumptions: a higher query frequency, a stricter
      latency target, or a cheaper refresh would change it.
