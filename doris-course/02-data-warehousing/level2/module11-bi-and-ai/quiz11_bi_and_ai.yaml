title: "Module 11 Quiz: Interfaces and Boundaries for BI and AI Consumers"
description: "Six single-choice questions; no database connection required. View explanations after submitting."
questions:
- id: semantic_view
  objective: "Design a semantic view with stable names, one declared grain, and measures whose meaning is written down."
  prompt: "The BI team will build a dashboard of daily orders. Which interface should it get?"
  options:
  - id: semantic_view
    text: "A view with one row per day and named measures, whose meanings and owners its contract writes down"
  - id: fact_table
    text: "The order fact itself, so that each chart can aggregate the orders the way it needs"
  - id: service_rows
    text: "The service table's rows per date and region, which the dashboard can read as days"
  - id: wide_view
    text: "A view with one row per order and every column, so that no later question needs a new view"
  answer: semantic_view
  explanation: "A semantic view publishes one grain and named measures with written meanings, so every chart reads the same definition. The fact makes every chart repeat the contract's filter and aggregation. Rows per region are not days: a chart that reads them as days counts each day once per region. A view per order is detail, at another grain than the dashboard's."
- id: ratio_over_days
  objective: "Tell dimensions, additive measures, and ratios apart in a dashboard."
  prompt: "A dashboard shows average_order_amount per day: 133.33 on January 1 with 9 orders, 110.00 on January 2 with 1. What is the average of the two days together?"
  options:
  - id: recompute
    text: "Summed gross_amount over summed order_count: 1310.00 / 10 = 131.00"
  - id: average_ratios
    text: "The average of the two daily averages, (133.33 + 110.00) / 2 = 121.67"
  - id: sum_ratios
    text: "The sum of the two daily averages, because measures add up over days"
  - id: higher_ratio
    text: "The higher of the two, because a ratio cannot be combined over days"
  answer: recompute
  explanation: "A ratio is not additive: add its numerator and denominator over the days and divide again, 1310.00 over 10 orders. Averaging the daily averages gives January 2's one order as much weight as January 1's nine. Adding averages has no meaning. A ratio can be combined, from its components."
- id: checks_fail_on_purpose
  objective: "Check an interface's rows, nulls, dates, and totals, and make its contract and freshness checks fail on purpose."
  prompt: "The publication checks of a semantic view always pass. Why does Lab 11 also check a broken copy and a freshness date of January 9?"
  options:
  - id: prove_checks
    text: "To see the checks fail: a check that has never failed may check nothing"
  - id: fix_view
    text: "To repair the published view, which the broken copy replaces when a check fails"
  - id: time_checks
    text: "To measure how long the checks take, since a slow check counts as a failed one"
  - id: business_clock
    text: "Because January 9 is the business's own clock, by which the view is seven days late"
  answer: prove_checks
  explanation: "A contract check that rejects a copy without a column and a freshness check that rejects a seven-day lag prove that both checks work; the published view stays as it is. The broken copy is dropped, not published. Speed is not what these checks test. January 9 is a fixed teaching date; a real check uses the business's clock and its declared rule."
- id: calendar_features
  objective: "Prepare feature inputs over a calendar without claiming anything about a model's accuracy."
  prompt: "A model reads daily features, and January 3 had no orders. What should the feature projection give for January 3?"
  options:
  - id: zero_row
    text: "A calendar row: 0 orders, no average, the flag set; it proves nothing about the model"
  - id: no_row
    text: "No row, since the semantic view has no row that day and a missing row means no orders"
  - id: zero_average
    text: "A row with 0 orders and an average of 0.00, so that the model reads a number instead of a NULL"
  - id: proves_accuracy
    text: "A row with the flag set, which shows that the model will predict the days without orders correctly"
  answer: zero_row
  explanation: "Starting from a calendar makes the day a row, with counts of 0, a NULL ratio, and the flag; the projection prepares checked inputs, and the model's owner evaluates its accuracy. A missing row is no input at all, and it may also mean that the day's orders have not arrived yet. An average of 0.00 invents a value where there is none. A feature proves nothing about predictions."
- id: who_checks_what
  objective: "State what Doris guarantees and what a BI tool or an AI application must check itself."
  prompt: "A dashboard query returns in 200 ms. Which conclusion is right?"
  options:
  - id: speed_only
    text: "The interface was fast; freshness and accuracy need their own checks, some by the BI tool"
  - id: fresh
    text: "The data is fresh, because a fast answer comes from the newest rows of the tables"
  - id: correct
    text: "The numbers are right, because Doris checked the definition that the chart applies"
  - id: tool_free
    text: "The BI tool needs no checks of its own, since Doris has checked the numbers that each chart shows"
  answer: speed_only
  explanation: "Latency is one promise. Freshness depends on refreshes, late data, and the BI tool's cache, and accuracy on the metric's definition and the chart's filters, each with its owner. A fast answer may come from a cache. Doris runs the SQL; it does not check that a chart applies the right definition. The BI tool owns its filters, its cache, and its own users."
- id: mcp_boundary
  objective: "Bound an AI tool's access to Doris with a separate MCP server and a read-only account scoped to published views."
  prompt: "A team connects an AI assistant to Doris through the Doris MCP Server. Which setup bounds what the assistant can read?"
  options:
  - id: readonly_account
    text: "The server connects as an account that may read only the published views, plus its own limits"
  - id: root_with_filters
    text: "The server connects as root, and its tool filters and row limits keep the assistant away from the detail"
  - id: inside_fe
    text: "The server runs inside the FE, so Doris applies the assistant's own permissions by itself"
  - id: prompt_rules
    text: "The assistant's prompt lists the tables it may read, so no database account has to change"
  answer: readonly_account
  explanation: "The Doris account's privileges are the boundary: an account limited to the published views cannot read more, whatever SQL the assistant generates, and the server's limits add to that. Tool filters on a root connection miss whatever they were not written for, and root can change everything. The MCP Server is a separate service that connects through the MySQL protocol. A prompt is not an access control."
