title: "Module 11 Quiz: BI and AI Applications"
description: Six scenario-based multiple-choice questions. No database connection required.
questions:
- id: q1
  objective: Design a consumer-facing semantic view with stable names.
  prompt: A Business Intelligence (BI) dashboard reads one row per day from a view with order_date, order_count, and gross_amount. The source service table changes to one row per day and channel. How should the published view evolve?
  options:
  - id: keep_daily_contract
    text: Keep its daily columns and meanings, aggregate across channels inside the view, and reconcile the new result.
  - id: one_row_per_channel
    text: Return one row per channel under the old view name; consumers can infer that its grain changed.
  - id: add_channel_column
    text: Add channel to the view but continue documenting one row per day.
  - id: expose_physical_table
    text: Expose the new physical table directly; a view cannot survive a source-table refactor.
  answer: keep_daily_contract
  explanation: 'A semantic view can preserve its public grain and field meanings while its implementation changes, subject to checks. Returning one row per channel under the old name multiplies rows and breaks existing daily consumers. Adding a dimension without changing the declared grain is a contract mismatch. Direct physical access increases coupling rather than preserving the interface.'
- id: q2
  objective: Distinguish dashboard dimensions from metric measures.
  prompt: A dashboard groups orders by region. It shows gross amount and average amount per order. Which field treatment lets the dashboard roll up several regions without distorting the average?
  options:
  - id: region_as_measure
    text: Treat region as an additive measure and add region labels when combining groups.
  - id: sum_the_averages
    text: Treat each region’s average as additive and sum the averages across regions.
  - id: recompute_from_totals
    text: Treat region as a dimension, add gross amounts and order counts, then recompute the ratio from those totals.
  - id: gross_as_dimension
    text: Treat gross amount as a dimension and select any one region’s amount as the whole-area amount.
  answer: recompute_from_totals
  explanation: 'Gross amount and order count can roll up, while the average must be recalculated from the combined numerator and denominator. Region labels describe groups; they are not quantities to add. Ratios such as averages are not additive across groups with different order counts. Selecting one region''s amount discards the others.'
- id: q3
  objective: Prepare a feature projection without overstating model quality.
  prompt: An Artificial Intelligence (AI) team receives a reviewed daily feature view with order count and gross amount. A model scores well on six sample days, and the team claims Doris has proved future prediction accuracy. What is the sound conclusion?
  options:
  - id: stable_names_prove_accuracy
    text: The feature view proves future accuracy because its columns have stable names.
  - id: inputs_need_separate_evaluation
    text: The feature view supplies defined inputs; prediction quality still needs separate evaluation on suitable held-out and later data.
  - id: no_nulls_guarantee_accuracy
    text: Model accuracy is guaranteed if the feature query returns no NULL values.
  - id: move_model_to_mv
    text: The team should move the model into a materialized view; storage location is the missing accuracy evidence.
  answer: inputs_need_separate_evaluation
  explanation: 'Doris can expose reviewed data as model inputs, but model validation remains downstream work on suitable held-out and later data. Schema stability is useful but does not measure model generalization. Non-null inputs are only one quality check. Precomputing a feature in a materialized view does not evaluate a model.'
- id: q4
  objective: Validate nulls, freshness, and row counts before serving consumers.
  prompt: A daily view must contain one row for each of seven dates from Jan 1 through Jan 7. A check finds six rows, no NULL amounts, a first date of Jan 1, and a last date of Jan 7. Which release decision is justified?
  options:
  - id: endpoints_prove_coverage
    text: Publish; the first and last dates prove every intermediate day exists.
  - id: no_nulls_mean_zero_sales
    text: Publish; no NULL amounts prove the missing day had zero sales.
  - id: block_until_explained
    text: Block publication until the missing date is found or an explicit zero-day rule explains it.
  - id: fast_query_is_enough
    text: Publish if the query is fast; coverage is a presentation issue for the BI tool.
  answer: block_until_explained
  explanation: 'Six rows cannot cover seven required dates without another explicit rule, so publication waits until the missing date is explained. The first and last dates do not prove complete coverage between them. A missing row is different from a present row with a zero amount. Query speed does not satisfy the data contract.'
- id: q5
  objective: Document the boundary between Doris SQL and downstream BI or AI tools.
  prompt: Doris returns the reviewed pre-tax order amount correctly. A dashboard labels it “cash received,” although refunds and payment records were never joined. Which responsibility statement is accurate?
  options:
  - id: correct_result_validates_label
    text: The database result is correct, so the dashboard label is automatically correct too.
  - id: dashboard_redefines_measure
    text: The dashboard owns the label and can silently change the measure’s business meaning.
  - id: honor_the_contract
    text: The data contract should say pre-tax order amount; the dashboard must honor that meaning or request a separately defined payment metric.
  - id: rename_the_column
    text: Rename the SQL column to cash_received; a new name makes refunds and payments part of the underlying calculation.
  answer: honor_the_contract
  explanation: 'Doris supplies the defined result, and the BI application remains responsible for presenting it faithfully or requesting a separately defined payment metric. Correct SQL values do not validate a downstream interpretation. Presentation tools must not turn a contractual measure into a different business event. A name change cannot add the missing payment and refund facts.'
- id: q6
  objective: Scope an external Model Context Protocol server to reviewed Doris data.
  prompt: A team deploys a separate Model Context Protocol (MCP) server so an assistant can answer questions from published metrics. Its tool can accept generated queries, but the assistant must not read customer phone numbers or raw order detail. What is the safest database-side boundary?
  options:
  - id: root_and_prompt
    text: Connect the MCP server as root and rely on the model prompt to avoid sensitive tables.
  - id: read_only_serving_views
    text: Use a dedicated read-only Doris account granted only the reviewed serving views, plus tool limits and query review.
  - id: whole_database_select
    text: Give the account whole-database SELECT and hide sensitive table names in the tool description.
  - id: row_limit_only
    text: Keep broad database grants but configure a result-row limit; fewer returned rows guarantee no phone numbers appear.
  answer: read_only_serving_views
  explanation: 'Database privileges constrain what the separate server can read, and tool limits and query review are additional safeguards. A prompt is not an authorization boundary, and root is much broader than the task. Hiding table names in the tool description does not remove the underlying privileges. A row limit controls volume, not which columns or tables are accessible.'
