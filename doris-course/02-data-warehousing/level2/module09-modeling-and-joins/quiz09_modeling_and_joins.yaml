title: "Module 9 Quiz: Warehouse Modeling and Joins"
description: "Six single-choice questions; no database connection required. View explanations after submitting."
questions:
- id: declare_grain
  objective: "State the grain of a fact table and a dimension table before joining them."
  prompt: "An analyst joins the order fact with the payments table to show each order's paid amount, and the order amount of some orders doubles. What should have been stated first?"
  options:
  - id: grains
    text: "That a fact row is one order and a payment row one payment, so an order paid twice matches twice"
  - id: join_type
    text: "That the join must be a LEFT JOIN, which keeps the number of rows of its left table"
  - id: distinct_sum
    text: "That SUM(DISTINCT order_amount) is needed, which counts each order's amount once whatever the join returns"
  - id: more_buckets
    text: "That both tables need more buckets, because too few buckets make a join repeat rows"
  answer: grains
  explanation: "The grains differ: one row per order against one row per payment, so an order with two payments appears twice and its amount counts twice. A left join keeps unmatched orders and still repeats an order that matches twice. SUM(DISTINCT) would also merge two different orders of the same amount. Buckets decide how data is stored, not which rows a join returns."
- id: model_for_source
  objective: "Choose a table model and key from whether a source appends records or replaces current state."
  prompt: "A CRM sends each customer's whole current record again whenever it changes, and the warehouse must keep one current row per customer. Which table fits?"
  options:
  - id: unique_customer
    text: "A Unique Key table on customer_id, so that a newer record replaces the customer's old row"
  - id: duplicate_customer
    text: "A Duplicate Key table on customer_id, whose key keeps one row for each customer"
  - id: aggregate_sum
    text: "An Aggregate Key table with SUM on the attributes, so the records add up to the current one"
  - id: duplicate_with_count
    text: "A Duplicate Key table, and COUNT(DISTINCT customer_id) in each report to hide the repeats"
  answer: unique_customer
  explanation: "The source replaces state, so a Unique Key table on the business key keeps one current row per customer. A Duplicate Key table keeps every row that it receives; its key only sorts them, so a changed customer would match an order twice. Attributes such as a name or a region are not additive. Counting distinct customers in reports hides the duplicates without fixing the joins that they double."
- id: three_join_checks
  objective: "Check a join for lost and duplicated rows with row counts, distinct keys, and amounts."
  prompt: "After an inner join of the 11 orders with a customer dimension, the result has 11 rows. Is the join right?"
  options:
  - id: not_yet
    text: "Not yet: compare distinct orders and the amount too; a lost and a doubled order still make 11 rows"
  - id: yes_rows
    text: "Yes: the same number of rows before and after shows that no order was lost or doubled"
  - id: yes_inner
    text: "Yes: an inner join can only drop rows, so 11 of 11 shows that it dropped none"
  - id: check_plan
    text: "Only the plan can tell: a BROADCAST join keeps every order, while a shuffle of both tables can lose some"
  answer: not_yet
  explanation: "Lab 9's faulty dimension gives an inner join of 11 rows, the fact's own number, with 10 distinct orders and 1410.00 instead of 1510.00: one order lost and another doubled. Equal row counts can hide two errors that offset each other. An inner join also multiplies a row whose key matches twice. The distribution decides how rows move, not which rows the join returns."
- id: find_missing
  objective: "Find facts whose dimension row is missing with a left join or an anti-join."
  prompt: "Some orders may reference customers that the dimension does not have yet. Which query lists those orders?"
  options:
  - id: left_is_null
    text: "A LEFT JOIN of the orders with the dimension, keeping the rows where the dimension's key IS NULL"
  - id: inner_is_null
    text: "An INNER JOIN of the orders with the dimension, keeping the rows whose dimension key IS NULL"
  - id: compare_counts
    text: "COUNT(*) of the orders against COUNT(*) of the dimension, which differ when customers are missing"
  - id: dimension_first
    text: "A LEFT JOIN of the dimension with the orders, keeping the customers that have no orders"
  answer: left_is_null
  explanation: "A left join keeps every order and fills the dimension's columns with NULL where no customer matches, so those rows are the orders without a customer: an anti-join. An inner join drops exactly those orders. The two tables' row counts measure different things, 11 orders and 663 customers. A left join from the dimension finds customers without orders, the other direction."
- id: read_join_plan
  objective: "Read a join's type and distribution in EXPLAIN without taking a plan for a measurement."
  prompt: "EXPLAIN of the order fact joined with the customer dimension shows join op: INNER JOIN(BROADCAST)[]. What does that say?"
  options:
  - id: broadcast_plan
    text: "Doris plans to send the customers to each instance that scans orders; a Profile shows the run"
  - id: measured_fast
    text: "The join ran fast, because a broadcast join is faster than a shuffle of both tables"
  - id: colocated
    text: "The tables are colocated, because both of them are bucketed by a hash of customer_id"
  - id: keeps_unmatched
    text: "The join keeps the orders without a customer, because a broadcast join is a kind of left outer join"
  answer: broadcast_plan
  explanation: "The join node shows the logical join, INNER JOIN, and the planned distribution, BROADCAST: one side is sent to the instances that scan the other. A plan is a choice, not a measurement; a Query Profile records what an execution did. No strategy is always fastest: broadcasting a large table is costly. Colocation needs a colocation group, not just matching hash columns, and would show COLOCATE. The distribution says nothing about which rows survive."
- id: layers_rebuild
  objective: "Keep raw deliveries, validated detail, and aggregates in separate layers that can be rebuilt."
  prompt: "A batch arrives with a malformed amount, a repeated payment, and an older version of an order. Which design keeps the evidence and gives the same report when the batch is processed again?"
  options:
  - id: rebuild_layers
    text: "Every delivery kept in ODS, DWD by business key and version, and DWS and ADS rebuilt from DWD"
  - id: final_only
    text: "Only the published summary, with each batch's totals appended to it as the batch arrives"
  - id: clean_in_place
    text: "The raw records corrected in place, so that one table holds the cleaned data and nothing more"
  - id: summary_from_ods
    text: "A summary computed straight from the deliveries, counting each delivery as one order"
  answer: rebuild_layers
  explanation: "ODS keeps what arrived, including the bad amount, so a rule can be fixed and rerun; DWD resolves orders by version and payments by ID; DWS and ADS rebuilt from DWD give the same rows again. Appending totals counts a rerun batch twice and keeps no evidence. Correcting raw records loses what the source sent. Counting deliveries counts the repeated and the older deliveries as orders."
