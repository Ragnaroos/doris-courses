title: "Module 9 Quiz: Warehouse Modeling and Joins"
description: Six scenario-based multiple-choice questions. No database connection required.
questions:
- id: q1
  objective: Describe the grain of fact and dimension tables.
  prompt: An input has one row per order line, and all lines of an order share the same customer_id. A customer dimension has one current row per customer. The output contract requires one row per order with its total amount and current region. What should happen before publishing the join result?
  options:
  - id: label_lines_as_orders
    text: Join the line rows and label each result row as an order; the customer key determines the output grain.
  - id: aggregate_then_join
    text: Aggregate lines by order, retaining the customer key, then join and check that each order appears once.
  - id: distinct_amounts
    text: Join the line rows and apply DISTINCT to the amounts; equal-priced lines are duplicates.
  - id: group_by_region
    text: Group by region only; the resulting region total is also one row per order.
  answer: aggregate_then_join
  explanation: 'First establish the order grain by aggregating lines, then check that the join preserves it. Joining to a one-row-per-customer dimension does not collapse multiple lines of one order. Equal amounts can belong to different legitimate lines, so DISTINCT can discard value. Region grain is coarser than order grain and cannot satisfy the stated output contract.'
- id: q2
  objective: Choose a table model and key that match update semantics.
  prompt: A customer feed sends region corrections in business order for the same customer_id. Reports need one current region per customer, while auditors must still replay every original message. Which modeled storage split fits both uses?
  options:
  - id: raw_history_and_current_dimension
    text: Keep raw messages separately and maintain a current Unique Key dimension keyed by customer_id.
  - id: current_table_only
    text: Use a single current Unique Key table as the only copy; overwriting a row also preserves every prior message.
  - id: append_to_dimension
    text: Append every correction to the report-facing dimension and assume a join will choose the latest row automatically.
  - id: key_by_region
    text: Key the current dimension by region, so all customers in one region overwrite one another.
  answer: raw_history_and_current_dimension
  explanation: 'The separately kept raw history supports replay, while the customer-keyed current dimension supports one match per customer after ordered corrections. A current-state overwrite does not retain the source message history. An append-only dimension can produce multiple matches and inflated report amounts unless an explicit current-row rule is applied. Region is not a customer identity, so using it as the key merges different customers.'
- id: q3
  objective: Validate one-to-one and one-to-many JOIN cardinality.
  prompt: Three orders have amounts 40, 60, and 20 for customers 1, 2, and 3. A staging customer list contains one row for customers 1 and 3 but two rows for customer 2. After an inner join on customer_id, which diagnostic is expected?
  options:
  - id: four_rows_three_orders_180
    text: Four joined rows, three distinct orders, amount 180; customer 2 is multiplying a fact row.
  - id: four_distinct_orders
    text: Four joined rows, four distinct orders, amount 180; the join created a new business order.
  - id: three_rows_120
    text: Three joined rows, three distinct orders, amount 120; Doris silently chooses one customer row.
  - id: four_rows_120
    text: Four joined rows, three distinct orders, amount 120; duplicate matches cannot change SUM.
  answer: four_rows_three_orders_180
  explanation: 'The 60-unit order matches twice, so the row count and amount increase while distinct order IDs stay at three. A join duplicates output rows, not source order IDs. An ordinary inner join does not pick one of the duplicate dimension rows. SUM sees both matched copies of the 60-unit fact, so the amount cannot stay at 120.'
- id: q4
  objective: Find missing dimensions with a LEFT JOIN anti-join check.
  prompt: A fact table has 1,000 order IDs, but an inner join with the reviewed customer dimension returns 999 distinct order IDs. Finance needs the missing IDs before accepting the report. Which check answers that question directly?
  options:
  - id: sort_inner_join
    text: Re-run the inner join and sort by customer name; the missing fact will move to the bottom.
  - id: count_dimension_rows
    text: Count dimension rows only; 1,000 customers would prove every order has a match.
  - id: left_join_null_key
    text: Left-join facts to the dimension and keep rows where the right-side customer key is NULL.
  - id: distinct_inner_join
    text: Apply DISTINCT to the inner-join result; it will restore the fact omitted by the join.
  answer: left_join_null_key
  explanation: 'The left join retains each fact, and a NULL right-side key identifies a missing dimension match. An inner join has already discarded unmatched facts, and sorting cannot restore them. Equal table sizes do not establish key coverage. DISTINCT can remove duplicate result rows but cannot recover a fact with no match.'
- id: q5
  objective: Read JOIN distribution evidence from EXPLAIN.
  prompt: EXPLAIN for a large order-to-customer join shows an INNER HASH JOIN and an EXCHANGE that redistributes order rows by customer_id. A reviewer says this proves the amount cannot be inflated. What does the plan actually support?
  options:
  - id: plan_shows_movement_only
    text: It shows the planned join and data movement; key uniqueness and amounts still need result checks.
  - id: hash_join_deduplicates
    text: HASH JOIN removes duplicate customer keys before summing order amounts.
  - id: exchange_proves_coverage
    text: EXCHANGE proves the customer dimension contains every fact customer.
  - id: plan_proves_runtime_and_total
    text: The plan alone proves both the actual network bytes and the business total of the completed run.
  answer: plan_shows_movement_only
  explanation: 'EXPLAIN describes planned physical execution, not source-key uniqueness or measured totals, so key uniqueness and amounts still need result checks. Hashing organizes matches; it does not enforce a unique business key. Redistribution says nothing about missing dimension keys. Runtime work needs a Query Profile, while correctness needs independent row and measure checks.'
- id: q6
  objective: Keep replayable raw inputs separate from modeled detail and report-ready aggregates.
  prompt: A source sends late order corrections, and customers can move between regions. Analysts report daily sales by each customer's region at order time; an auditor must be able to explain how yesterday’s total was rebuilt after a replay. What should the warehouse retain?
  options:
  - id: final_table_only
    text: Only the final daily-region table; its total is enough to reconstruct which messages arrived.
  - id: raw_messages_only
    text: Only raw messages; every dashboard can safely reproduce current customer matches on its own.
  - id: layered_lineage
    text: Raw arrivals, a version-resolved order-grain fact, time-versioned customer regions joined at order time, and a separately derived daily-region serving result.
  - id: rewritten_wide_table
    text: One wide table rewritten after every correction, with no retained input IDs or replay record.
  answer: layered_lineage
  explanation: 'Raw inputs preserve lineage, the order-grain detail resolves corrections, and time-versioned regions keep the historical join reproducible, while the daily-region result serves the dashboards. An aggregate alone loses the input-level evidence needed for replay. Raw messages alone leave every consumer to reinterpret corrections and joins independently, and current customer regions cannot reproduce an order-time region after a move. A final wide table without input identity cannot explain or reproduce a corrected result.'
