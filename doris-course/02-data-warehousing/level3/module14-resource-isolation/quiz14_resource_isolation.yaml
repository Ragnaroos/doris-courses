title: "Module 14 Quiz: Resource Isolation and Query Protection"
description: "Six single-choice questions; no database connection required. View explanations after submitting."
questions:
- id: routing_order
  objective: "Explain the order in which Doris selects a query's Workload Group."
  prompt: "An account's default group is course_dashboard_l3, and it may use both course groups. Its session runs SET workload_group = 'course_adhoc_l3', then a query without a hint. Which group runs the query?"
  options:
  - id: session_group
    text: "course_adhoc_l3: a session's group comes before the account's default group"
  - id: account_default
    text: "course_dashboard_l3: an account's default comes before the session's group"
  - id: normal_fallback
    text: "normal: when the session and the account disagree, Doris falls back to it"
  - id: free_slot
    text: "Whichever of the two groups has a free slot when the query arrives at the FE"
  answer: session_group
  explanation: "Doris takes a hint in the query first, then the session's group when it is not empty, then the account's default, then normal; the account may use the session's group, so it runs the query. The account's default comes after the session. Disagreement causes no fallback. Capacity decides what happens inside the chosen group, not which group is chosen."
- id: no_queue
  objective: "Predict from max_concurrency, max_queue_size, and queue_timeout whether a query runs, waits, or is rejected."
  prompt: "A group has max_concurrency 2 and max_queue_size 0. Two queries of a minute run on one FE, and a third arrives at the same FE. What happens to the third?"
  options:
  - id: rejected
    text: "It is rejected at once with query waiting queue is full"
  - id: waits
    text: "It waits until one of the two running queries has finished"
  - id: moves_normal
    text: "It moves to normal, which still has free slots for it"
  - id: times_out
    text: "It waits for the group's queue_timeout, then fails"
  answer: rejected
  explanation: "Both slots of this FE are taken and the group has no queue, so the query is rejected at once. A queue size of 0 means that nothing waits. A query does not change groups when its group is full. With no place in the queue there is nothing to time out."
- id: cpu_cgroup
  objective: "Explain where memory and CPU limits apply and what CPU enforcement requires."
  prompt: "A BE has no doris_cgroup_cpu_path. The ad hoc group has max_cpu_percent 10 and max_memory_percent 30, and its queries alone use all of the CPU. Why?"
  options:
  - id: no_cgroup
    text: "Without a CPU cgroup nothing enforces the CPU limit; memory limits still apply"
  - id: needs_restart
    text: "The FE must restart before a changed CPU limit of a group takes effect"
  - id: waiting_only
    text: "max_cpu_percent limits only the queries that wait, not the running ones"
  - id: cluster_share
    text: "The CPU limit is a share of the whole cluster, so one group alone may fill a single BE"
  answer: no_cgroup
  explanation: "CPU limits need the BE's CPU cgroup; without doris_cgroup_cpu_path, max_cpu_percent is a setting that nothing enforces, while memory limits use Doris's own accounting on each BE. A restart of the FE adds no cgroup to a BE. Queue properties control waiting; CPU limits apply to running queries. The limits apply on each BE, and an enforced maximum holds even when the CPU is idle."
- id: route_and_bypass
  objective: "Route an account to a group with USAGE_PRIV and default_workload_group, and explain why bypass_workload_group is not an isolation boundary."
  prompt: "An analyst's account may use only the ad hoc group, which is also its default. The group's slots and queue are full, and the analyst sets bypass_workload_group = true. What happens to the next query?"
  options:
  - id: skips_queue
    text: "It skips the FE's queue and runs in the ad hoc group, under the BE's memory limits"
  - id: admin_only
    text: "The SET fails, because only an administrator may change bypass_workload_group for a session"
  - id: moves_normal
    text: "It runs in normal, without any of the limits of the ad hoc group"
  - id: any_group
    text: "It skips the usage check too, so the analyst may now use the dashboard group"
  answer: skips_queue
  explanation: "The setting skips the FE's queue only: the group stays the same, its usage check applies, and so do the BE's memory limits, which is why the queue is not a boundary that an ordinary user cannot cross. Any user may set it for its session. It does not change the group. Selecting a group without USAGE_PRIV still fails when the query runs."
- id: block_before_run
  objective: "Tell query_timeout, Workload Policy, and SQL Block Rule apart by when and where they act."
  prompt: "An analyst's scans of more than two partitions must be rejected before they run, and the analyst must not be able to lift the restriction. Which mechanism fits?"
  options:
  - id: block_rule
    text: "A partition_num SQL Block Rule that an administrator ties to the account with sql_block_rules"
  - id: session_timeout
    text: "SET query_timeout = 60 in the analyst's session, before each of the scans"
  - id: workload_policy
    text: "A Workload Policy that cancels the analyst's queries after 60000 ms"
  - id: concurrency_one
    text: "max_concurrency 1 on the analyst's group, so that only one of the scans runs at any one time"
  answer: block_rule
  explanation: "A scan rule reads the plan before the query runs and rejects it, and the account property that ties it to the analyst can be set only by an administrator. A timeout cancels a query that is already running, and the analyst can change the session's value. A Workload Policy acts during execution, on elapsed time rather than scan scope. Concurrency limits how many queries run, not what each one scans."
- id: rollback_order
  objective: "Write a resource runbook with groups, routing, protection, observations, and a rollback in dependency order."
  prompt: "An ad hoc group is retired. Two accounts have it as their default, a Workload Policy references it, and a role that has no other purpose holds its USAGE_PRIV. In which order do you remove them?"
  options:
  - id: dependency_order
    text: "The policy, the defaults, the usage grant and role, then the group, each checked"
  - id: group_first
    text: "The group first; Doris then removes the defaults, the policy, and the grants with it"
  - id: defaults_only
    text: "The two defaults only; the policy and the grant do no harm once nobody uses the group"
  - id: keep_grant
    text: "The policy and the group, keeping the role's grant for a later group of the same name"
  answer: dependency_order
  explanation: "Doris refuses to drop a group that a policy references or that is an account's default, and dropping a group leaves the grants of its usage, so the references go first, then the grant and the role, then the group, each checked with its SHOW statement. Dropping the group first fails while the references exist. The policy stays a dependency, and the old grant would come back with a group of the same name, which is also why keeping it is a mistake."
