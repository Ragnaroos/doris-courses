title: "Module 12 Quiz: Publishing, Permissions, and Audit"
description: "Six single-choice questions; no database connection required. View explanations after submitting."
questions:
- id: contract_first
  objective: "Write a consumer contract and choose the object to publish before granting any privilege."
  prompt: "The BI team asks for an account before Monday's dashboard launch. What comes before the GRANT?"
  options:
  - id: contract_object
    text: "A contract naming the object, bi_order_metrics_l2, its grain, meanings, scope, and owners"
  - id: root_password
    text: "Root's password for the launch week, and a narrower account once the dashboard works without errors"
  - id: global_select
    text: "An account with SELECT_PRIV on *.*.*, so that every chart can read what it needs"
  - id: detail_table
    text: "Access to orders_fact_l2, so that each chart can compute its own daily totals"
  answer: contract_object
  explanation: "The grant's object and scope follow from the contract: one semantic view, read only, with owners who approve changes. Root lets the dashboard's users change and drop anything, and its audit records cannot tell them apart. A global SELECT reads every table, also those created later. The detail makes every chart repeat the contract and lets consumers bypass it."
- id: role_select
  objective: "Grant only the needed object privilege through a role, and tell read privileges from administrative ones."
  prompt: "Five people of the BI team must read bi_order_metrics_l2. Which grant fits?"
  options:
  - id: role_select
    text: "SELECT_PRIV on internal.<db>.bi_order_metrics_l2 to a role; the role to the five"
  - id: user_admin
    text: "ADMIN_PRIV to each of the five accounts, since an administrator can read every view"
  - id: role_grant
    text: "GRANT_PRIV on the view to a role, which lets its members read that view and no other object"
  - id: database_scope
    text: "SELECT_PRIV on internal.<db>.* to a role, which covers the view and its sources"
  answer: role_select
  explanation: "SELECT_PRIV is the read privilege and the one view is the scope; a role gives one grant to review and one membership to change per person, and its members can read the view without privileges on its sources. ADMIN_PRIV gives far more than reading. GRANT_PRIV lets an account grant privileges; it does not read data. A database scope covers every table, the view's sources and later tables too."
- id: kinds_of_evidence
  objective: "Tell what SHOW GRANTS, SHOW ROLES, a consumer's queries, a change record, and the audit table each prove."
  prompt: "A reviewer asks whether the dashboard's account actually read the order detail last week. Which evidence answers that?"
  options:
  - id: audit_table
    text: "The account's queries in __internal_schema.audit_log, with their statements, states, and errors"
  - id: show_grants
    text: "SHOW GRANTS FOR the account, which lists the tables that the account has read so far"
  - id: change_record
    text: "The grant's change record, which says which object the account was given"
  - id: show_roles
    text: "SHOW ROLES, which shows each role's members and the tables that they read"
  answer: audit_table
  explanation: "The audit table records what ran, who ran it, and with what outcome, so it answers what the account did. SHOW GRANTS lists what an account may do, its own and its roles' privileges merged, not what it did. A change record documents a change and its reason; it records no queries. SHOW ROLES shows configuration, not execution."
- id: retire_one
  objective: "Retire access by revoking a membership or a role's privilege, and verify the effect as the consumer."
  prompt: "Dashboards A and B read through the same role, and A is retired. What should be revoked, and how is it checked?"
  options:
  - id: membership
    text: "A's membership; then a query as A is refused and one as B still reads"
  - id: role_privilege
    text: "The role's SELECT_PRIV on the view, which removes A's access at once"
  - id: drop_role
    text: "The role itself, since A no longer needs it, and B can request a new role when it needs one"
  - id: root_check
    text: "A's membership; then a query as root confirms that the view is still readable"
  answer: membership
  explanation: "Revoking A's membership affects A alone, and queries as A and as B show the effect on each. Revoking the role's privilege or dropping the role cuts off B too. Root can read everything, so a query as root proves nothing about either consumer."
- id: rollback_window
  objective: "Release a table with a validated cutover, and say when its rollback stops being safe."
  prompt: "A candidate table was reconciled while the writer was paused and swapped in with swap = true. Then the writer resumed and wrote one order. Can the team swap back to the old table now?"
  options:
  - id: not_blindly
    text: "Not before it catches up: the old table lacks the order written after the release"
  - id: yes_atomic
    text: "Yes: the swap is atomic, so a swap back restores exactly the published state"
  - id: yes_retained
    text: "Yes: swap = true kept the old table, and Doris keeps it in step with the published one"
  - id: never
    text: "No: once a table is swapped in and published, it cannot be swapped back"
  answer: not_blindly
  explanation: "The rollback was safe while the writer was paused; after the first write the retained table misses that write, and swapping it back would lose it. Atomic means that readers see one table or the other, not that the old one has the new writes. A retained table does not follow the published one. The swap can be repeated; the data is what makes it unsafe."
- id: rows_columns
  objective: "Choose between table privileges, column privileges, a Row Policy, and masking for a restriction."
  prompt: "The EAST team may read only EAST orders of orders_fact_l2 and must not see paid_amount or refund_amount. Which combination fits?"
  options:
  - id: policy_and_columns
    text: "A Row Policy on region for the team's role, and SELECT_PRIV on the table's other columns only"
  - id: dashboard_filter
    text: "A dashboard filter on region, and charts that leave the two columns out"
  - id: table_select
    text: "SELECT_PRIV on the whole table, since the team's queries will ask only for EAST"
  - id: masking_only
    text: "Masking of the two payment columns, which also hides the orders of the WEST region from the team"
  answer: policy_and_columns
  explanation: "A RESTRICTIVE Row Policy for the role keeps only the EAST rows in every query of its members, and column privileges leave out the two payment columns, so that SELECT * and COUNT(*) are refused too. A dashboard filter is not enforced: a query can still ask for WEST. A table privilege covers every row and column. Masking hides parts of values; it filters no rows."
