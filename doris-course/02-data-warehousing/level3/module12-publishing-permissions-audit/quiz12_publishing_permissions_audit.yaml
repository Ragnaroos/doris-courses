title: "Module 12 Quiz: Publishing, Permissions, and Audit"
description: Six scenario-based single-choice questions. No database connection is required. Submit each answer
  to read feedback on every option.
questions:
- id: q1
  objective: Plan a validated publication cutoff and distinguish safe rollback from a stale retained copy
  prompt: A same-schema replacement table has reconciled with the current table at a paused-writer cutoff. The release
    swaps table names and retains the old copy. Writers then resume and add 12 new orders only to the released table.
    What must happen before using the retained copy as a rollback target?
  options:
  - id: swap_back_now
    text: Swap names back immediately; retaining the old table automatically mirrors later writes.
  - id: compare_column_types
    text: Compare only the column types; a matching schema proves that the old copy contains the new orders.
  - id: catch_up_and_reconcile
    text: Establish a new controlled write boundary, catch up the retained copy and reconcile it before reverting
      the publication.
  - id: revoke_dashboard_role
    text: Revoke the dashboard role; changing reader permissions also copies the missing orders.
  answer: catch_up_and_reconcile
  explanation: 'Rollback must account for the writes since the earlier cutoff, and name replacement alone does
    not perform that catch-up. Retaining the old table preserves the old cutoff; it does not replicate post-release
    writes. Schema compatibility is not data reconciliation. Revoking a role changes authorization, not the retained
    data.'
- id: q2
  objective: Distinguish users, roles, privileges, and object scopes, including data access and administrative privileges
  prompt: Company policy requires an authorization administrator to approve dashboard-access changes. The business
    intelligence (BI) team has five members and will keep growing. Its owner wants to grant newcomers access without
    approval. Which approach follows the policy while reducing repeated per-user configuration?
  options:
  - id: grant_priv
    text: Grant the owner GRANT_PRIV so they can authorize newcomers independently
  - id: admin_priv
    text: Grant the owner ADMIN_PRIV so they can resolve every access problem themselves
  - id: dedicated_role
    text: Create a dedicated role with SELECT_PRIV on the dashboard view; the administrator changes approved
      role memberships
  - id: per_user_grants
    text: Skip roles and grant view SELECT_PRIV to each of the five users separately, revoking each grant when
      they leave
  answer: dedicated_role
  explanation: 'Keep reading privileges separate from administration: define the scope once in a role and change
    its membership after approval. GRANT_PRIV would let the owner change access outside the required approval process,
    and it does not itself supply read access. ADMIN_PRIV provides broad administrative capabilities, including
    reading and changing privileges, far beyond one-view access. Direct per-user grants can follow the approval
    policy, but they duplicate the same configuration and increase the chance of incomplete revocation.'
- id: q3
  objective: Grant only the required object privileges through a dedicated role
  prompt: A dashboard must read only the semantic view bi_order_metrics_l2, with no direct access to order details.
    The same database also contains other teams' tables. Which grant scope meets that requirement?
  options:
  - id: view_only
    text: internal.dw_course_l1_demo.bi_order_metrics_l2, granting only this view
  - id: global_scope
    text: "*.*.*, so future dashboard objects do not require another request"
  - id: database_scope
    text: internal.dw_course_l1_demo.*, covering the entire database
  - id: view_and_base_tables
    text: The view plus daily_order_metrics_l2 and orders_imported, because the view requires its base tables
      to be granted too
  answer: view_only
  explanation: 'Grant SELECT_PRIV on the contract''s view only; a view-only role can query it. The global scope
    *.*.* includes all Catalogs and future objects. A database-wide grant exposes order details and future tables
    in that database. Querying the view does not require direct base-table privileges, and those extra grants would
    let the consumer bypass the interface.'
- id: q4
  objective: Retain release evidence using SHOW GRANTS, SHOW ROLES, and a change record, and distinguish it from
    audit logs
  prompt: After release, the role listing shows that reader can select only sales_view. A temporary ordinary account
    holding the role successfully queries the view and is denied direct access to its base table. The approval system
    has no record of the change. Which conclusion does this evidence support?
  options:
  - id: every_user_verified
    text: Every BI user's access has been verified from every host
  - id: listing_proves_approval
    text: The change was approved because the role listing shows current privileges
  - id: values_reconciled
    text: The view's row count and amount have been reconciled with the business source
  - id: scope_checked_not_approval
    text: The role scope and this test account's access boundary have been checked, but approval has not been
      established
  answer: scope_checked_not_approval
  explanation: 'The role listing describes the scope, and the ordinary account''s positive and negative queries
    describe its access; approval still needs separate evidence. One account''s test does not establish outcomes
    for other identities or hosts. The current configuration does not prove that the change was approved. Access
    tests do not reconcile business values.'
- id: q5
  objective: Distinguish revoking role membership from revoking a role's privileges, and verify the effect of each
  prompt: An old dashboard is retiring. Its account and another team's active dashboard account both hold course_bi_reader_l3
    and need the same view. Neither has another access path. How can only the retiring dashboard lose access?
  options:
  - id: drop_the_role
    text: Drop the role; the active dashboard has already read the view, so future access is unaffected
  - id: revoke_from_retiring_account
    text: Revoke the role only from the retiring account and test both accounts; retain the role and its view
      grant while the active dashboard needs them
  - id: revoke_view_privilege
    text: Revoke the view's SELECT_PRIV from the role; this affects only the retiring dashboard
  - id: edit_dashboard_config
    text: Keep the grant but remove the view name from the old dashboard configuration; direct database queries
      will then be denied
  answer: revoke_from_retiring_account
  explanation: 'Remove only the departing account''s membership, then verify that it is denied while the active
    account still succeeds. Dropping a shared role removes privileges that its active consumers rely on. Revoking
    the role''s privilege affects all of its members. Dashboard configuration is not a database authorization boundary,
    so the account could still query the view directly.'
- id: q6
  objective: Decide when table privileges need column privileges, a Row Policy, or data masking
  prompt: An ordinary analyst account can read the order table. Compliance requires every database query by that
    account to show only orders for its assigned region; all columns of those visible orders may remain readable.
    Which mechanism matches the restriction?
  options:
  - id: row_policy
    text: Apply a region-based Row Policy and verify it using the ordinary account
  - id: revoke_region_column
    text: Revoke access only to the region column so other regions' rows disappear automatically
  - id: mask_region
    text: Mask the region value so other regions' rows are no longer returned
  - id: dashboard_filter
    text: Add a region filter only to the dashboard; it will also constrain direct base-table queries
  answer: row_policy
  explanation: 'A Row Policy restricts rows with a predicate; test it as the intended ordinary consumer. Column
    privileges choose readable columns, not allowed rows. Masking changes how a field is presented rather than removing
    disallowed rows. A dashboard filter controls that dashboard''s queries, not every query issued by the account.'
