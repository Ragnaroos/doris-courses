name: doris-warehousing-course

services:
  doris:
    image: apache/doris:all-in-one-4.1.3
    # Change a host port with the variable before starting Jupyter (dw_course/environment.py).
    ports:
      - "127.0.0.1:${DW_FE_QUERY_PORT:-52030}:9030"
      - "127.0.0.1:${DW_FE_HTTP_PORT:-51030}:8030"
      - "127.0.0.1:${DW_BE_HTTP_PORT:-51040}:8040"
    volumes:
      - fe-meta:/opt/apache-doris/fe/doris-meta
      - be-storage:/opt/apache-doris/be/storage

volumes:
  fe-meta:
  be-storage:
