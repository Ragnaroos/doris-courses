name: doris-warehousing-lake

services:
  silo:
    # Silo (https://github.com/pgsty/silo, AGPLv3) is the MinIO server fork that
    # Pigsty maintains. MinIO no longer publishes community images; Silo reads
    # the same MINIO_* settings and speaks the same S3 API.
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: course_lake
      MINIO_ROOT_PASSWORD: course_lake_local_only
    ports:
      - "127.0.0.1:51900:9000"
    volumes:
      - lake-data:/data
    networks:
      default:
        aliases: [course-lake-silo]
  rest:
    image: apache/iceberg-rest-fixture:1.10.0
    # The local fixture writes SQLite metadata to a Docker-owned named volume.
    user: "0:0"
    environment:
      CATALOG_URI: jdbc:sqlite:/catalog/iceberg.db
      CATALOG_WAREHOUSE: s3://course-warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://course-lake-silo:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: course_lake
      AWS_SECRET_ACCESS_KEY: course_lake_local_only
      AWS_REGION: us-east-1
    ports:
      - "127.0.0.1:51818:8181"
    volumes:
      - lake-catalog:/catalog
    networks:
      default:
        aliases: [course-lake-rest]

volumes:
  lake-data:
  lake-catalog:
