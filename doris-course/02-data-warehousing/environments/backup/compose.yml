name: doris-warehousing-backup
services:
  silo:
    # The same S3-compatible object store as the Lab 4 lake environment:
    # Silo, the MinIO server fork that Pigsty maintains.
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: server /data --console-address :9001
    networks:
      default:
        aliases: [course-backup-silo]
    mem_limit: 512m
    cpus: 1
    environment:
      MINIO_ROOT_USER: course_backup
      MINIO_ROOT_PASSWORD: course_backup_local_only
    # Change the host port with DW_BACKUP_S3_PORT before starting Jupyter (dw_course/environment.py).
    ports:
      - '127.0.0.1:${DW_BACKUP_S3_PORT:-51910}:9000'
    volumes:
      - backup-objects:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  backup-objects:
