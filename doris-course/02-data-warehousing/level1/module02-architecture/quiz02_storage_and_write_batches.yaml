title: "Module 2 Quiz: Doris Storage Architecture and Write Mechanisms"
description: "Six single-choice questions; no database connection required. View explanations after submitting."
questions:
- id: planning_then_execution
  objective: "Trace a query to explain FE planning and BE execution."
  prompt: "EXPLAIN of an order query returns a plan, but running the query fails while a Backend (BE) scans its tablets. What does this show about the Frontend (FE) and BE stages?"
  options:
  - id: planned_then_failed_on_be
    text: "The FE planned the query, and the BE's execution is a later stage that can still fail"
  - id: roles_swapped
    text: "The BE planned the query, and the FE failed while it was scanning the stored order rows"
  - id: explain_proves_scans
    text: "EXPLAIN worked, so every BE scan finished, and the failure must be in the client alone"
  - id: compaction_before_scan
    text: "The FE planned the query, but the BE cannot scan until compaction finishes on its tablets"
  answer: planned_then_failed_on_be
  explanation: "The FE parses and plans the query, and the BEs then run their parts of the plan; a plan can be correct while its execution fails on a BE. Planning is the FE's work and scanning the BE's, not the other way round. EXPLAIN builds a plan without running it, so it proves nothing about scans. Queries read published rowsets whether or not compaction has run."
- id: tablets_rowsets_segments
  objective: "Explain the hierarchy of table, partition, tablet, rowset, and segment."
  prompt: "A new table has three partitions and five buckets per partition, and no materialized views or rollups. Ignoring replicas, which layout should an operator expect?"
  options:
  - id: fifteen_tablets
    text: "Fifteen tablets; each tablet holds rowsets, and each rowset holds segment files"
  - id: five_shared_tablets
    text: "Five tablets shared by all three partitions; each tablet holds the partitions' rowsets"
  - id: three_tablets
    text: "Three tablets, one per partition; the five buckets of each partition are its replicas"
  - id: fifteen_tablets_one_rowset
    text: "Fifteen tablets, each with exactly one rowset and one segment file for its whole life"
  answer: fifteen_tablets
  explanation: "Each bucket of each partition is a tablet, so 3 × 5 = 15 tablets; a tablet holds the rowsets that writes and compactions produced, and a rowset holds segment files. Partitions do not share tablets. Buckets divide a partition into shards; replicas are copies of a tablet, a different thing. The number of rowsets and segments changes with every write and compaction."
- id: visibility_and_compaction
  objective: "Explain when loaded rows become visible, and what compaction changes afterward."
  prompt: "A load's transaction has been published, and a SELECT already returns its rows, but no compaction has run on the tablet yet. Should a dashboard wait for compaction before it reads those rows?"
  options:
  - id: published_rows_queryable
    text: "No: published rows are visible now, and compaction will only merge their files later"
  - id: wait_for_merge
    text: "Yes: rows become reliable only after compaction merges the new files with the old ones"
  - id: wait_for_single_rowset
    text: "Yes: a tablet must hold a single rowset before a query can read it consistently"
  - id: compaction_changes_results
    text: "No, but the dashboard's numbers will change once compaction has merged the rowsets"
  answer: published_rows_queryable
  explanation: "Rows are visible once their transaction is published; compaction merges rowsets in the background afterward and never changes which rows a query returns. Queries already read several rowsets correctly, so waiting for a merge gains nothing. A tablet may hold many rowsets, and that does not make a query inconsistent. Compaction changes how the rows are stored, not the query results, so the dashboard's numbers stay the same."
- id: compare_one_thing_at_a_time
  objective: "Compare batch and row-by-row writes with everything else held constant."
  prompt: "A team compares loading orders in batches of 100 and of 10,000 rows. Both runs give the same results, but the second run also used more buckets. How should they interpret the timings?"
  options:
  - id: control_then_repeat
    text: "Fix the bucket count, the data, and the settings, then compare the two batch sizes again"
  - id: credit_batch_size
    text: "The results match, so any difference in the timings must come from the batch size"
  - id: shortest_time
    text: "Take the shortest time of each run, which removes the effect of the bucket count"
  - id: compare_rowset_counts
    text: "Keep both bucket counts and compare only how many rowsets each run left behind"
  answer: control_then_repeat
  explanation: "When two things change at once, neither can be credited with the difference: hold the bucket count, the data, and the settings fixed, and change only the batch size. Matching results are a precondition, not evidence about speed. The shortest time of each run still mixes both changes. The bucket count changes how rows are spread over tablets, so the rowset counts of the two runs are not comparable either."
- id: versions_and_rowsets
  objective: "Read a tablet's versions and rowsets, and explain what they show about write batches and compaction."
  prompt: "After ten single-row writes to a table with one tablet, SHOW TABLETS shows Version 11, and the tablet's compaction status lists a current rowset [2-11] and ten stale rowsets. What happened?"
  options:
  - id: ten_loads_then_merged
    text: "Ten loads made versions 2 to 11, then compaction merged their ten rowsets into one"
  - id: eleven_orders
    text: "The table holds eleven orders, one per version, and [2-11] lists the IDs of ten"
  - id: compaction_failed
    text: "Compaction failed on the tablet, so the ten stale rowsets must be loaded once more"
  - id: stale_are_replicas
    text: "The stale rowsets are ten replicas of the tablet that queries read during compaction"
  answer: ten_loads_then_merged
  explanation: "An empty tablet starts at version 1, and each load adds one, so ten loads end at version 11; [2-11] is the rowset that cumulative compaction made from versions 2 to 11, and the ten original rowsets stay listed as stale until the BE deletes them. A version is a load, not an order, and [2-11] is a range of versions. Stale rowsets are the merged inputs of a successful compaction, not a failure. Replicas are copies of a tablet on other BEs, not rowsets."
- id: plan_and_profile
  objective: "Use EXPLAIN for what a query plans and the Query Profile for what its scan read."
  prompt: "On a ten-row table sorted by order_id, the query WHERE customer_id = 832 returns one row, and its plan reads 1 of 1 tablets. Its Query Profile shows ScanRows 10 and RowsVectorPredFiltered 9. What does this tell you?"
  options:
  - id: read_ten_dropped_nine
    text: "The scan read all ten rows and the filter dropped nine; the sort key could not narrow it"
  - id: index_skipped_nine
    text: "The sort key's index skipped nine rows, so the scan read only the row that it returned"
  - id: plan_was_wrong
    text: "The plan was wrong, because a query that returns one row should have read only one row"
  - id: nine_rows_deleted
    text: "The query deleted nine rows, since RowsVectorPredFiltered counts the rows that it removed"
  answer: read_ten_dropped_nine
  explanation: "The plan says which tablets the scan will read; the Profile says what it did: ScanRows 10 and RowsVectorPredFiltered 9 mean that it read every row and the filter dropped nine, because customer_id is not part of the sort key. Rows skipped by the sort key's index would appear as RowsKeyRangeFiltered, as they do for WHERE order_id = 1. The plan was right: one tablet, and reading all of its rows is how this filter works. RowsVectorPredFiltered counts rows that a filter dropped from the result, not rows deleted from the table."
