title: "Module 3 Quiz: Doris Table Models, Partitioning, and Bucketing"
description: "Six single-choice questions; no database connection required. View explanations after submitting."
questions:
- id: same_writes_three_models
  objective: "Predict the results of the same input in the Duplicate, Unique, and Aggregate Key models."
  prompt: "Without a Sequence column, the rows (17, 90), (17, 85), and (23, 12) of (order_id, amount) are written in this order, each after the previous one finished, into a Duplicate, a Unique, and an Aggregate Key table whose amount is SUM. What does each table hold?"
  options:
  - id: three_rows_85_175
    text: "Duplicate keeps three rows; order 17 is 85 in the Unique table and 175 in the Aggregate"
  - id: all_keep_latest
    text: "All three tables keep the latest amount of order 17, 85, because each one has key order_id"
  - id: duplicate_rejects
    text: "The Duplicate table rejects the second row of 17; order 17 is 85 in Unique and 175 in Aggregate"
  - id: unique_keeps_larger
    text: "Duplicate keeps three rows; order 17 is 90 in Unique, the larger amount, and 175 in Aggregate"
  answer: three_rows_85_175
  explanation: "Duplicate Key keeps every row, Unique Key keeps the later of two rows with the same key when they are written one after another, and Aggregate Key with SUM adds 90 and 85 into 175. The three models treat the same key differently, so they cannot all keep the latest amount. Duplicate Key uses its key for sorting and rejects nothing. Unique Key does not pick the larger amount: without a Sequence column, the later write wins."
- id: model_and_keys
  objective: "Choose a key model and key columns for detail records, current state, or additive metrics."
  prompt: "A dashboard needs each order's latest status, and an audit needs every distinct status-change event. Retries can resend the same event_id. Which tables keep both answers?"
  options:
  - id: order_id_and_event_id
    text: "A Unique Key table by order_id for the current status, and one by event_id for the events"
  - id: order_id_for_both
    text: "One Unique Key table by order_id for both, since every event belongs to exactly one order"
  - id: aggregate_by_status
    text: "An Aggregate Key table by order_id and status, with SUM, for both the dashboard and the audit"
  - id: duplicate_for_events
    text: "A Unique Key table by order_id, and a Duplicate Key table by event_id that keeps every retry"
  answer: order_id_and_event_id
  explanation: "The current status has one row per order, so its key is order_id; the history has one row per distinct event, so its key is event_id, and a resent event replaces itself instead of adding a row. Keying the history by order_id would keep only one event per order. Summing by status adds up states, which neither question asks for. A Duplicate Key table keeps every retry as another row, so the audit would count resent events twice."
- id: four_design_choices
  objective: "Distinguish partitions, buckets, sort keys, and business unique keys."
  prompt: "A date-partitioned Duplicate Key table is bucketed by HASH(order_id). A retry wrote the same order twice, and a teammate proposes more buckets to remove the copy. Which diagnosis is right?"
  options:
  - id: neither_removes_duplicates
    text: "Partitions pick ranges and buckets spread rows; neither removes a copy: that needs a key or a rule"
  - id: more_buckets_deduplicate
    text: "More buckets put each order alone in its own bucket, so the second copy falls away when it is written"
  - id: sort_key_is_unique
    text: "The sort key already makes order_id unique, so the copy is only shown twice and stores once"
  - id: partition_by_order_id
    text: "Partitioning by order_id instead of the date would keep one row per order in each partition"
  answer: neither_removes_duplicates
  explanation: "Partitioning decides which range a row belongs to and bucketing which tablet stores it; neither decides that two rows are the same order, so removing the copy needs a Unique Key, a business key with versions, or a rule. More buckets only spread the same rows over more tablets. A Duplicate Key table's key orders the rows and keeps both copies. A partition by order_id would still keep both copies, in the same partition."
- id: partition_and_bucket_pruning
  objective: "Read EXPLAIN to tell partition pruning from bucket pruning."
  prompt: "On a table partitioned by date and bucketed by HASH(order_id) into 4 buckets per day, a date filter's plan shows partitions=1/2 and tablets=4/4. Adding order_id = 1 to the filter changes the plan to tablets=1/4. What did each filter do?"
  options:
  - id: date_partitions_id_bucket
    text: "The date pruned the other day's partition; the order ID pruned three of that day's four buckets"
  - id: id_pruned_partitions
    text: "The order ID pruned the partitions, and the date pruned nothing, since dates are not hashed"
  - id: both_prune_partitions
    text: "Both filters pruned partitions; tablets=1/4 means one partition of four is left to read"
  - id: plan_reads_one_row
    text: "The date pruned one partition, and tablets=1/4 means that the query reads exactly one row"
  answer: date_partitions_id_bucket
  explanation: "partitions=1/2 shows partition pruning by the date; tablets=1/4 then counts the tablets of the remaining partition, and an equality filter on the bucketing column leaves the one bucket that can hold order 1. The order ID cannot rule out a day, since every day can hold any order. tablets= counts tablets, not partitions. A tablet holds many rows; the plan does not count rows."
- id: merge_on_write
  objective: "Explain what Merge-on-Write does for a Unique Key table."
  prompt: "A Unique Key table with \"enable_unique_key_merge_on_write\" = \"true\" receives order 1 at 2300.00, then at 2250.00. What does Merge-on-Write do?"
  options:
  - id: marks_old_row_on_write
    text: "When 2250.00 is written, it marks the older row of order 1 as replaced, so queries read only 2250.00"
  - id: merges_at_query_time
    text: "It keeps both rows unmarked until a query asks for order 1, and then returns the larger amount"
  - id: adds_on_write
    text: "It adds the two amounts as they are written, so a query of order 1 reads 4550.00 afterward"
  - id: rejects_second_write
    text: "It rejects the second write, because a Unique Key table accepts each key only once in its life"
  answer: marks_old_row_on_write
  explanation: "Merge-on-Write settles a key's latest row at write time: Doris marks the older row of the same key as replaced, so a query reads each key's latest row without merging at read time, and compaction removes the marked rows later. Without Merge-on-Write a Unique Key table merges at read time, and it returns the later row, not the larger amount. Adding values is what an Aggregate Key table with SUM does. A Unique Key table accepts a key again and keeps the newer row."
- id: smaller_plan_not_speedup
  objective: "Tell a smaller plan from a measured speedup."
  prompt: "Adding order_id = 1 to a date filter changes a query's plan from tablets=4/4 to tablets=1/4, and both queries return order 1. What can the team conclude?"
  options:
  - id: less_planned_work_measure_speed
    text: "The query plans to read one tablet instead of four; whether it runs faster still has to be measured"
  - id: four_times_faster
    text: "The query runs four times faster, because it reads a quarter of the tablets that it read before"
  - id: more_accurate_result
    text: "The result is now more accurate, because fewer tablets hold fewer rows that could be duplicates"
  - id: table_rebucketed
    text: "The table was rebucketed by the filter, so other queries of the table read one tablet too now"
  answer: less_planned_work_measure_speed
  explanation: "A plan shows what a query will read, so fewer tablets predict less work; the time also depends on the tablets' sizes, caching, and fixed costs, and must be measured on the same data and machine. A quarter of the tablets is not a quarter of the time: on ten orders the queries take about the same. Pruning must never change a result, so the answer is not more accurate, only reached with less reading. A filter changes nothing in the table."
