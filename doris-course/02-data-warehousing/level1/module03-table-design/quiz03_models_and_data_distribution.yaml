title: "Module 3 Quiz: Doris Table Models, Partitioning, and Bucketing"
description: "Five single-choice questions; no database connection required. View explanations after submitting."
questions:
- id: q1
  objective: "Predict the results of the same input in the Duplicate, Unique, and Aggregate models."
  prompt: "With the same key design and no Sequence column, write (order_id, amount) rows (17,90), (17,85), and (23,12) in order, waiting for each write to succeed and become visible before the next. The Aggregate amount column declares SUM. Which result is correct?"
  options:
  - id: all_keep_latest
    text: "All three models retain the latest amount of 85 for order 17"
  - id: three_rows_85_175
    text: "Duplicate retains three rows; order 17 is 85 in Unique and 175 in Aggregate"
  - id: duplicate_rejects
    text: "Duplicate rejects duplicate keys; order 17 is 85 in Unique and 175 in Aggregate"
  - id: unique_keeps_larger
    text: "Duplicate retains three rows; order 17 keeps the larger amount of 90 in Unique and 175 in Aggregate"
  answer: three_rows_85_175
  explanation: "Duplicate retains all three detail rows, Unique retains the later value 85 under these sequential-write conditions, and Aggregate sums 90 and 85 into 175 for order 17. The models have different write semantics, so they cannot all be read as keeping the latest snapshot. Duplicate Key uses its keys for sorting, not for rejecting repeated business keys. Unique does not select the largest amount; the amount is not a version, and 175 is not the current order amount."
- id: q2
  objective: "Choose logical keys and table models for detail records, current state, or aggregate metrics."
  prompt: "A merchant needs the latest status per order for a dashboard and every distinct status-change event for audit. A network retry can resend the same event_id. Which keys preserve both grains?"
  options:
  - id: order_id_for_both
    text: "Use order_id as the unique key for both the current-state table and event history"
  - id: keys_swapped
    text: "Use event_id as the unique key for the current-state table and order_id for event history"
  - id: order_id_and_stable_event_id
    text: "Use order_id as the unique key for the current-state table and a stable event_id for event history"
  - id: new_event_id_per_delivery
    text: "Use order_id as the unique key for the current-state table and generate a new event_id for every redelivery in event history"
  answer: order_id_and_stable_event_id
  explanation: "Keyed by order_id, the current-state table has one row per order, and keyed by a stable event_id, the history has one row per distinct event; redeliveries of the same event still use the original ID. Keying the history by order_id as well makes the events of one order overwrite each other, so the history is incomplete. Swapping the keys leaves the current-state table with one row per event, while the history loses earlier events of the same order. A new event_id for every redelivery disguises a duplicate delivery as a new business event, breaking event deduplication."
- id: q3
  objective: "Distinguish the roles of partitions, buckets, sort keys, and business unique keys."
  prompt: "A date-partitioned Duplicate Key table is hashed by order_id. A retry appends the same order twice, and a teammate proposes adding buckets to remove the duplicate. Which diagnosis is right?"
  options:
  - id: layout_does_not_deduplicate
    text: "Date partitions choose ranges and hash buckets distribute rows; neither removes a repeated business event, so deduplication needs its own key or rule"
  - id: partition_makes_unique
    text: "The date partition already makes order_id globally unique, so the second row must only be a display artifact"
  - id: more_buckets_deduplicate
    text: "More hash buckets will keep only one copy of each order_id when the retry is loaded"
  - id: compaction_keeps_latest
    text: "A Duplicate Key sort key keeps only the latest retry after Compaction finishes"
  answer: layout_does_not_deduplicate
  explanation: "Partition and bucket choices organize data, and a Duplicate Key sort key orders it; none of them is a business-event deduplication rule. A date partition is not a global uniqueness constraint. Hashing the same order_id places the matching rows in one shard but does not remove either row, however many buckets there are. Compaction preserves Duplicate Key rows; it does not turn the model into Unique Key."
- id: q4
  objective: "Use EXPLAIN to compare scan ranges with date filters and bucket-key filters."
  prompt: "A reviewer compares a date-filter query with the same query plus order_id equality on a date-partitioned, HASH(order_id) table. Both return one row. What plan evidence distinguishes the filters' scan effects?"
  options:
  - id: returned_rows
    text: "Look only at the final number of returned rows and treat it as the scan volume"
  - id: total_bucket_count
    text: "Look only at the total bucket count specified at table creation and assume every query scans all Tablets"
  - id: identical_plan_text
    text: "Compare only whether the plan text is identical word for word, without analyzing the ranges corresponding to the filters"
  - id: partitions_and_tablets
    text: "Compare the selected partitions and Tablet ranges, distinguishing date pruning from bucket pruning"
  answer: partitions_and_tablets
  explanation: "Comparing the selected partitions and Tablet ranges lets you observe the two types of pruning separately: the date condition prunes partitions, and order_id equality prunes buckets. Returned rows are not scanned rows, nor do they indicate how many shards were read. Applicable filters can prune partitions and Tablets, so the total bucket count does not equal the scan range of every query. Plan representations may change across versions; understand the selected ranges rather than comparing the text word for word."
- id: q5
  objective: "Verify results using both detail records and amounts, without equating plan pruning with performance gains."
  prompt: "A candidate current-order view returns four order IDs and a total amount of 200, matching an independent extract. A downstream report filters by status, but one order's status differs from the extract. EXPLAIN scans fewer Tablets than before. What should release review conclude?"
  options:
  - id: totals_prove_statuses
    text: "Publish: matching order count and amount prove that every status is correct"
  - id: fewer_tablets_prove_all
    text: "Publish: fewer planned Tablets prove both business correctness and lower actual latency"
  - id: reconcile_then_measure
    text: "Reconcile the status mismatch row by row, then measure actual runtime under the same workload"
  - id: ignore_status_mismatch
    text: "Ignore the status mismatch because a matching total is sufficient for a status-filtered report"
  answer: reconcile_then_measure
  explanation: "Status affects the report population, so reconcile the detail first and test performance separately with runtime evidence. Equal counts and totals can hide a wrong field value. EXPLAIN describes planned pruning, not actual latency or business correctness. A matching total today does not make an incorrect status safe for a status-filtered report."
