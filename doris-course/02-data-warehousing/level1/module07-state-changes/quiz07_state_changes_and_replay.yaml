title: "Module 7 Quiz: Data Updates, Deletion, and Event Replay"
description: Five single-choice questions; no database connection required. View explanations after submitting.
questions:
- id: q1
  objective: Distinguish the keys and purposes of current order state, event history, and raw deliveries.
  prompt: One order has a current status, a payment event, and three deliveries of that same event after retries. An auditor needs to explain the latest state, distinct business events, and delivery attempts separately. Which storage split answers all three questions?
  options:
  - id: current_table_only
    text: The current table records the latest state, so it can replace all event history and redelivery records
  - id: overwrite_by_order_id
    text: Overwrite current state, history, and deliveries by order_id to reduce duplicates
  - id: new_event_id_per_delivery
    text: Generate a new event_id for every redelivery so history counts every delivery
  - id: three_separate_layers
    text: The current table answers what is true now, event history answers what happened, and delivery records answer how many attempts were made
  answer: three_separate_layers
  explanation: "Each question needs its own grain; this course uses order_id, event_id, and attempt_id with delivery_id to represent the current state, the business events, and the delivery attempts. The latest state overwrites old values, so it cannot reconstruct all events and attempts. An order has multiple events and deliveries, and overwriting them all by order_id loses facts at each level. A duplicate delivery is not a new business event; a new event_id breaks event deduplication, and delivery counts belong in the delivery layer."
- id: q2
  objective: Use business versions to explain the handling of duplicate and out-of-order events.
  prompt: Full-state events for order 701 arrive in this order—version 8 delivered, version 6 paid, version 7 shipped, then a redelivery of the same version 7 event. How should the current table and event history change?
  options:
  - id: shipped_and_every_delivery
    text: The current state ends as shipped, and history appends a record for every delivery
  - id: delivered_and_latest_event
    text: The current state remains delivered, and history keeps only the version 8 event
  - id: delivered_and_three_events
    text: The current state remains delivered, and history keeps three events by stable event ID
  - id: arrival_order_as_version
    text: Use the sequence of four arrivals as version numbers and take the state with the highest arrival number
  answer: delivered_and_three_events
  explanation: "Full states are resolved by business version, so delivered at version 8 stays current; history is deduplicated by stable event ID, and deliveries can be recorded separately. Arrival order cannot replace business versions, and a redelivery is not a new business event. Late events still have historical value, so history keeps them. A local arrival sequence still allows a late old state to overwrite a newer one."
- id: q3
  objective: Distinguish partial column updates from full-row writes that omit fields.
  prompt: Order 52 currently has status CREATED, version 4, amount 75.00, and region NORTH. A status-only update to PAID at version 5 omits amount and region. How can the team verify that a partial column update preserved those fields?
  options:
  - id: verify_partial_update
    text: Enable partial updates, use an increasing version, verify that the omitted amount and region stay unchanged, and restore the setting afterward
  - id: full_row_write
    text: Use a normal full-row write while omitting other fields, assuming omission automatically preserves old values
  - id: check_status_only
    text: Enable partial updates and check only the status; treat omitted fields reverting to defaults as success
  - id: lower_version
    text: Enable partial updates and use a lower version, assuming the setting bypasses Sequence resolution
  answer: verify_partial_update
  explanation: "Enable partial updates, verify the new status and version alongside the unchanged 75.00 amount and NORTH region, then restore the session setting. Omitting fields from a normal full-row write does not promise to preserve their old values. Checking only the status misses an accidental change to an omitted field. Partial updates do not disable version resolution; a lower business version should not overwrite a higher one."
- id: q4
  objective: Distinguish soft deletion, SQL deletion, and physical file reclamation.
  prompt: A paid order is cancelled and later refunded. Operations wants cancelled orders hidden from an active-order report, while finance must retain the refund trail. A teammate also assumes hiding a row immediately frees disk space. Which explanation fits these requirements?
  options:
  - id: flag_hides_rows
    text: After setting is_deleted, an ordinary SELECT automatically hides the order
  - id: filter_delete_and_retain
    text: Soft deletion requires query filtering, SQL DELETE changes row visibility, and refund facts should still be retained
  - id: delete_frees_disk
    text: If a row cannot be queried after SQL DELETE, its physical files have been reclaimed immediately
  - id: keep_net_amount_only
    text: After a successful refund, delete the order and payment records; keeping only the net amount is sufficient for reconciliation
  answer: filter_delete_and_retain
  explanation: "The three requirements concern a business marker, logical visibility, and financial facts: soft deletion needs a query filter, SQL DELETE changes row visibility, and the refund facts stay. is_deleted is a business field in this course, so queries need an explicit filter or a view that encapsulates it. Query invisibility after SQL DELETE does not mean disk space is released immediately; physical reclamation is a separate process. Deleting the order and payment records loses the links among orders, payments, and refunds, and a net amount cannot replace traceable reconciliation records."
- id: q5
  objective: Verify recovery through repeated replay, row-by-row comparison, and independent business transaction records.
  prompt: A replayable workflow writes an order's PAID event to history, then crashes before updating current state. A corresponding payment record is available from an independent source. After recovery, what evidence would show the whole workflow is consistent?
  options:
  - id: replay_and_reconcile
    text: Replay the unfinished steps, compare current state and history by event and order, and reconcile with the independent payment record
  - id: skip_existing_event
    text: If event_id already exists in history, skip subsequent current-state and business transaction steps
  - id: delivery_count_unchanged
    text: If the delivery count has not increased after recovery, conclude that all business data has been correctly restored
  - id: assume_atomic_writes
    text: If event history was written successfully, conclude that the current table and independent business transaction records were also committed atomically
  answer: replay_and_reconcile
  explanation: "Recovery must finish or safely repeat each step, then compare the expected event, the current order state, and the independent payment fact without duplicating business results. The history write may have succeeded while the later writes did not, so skipping them preserves the gap. Delivery counts describe attempts, not the correctness of the business tables. Separate writes do not become an atomic multi-table transaction merely because history was written."
