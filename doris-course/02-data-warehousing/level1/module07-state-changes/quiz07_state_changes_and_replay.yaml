title: "Module 7 Quiz: Data Updates, Deletion, and Event Replay"
description: "Six single-choice questions; no database connection required. View explanations after submitting."
questions:
- id: three_grains
  objective: "Distinguish the keys and purposes of current state, event history, and raw deliveries."
  prompt: "One order has a current status, one payment event, and three deliveries of that same event after retries. An auditor must explain the latest state, the distinct events, and the delivery attempts separately. Which split of tables answers all three?"
  options:
  - id: current_history_deliveries
    text: "A current table by order_id, a history by event_id, and a delivery log that keeps every attempt"
  - id: one_table_by_order
    text: "One table by order_id that keeps the latest row, since the latest state also explains the events"
  - id: one_table_by_event
    text: "One table by event_id that keeps every delivery, from which the latest state is chosen by time"
  - id: deliveries_only
    text: "A delivery log only, since every event and every state can be rebuilt from the deliveries later"
  answer: current_history_deliveries
  explanation: "Each question has its own grain: the latest state is one row per order, the history one row per distinct event, and the delivery log one row per attempt, so three keys answer three questions. A table of latest rows loses the events. A table by event_id keeps each event once, so it cannot also count three deliveries, and arrival time does not decide which state is newest. Rebuilding everything from deliveries on every query moves the work and the version logic into every query."
- id: versions_decide
  objective: "Use business versions to resolve duplicate and out-of-order events."
  prompt: "Full-state events for order 701 arrive in this order: version 8 DELIVERED, version 6 PAID, version 7 SHIPPED, then the same version 7 event again. The current table uses event_version as its Sequence column. What do the current table and the history hold?"
  options:
  - id: delivered_three_events
    text: "The current table shows DELIVERED, and the history keeps three distinct events by event ID"
  - id: last_arrival_wins
    text: "The current table shows SHIPPED, the last arrival, and the history keeps four events"
  - id: highest_amount_wins
    text: "The current table shows whichever event has the highest amount, and the history keeps three"
  - id: duplicate_breaks_order
    text: "The redelivery makes the current table show SHIPPED again, and the history keeps four events"
  answer: delivered_three_events
  explanation: "The Sequence column keeps the highest version of each order, 8, DELIVERED, whatever the arrival order, and the history keyed by event_id keeps the three distinct events, the redelivery replacing itself. Arrival order decides nothing when versions are set. The amount is not a version. A redelivered event at version 7 is still lower than version 8, and its event ID is already in the history."
- id: partial_update
  objective: "Distinguish partial column updates from full-row writes that omit fields."
  prompt: "Order 52 is CREATED at version 4, with amount 75.00 and region NORTH. An update sets only its status to PAID at version 5. How can the team be sure that the amount and region are kept?"
  options:
  - id: enable_partial_update
    text: "Turn on partial updates, write the key, status, and version, check all four columns, and restore the setting"
  - id: omit_columns_is_enough
    text: "Write an INSERT with only the key, status, and version, since Doris keeps the old values of columns left out"
  - id: write_without_version
    text: "Turn on partial updates and write only the key and the status, since a partial update does not need a new version"
  - id: delete_then_insert
    text: "Delete order 52 first, then insert it with the new status, and copy the amount and region from yesterday's report"
  answer: enable_partial_update
  explanation: "A partial column update, turned on with enable_unique_key_partial_update on a Merge-on-Write Unique Key table, merges the supplied columns into the existing row; checking all four columns shows the kept ones, and the setting is restored afterwards. Without that setting, an INSERT with left-out columns writes a full row with defaults or NULL in them. With a Sequence column, the update needs a higher version to win over version 4. Deleting and reinserting from a report replaces facts with a copy that may be out of date."
- id: kinds_of_deletion
  objective: "Distinguish soft deletion, SQL DELETE, a load's delete mark, and physical reclamation."
  prompt: "A paid order is cancelled and then refunded. Operations wants cancelled orders hidden from an active-order report, finance must keep the refund trail, and a teammate thinks that hiding a row frees its disk space at once. Which explanation fits?"
  options:
  - id: flag_delete_and_keep_facts
    text: "A flag hides rows only from queries that filter on it, DELETE removes them from all queries, and the refund is kept"
  - id: delete_the_refund
    text: "Delete the order and its payment and refund with DELETE, which removes the rows and frees their space at the same moment"
  - id: delete_mark_frees_space
    text: "Load the order again with a delete mark, which removes the key and returns its disk space to the BE immediately"
  - id: soft_delete_frees_space
    text: "Set a business flag on the order, which hides it from every query and lets compaction drop its files at once"
  answer: flag_delete_and_keep_facts
  explanation: "A business flag such as is_deleted keeps the row and hides it only where queries filter on it, which suits an active-order report; DELETE removes rows from every query; a refund is a fact to keep, not to delete. Deleting the payment and refund erases the trail that finance needs, and no deletion frees space at once: compaction reclaims it later. A load's delete mark deletes the key for queries, and its space is also reclaimed later. A flag hides nothing from a query that does not filter on it."
- id: replay_after_interruption
  objective: "Recover from an interrupted multi-table write by replaying the whole batch."
  prompt: "A workflow writes each event first to the history table and then to the current table. It crashed after writing an event to the history but before the current table. What recovers both tables correctly?"
  options:
  - id: replay_whole_batch
    text: "Replay the whole batch: the history keeps each event once, and versions keep the newest state"
  - id: skip_events_in_history
    text: "Replay only the events that are not yet in the history, since those in it are already done"
  - id: rebuild_current_by_time
    text: "Copy the event with the latest arrival time of each order from the history to the current table"
  - id: patch_by_hand
    text: "Edit the current table by hand from the event that the workflow was writing when it crashed"
  answer: replay_whole_batch
  explanation: "Because the history is keyed by event_id and the current table resolves versions, writing an event again changes nothing that was already right, so replaying the whole batch completes every step that was missing. Skipping events found in the history skips exactly the current-table write that never happened. Arrival time does not identify the newest state. A hand edit fixes one order and leaves no repeatable recovery."
- id: reconcile_with_ledger
  objective: "Reconcile current state with independent payment, refund, and shipment records."
  prompt: "After the replay, orders_current shows 250.00 paid and 150.00 refunded in total. How can the team show that these amounts are right?"
  options:
  - id: compare_with_independent_ledger
    text: "Compare each order with its items, payments, and refunds in the independently kept ledger"
  - id: replay_again
    text: "Replay the events a third time, and accept the totals if they stay the same as before"
  - id: count_records
    text: "Check that the history has more records than the current table has orders"
  - id: non_negative_net
    text: "Check that paid minus refunded is not negative for any of the current orders"
  answer: compare_with_independent_ledger
  explanation: "An independent ledger, kept by another system, is evidence that the replay cannot shape: each order's amount must equal its items, its paid amount its payments, and its refunded amount its refunds. A third replay of idempotent writes repeats the same result, right or wrong. Record counts say nothing about amounts. Net receipts that are not negative can still be wrong."
