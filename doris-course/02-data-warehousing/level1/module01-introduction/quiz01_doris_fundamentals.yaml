title: "Module 1 Quiz: Meet Doris and Analyze Your First Orders"
description: "Five single-choice questions; no database connection required. View explanations after submitting."
questions:
- id: q1
  objective: "Distinguish between completing a transaction and analyzing a batch of orders."
  prompt: "A retailer is separating checkout requests from a report over last month's orders. Which request belongs to the analytical workload?"
  options:
  - id: submit_and_deduct
    text: "Submit an order and deduct inventory in the same business operation"
  - id: summarize_orders_by_date
    text: "Scan a batch of orders and calculate order counts and total amounts by date"
  - id: address_lookup
    text: "Look up an order's current address for a user to confirm and change"
  - id: record_payment_status
    text: "Record a payment result and update that order's status"
  answer: summarize_orders_by_date
  explanation: "Scanning and summarizing multiple orders by date is analytics, even if only a few rows are returned. Placing an order and deducting inventory completes a transaction, not cross-order analysis. Looking up one order's address uses SELECT, but this point lookup serves a transaction rather than analytics. Recording a payment result and updating the order's status touches more than one field or table, but that does not make it analytical work either."
- id: q2
  objective: "Explain Doris's role between business databases and analytics users."
  prompt: "An online shop must keep checkout responsive while analysts explore hourly sales trends. Which division of work fits this requirement?"
  options:
  - id: source_transactions_doris_analytics
    text: "The source system handles transactions, while Doris receives business data and provides queries for analytics users"
  - id: reuse_transaction_designs
    text: "After connecting with the MySQL protocol, all transaction designs from the source business database can be reused directly"
  - id: doris_only_stores
    text: "Doris only stores data; report computations must still run in the source business database"
  - id: connection_syncs_changes
    text: "Once the Doris connection is configured, subsequent changes to source business tables synchronize continuously"
  answer: source_transactions_doris_analytics
  explanation: "The source system continues to process transactions, while Doris receives the business data and handles analytics in this course. Compatibility with the MySQL protocol does not imply identical transaction semantics, features, or suitable workloads. Doris itself provides analytical computation and queries; it is not merely a passive copy of the source business database. A configured connection only establishes access; continuous synchronization of source changes still requires ingestion tasks and the corresponding configuration."
- id: q3
  objective: "Explain the responsibilities of Frontend (FE) and Backend (BE) in a storage-compute integrated environment."
  prompt: "A SQL client sends an order aggregation to the course's storage-compute integrated Doris cluster. Before diagnosing a slow scan, which Frontend (FE) and Backend (BE) responsibilities should the team expect?"
  options:
  - id: fe_scans_be_persists
    text: "FE stores metadata and performs detail scans, while BE only persists files"
  - id: client_splits_plan
    text: "The client splits the distributed execution plan, and FE forwards each fragment to BE"
  - id: fe_stores_table_data
    text: "FE stores internal table data, while BE caches hot data and returns query results"
  - id: fe_plans_be_executes
    text: "FE receives SQL and plans and coordinates queries, while BE stores internal table data and executes the plan"
  answer: fe_plans_be_executes
  explanation: "FE receives SQL and plans and coordinates the query, while BE stores internal table data and executes the plan. This is the division of responsibilities in this section's storage-compute integrated environment and should not be applied directly to every deployment mode. FE manages metadata, but BE performs the detail scans and computation. The client only submits SQL; FE generates and coordinates the distributed plan. Saying that FE stores internal table data confuses metadata with user table data; BE stores internal table data in a storage-compute integrated environment."
- id: q4
  objective: "Connect to Doris and execute SQL to create tables, insert data, and aggregate by group."
  prompt: "Each row in orders_sample represents one order. How should you query order counts and amounts by date with a consistent sort order?"
  options:
  - id: group_by_order_id
    text: "Group by order_id, calculate COUNT(*) and SUM(order_amount), then sort by date"
  - id: group_by_date_count_sum
    text: "Group by order_date, calculate COUNT(*) and SUM(order_amount), then sort by date"
  - id: sort_without_grouping
    text: "Sort directly by order_date and output each order ID and amount row by row"
  - id: group_by_date_average
    text: "Group by order_date, calculate COUNT(*) and AVG(order_amount), then sort by date"
  answer: group_by_date_count_sum
  explanation: "GROUP BY order_date sets date-level granularity, COUNT and SUM calculate the metrics, and ORDER BY ensures display order; the count relies on one row per order. Grouping by order ID keeps order-level granularity rather than producing daily summaries. ORDER BY alone only sorts; it does not combine orders from the same day into one row. AVG gives the average order amount and cannot replace the daily total."
- id: q5
  objective: "Validate data using details, row counts, and amounts, and distinguish pre-tax order amounts from payments received."
  prompt: "A store exports 20 sample orders with a pre-tax total of 8600 yuan. The exported fields contain no payment information. Which conclusion is supported by the data?"
  options:
  - id: whole_day_total
    text: "All orders at this store that day total 8600 yuan"
  - id: all_unpaid
    text: "All 20 orders are unpaid, and payments received total zero"
  - id: sample_pre_tax_total
    text: "This sample's pre-tax order amount is 8600 yuan"
  - id: every_amount_correct
    text: "Every amount in this sample is correct because the total is 8600 yuan"
  answer: sample_pre_tax_total
  explanation: "The supported conclusion is limited to the sample and its pre-tax order amount. The sample does not represent all of the store's transactions for the entire day. The absence of payment fields does not imply that the orders are unpaid. A matching total can still hide offsetting errors in individual records."
