title: "Module 1 Quiz: Meet Doris and Analyze Your First Orders"
description: "Six single-choice questions; no database connection required. View explanations after submitting."
questions:
- id: transaction_or_analysis
  objective: "Distinguish completing a transaction from analyzing a batch of orders."
  prompt: "A retailer separates checkout requests from a report on last month's orders. Which request belongs to the analytical workload?"
  options:
  - id: submit_and_deduct
    text: "Submit an order and deduct its items from inventory in one business operation"
  - id: summarize_orders_by_date
    text: "Read a month of orders and count them and total their amounts by date"
  - id: address_lookup
    text: "Look up one order's delivery address so that the customer can confirm or change it"
  - id: record_payment_status
    text: "Record a payment result and update the status of the order that it paid for"
  answer: summarize_orders_by_date
  explanation: "Reading many orders and summarizing them by date is analysis, even when the result is a few rows. Submitting an order and deducting inventory completes one transaction. Looking up one order's address uses SELECT, but it serves the customer's transaction, not an analysis across orders. Recording a payment and updating an order's status changes one business object, which is also transaction work."
- id: doris_between_systems
  objective: "Explain Doris's role between business databases and analytics users."
  prompt: "An online shop must keep checkout fast while analysts explore hourly sales trends over two years of orders. Which division of work fits?"
  options:
  - id: source_transactions_doris_analytics
    text: "The shop's database handles checkout; Doris receives the order data and answers the analysts' queries"
  - id: doris_handles_checkout
    text: "Doris replaces the shop's database for checkout, since it can also answer the analysts' queries"
  - id: analysts_query_source
    text: "The analysts query the shop's database directly, and Doris keeps a backup copy of its tables"
  - id: doris_only_stores
    text: "Doris stores the orders, and the shop's database computes the hourly trends from Doris's copy"
  answer: source_transactions_doris_analytics
  explanation: "The business database keeps doing the transactions, and Doris receives the order data and does the analytical work, so heavy analysis does not slow checkout. Doris is an analytical database, not a replacement for the checkout database. Analysts querying the shop's database directly is exactly the load that slows checkout, and a backup copy answers no query. Doris computes on the data it stores; the trends are its work, not the source database's."
- id: fe_and_be_roles
  objective: "Explain what the Frontend (FE) and the Backend (BE) do in an integrated storage and compute deployment."
  prompt: "A SQL client sends an order aggregation to the course's sandbox, which uses the integrated storage and compute architecture. Which split of the work between the Frontend (FE) and the Backend (BE) should the team expect?"
  options:
  - id: fe_plans_be_executes
    text: "The FE receives the SQL and plans the query; the BE stores the data and runs the plan"
  - id: fe_scans_be_persists
    text: "The FE keeps the metadata and scans the order rows; the BE only writes the files to disk"
  - id: client_splits_plan
    text: "The client splits the query into a plan, and the FE forwards each piece of it to the BE"
  - id: fe_stores_table_data
    text: "The FE stores the tables' data, and the BE keeps a cache of the hot data and returns results"
  answer: fe_plans_be_executes
  explanation: "The FE receives the SQL, manages the metadata, and plans and coordinates the query, while the BE stores the tables' data and scans, filters, and aggregates it; in the integrated storage and compute architecture the BE does both storing and computing. The FE manages metadata but does not scan the data. The client only sends SQL: the FE builds the distributed plan. The tables' data lives on the BE, not on the FE."
- id: what_the_mysql_protocol_gives
  objective: "Explain what connecting with the MySQL protocol gives you, and what it does not."
  prompt: "A team connects its MySQL client and a BI tool with a MySQL driver to Doris, and both work. SELECT VERSION() returns 5.7.99. Which conclusion is right?"
  options:
  - id: tools_send_sql_only
    text: "The tools can send SQL to Doris; data still has to be loaded, and Doris's SQL is its own"
  - id: doris_mirrors_mysql
    text: "Doris now mirrors the team's MySQL database and keeps its tables up to date on its own"
  - id: everything_like_mysql_57
    text: "Doris behaves like MySQL 5.7 in every statement and setting, as its version number says"
  - id: mysql_server_retired
    text: "The team's MySQL server now keeps its tables in Doris, so that it can be shut down"
  answer: tools_send_sql_only
  explanation: "The MySQL protocol lets MySQL clients and drivers connect and send SQL; loading or synchronization still has to bring the data in, and Doris's SQL, table models, and settings are its own. A connection copies no data, so nothing is mirrored. 5.7.99 is the protocol version that Doris reports to MySQL clients, not a promise of MySQL 5.7 behavior; the Doris version is in SHOW FRONTENDS and SHOW BACKENDS. Connecting to Doris changes nothing about the MySQL server or its tables."
- id: filter_and_group_by_date
  objective: "Write SQL that filters orders and summarizes them by date."
  prompt: "Each row of orders_sample is one order. Which query returns, for each date, the number of orders of at least 300 and their total amount, sorted by date?"
  options:
  - id: where_then_group_by_date
    text: "WHERE order_amount >= 300, GROUP BY order_date, with COUNT(*) and SUM(order_amount), ORDER BY order_date"
  - id: group_by_order_id
    text: "WHERE order_amount >= 300, GROUP BY order_id, with COUNT(*) and SUM(order_amount), ORDER BY order_date"
  - id: order_by_without_group
    text: "WHERE order_amount >= 300 and ORDER BY order_date, listing each order's ID and amount, one row per order"
  - id: average_instead_of_sum
    text: "WHERE order_amount >= 300, GROUP BY order_date, with COUNT(*) and AVG(order_amount), ORDER BY order_date"
  answer: where_then_group_by_date
  explanation: "WHERE keeps the orders of at least 300 before grouping, GROUP BY order_date makes one row per date, COUNT(*) counts the orders because the table has one row per order, SUM totals their amounts, and ORDER BY sorts the dates. Grouping by order_id keeps one row per order, not per date. ORDER BY alone only sorts; it does not combine a day's orders into one row. AVG gives the average order amount, not the total."
- id: what_an_amount_shows
  objective: "Tell what an order's pre-tax amount measures, and what the total of a sample can and cannot show."
  prompt: "A store exports 20 sampled orders whose pre-tax amounts total 8,600.00. The export has no payment fields. Which conclusion does the data support?"
  options:
  - id: sample_pre_tax_total
    text: "The 20 sampled orders amount to 8,600.00 before tax"
  - id: whole_day_total
    text: "All the store's orders that day amount to 8,600.00 before tax"
  - id: all_unpaid
    text: "None of the 20 orders is paid, since the export shows no payments"
  - id: amount_received
    text: "The store received 8,600.00 from these customers for the orders"
  answer: sample_pre_tax_total
  explanation: "The data supports a statement about the sample and about its pre-tax order amounts: what was ordered, before tax. A sample of 20 orders says nothing about the store's other orders that day. A missing payment field does not mean that the orders are unpaid: the export simply holds no payment data. An order amount is what was ordered, not money received; payments need payment or account data."
